<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anansi</title>
<link rel="manifest" href="/web/app.webmanifest">
<link rel="icon" href="/web/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0A0A0C; --ink:#F3ECE0; --body:#EAE3D6; --narr:#C9C1B2;
  --dim:#8A8478; --faint:#7C766C;  /* was #635E56 — labels and notes were near-invisible */ --rule:#2A2721; --edge:#2C2820;
  --gold:#D9B26A; --gold-dim:#9A8B62; --on-gold:#100D08;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#08080a;color:var(--body);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center}
#frame{width:390px;height:844px;max-width:100vw;max-height:100vh;position:relative;
  overflow:hidden;background:var(--ground);border:1px solid var(--edge);border-radius:44px;
  box-shadow:0 40px 140px rgba(0,0,0,.75)}
@media(max-width:430px),(max-height:860px){#frame{border:0;border-radius:0;width:100vw;height:100dvh;box-shadow:none}}
#wash{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 45% at 20% 8%,rgba(150,105,195,.30),transparent 70%),
             radial-gradient(80% 50% at 90% 30%,rgba(217,178,106,.14),transparent 72%),
             linear-gradient(180deg,#141119 0%,#0B0A0D 45%,#09090B 100%)}
.status{position:relative;display:flex;justify-content:space-between;padding:16px 26px 0;
  font-size:13px;font-weight:500;color:#CFC7B8}
header{position:relative;display:flex;align-items:center;gap:14px;padding:16px 20px 14px;
  border-bottom:1px solid rgba(255,255,255,.05);background:rgba(10,9,12,.5);backdrop-filter:blur(18px)}
header .ic{font-size:19px;color:#CFC7B8;background:0;border:0;cursor:pointer;padding:0 2px}
header .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
header .t{font-family:var(--serif);font-size:21px;color:var(--ink);line-height:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8E846F}
#feed{position:relative;padding:22px 22px 190px;display:flex;flex-direction:column;gap:20px;
  height:calc(100% - 118px);overflow-y:auto;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.narr{font-family:var(--serif);font-style:italic;font-size:17.5px;line-height:1.6;color:var(--narr);
  white-space:pre-wrap;outline:0;border-radius:4px}
.narr:focus{background:rgba(217,178,106,.07)}
.turn{display:flex;flex-direction:column;gap:8px}
.turn.you{align-items:flex-end}
.who{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:#BCA97F}
.turn.you .who{color:#7E786F}
.dot{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,#6B4E8C,#2A2036)}
.bub{border-radius:18px 18px 18px 6px;padding:15px 17px;font-size:15.5px;line-height:1.55;color:var(--body);
  background:linear-gradient(140deg,rgba(120,88,160,.30),rgba(40,32,54,.55));
  border:1px solid rgba(180,150,220,.16);backdrop-filter:blur(14px);white-space:pre-wrap;outline:0}
.turn.you .bub{max-width:80%;border-radius:18px 18px 6px 18px;background:rgba(217,178,106,.10);
  border:1px solid rgba(217,178,106,.26);color:#F0E7D5}
.rule{display:flex;align-items:center;gap:12px;padding:2px 0}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}
.rule span{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#5E594F}
.pend{position:relative}
.pend::before{content:'';position:absolute;left:-12px;top:2px;bottom:2px;width:2px;
  background:var(--gold);border-radius:2px;opacity:.7}
#dock{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 24px;
  background:linear-gradient(180deg,rgba(9,9,11,0),rgba(9,9,11,.92) 30%);backdrop-filter:blur(16px)}
.modes{display:flex;gap:6px;padding:0 4px 12px;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.mode{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 16px;border-radius:999px;
  border:1px solid var(--rule);color:var(--dim);background:0;cursor:pointer;white-space:nowrap;font-family:var(--sans)}
.mode[aria-pressed=true]{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:500}
.composer{display:flex;align-items:flex-end;gap:12px;border:1px solid var(--rule);border-radius:22px;
  padding:11px 12px 11px 16px;background:rgba(20,19,22,.8)}
.composer textarea{flex:1;background:0;border:0;outline:0;color:#EDE6D8;font:15px/1.45 var(--sans);
  resize:none;max-height:120px;padding:2px 0}
.send{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--gold);color:var(--on-gold);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.4}
.acts{display:flex;gap:8px;padding:10px 4px 0}
.act{flex:1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:9px;border-radius:999px;
  border:1px solid var(--rule);background:0;color:var(--dim);cursor:pointer;font-family:var(--sans)}
.act.keep{border-color:var(--gold);color:var(--gold)}
#sheet{position:absolute;inset:0;background:rgba(6,6,8,.72);backdrop-filter:blur(8px);
  display:none;flex-direction:column;justify-content:flex-end;z-index:20}
#sheet.on{display:flex}
.panel{background:#0E0D10;border:1px solid var(--edge);border-radius:26px 26px 0 0;
  max-height:88%;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.ph{display:flex;align-items:center;gap:12px;padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.ph b{flex:1;font-family:var(--serif);font-size:20px;font-weight:400;color:var(--ink)}
.ph button{background:0;border:0;color:var(--gold);font:12px/1 var(--sans);letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;padding:6px}
.pb{padding:8px 20px 28px;overflow-y:auto}
.grp{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin:18px 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.05);
  background:0;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;
  color:var(--body);font:14px/1.3 var(--sans)}
.row .g{width:22px;color:var(--gold-dim);font-size:15px;flex:none}
.row .l{flex:1}
.row .v{color:var(--dim);font-size:12.5px}
label{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:14px 0 5px}
input,textarea,select{width:100%;background:#141317;border:1px solid var(--rule);border-radius:12px;
  padding:11px 13px;color:var(--body);font:14px/1.45 var(--sans);outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--gold-dim)}
textarea{resize:vertical;min-height:74px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.key{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid rgba(217,178,106,.3);
  color:var(--gold);background:rgba(217,178,106,.07);display:flex;gap:7px;align-items:center}
.key button{background:0;border:0;color:var(--gold-dim);cursor:pointer;font-size:12px;padding:0}
.big{width:100%;margin-top:20px;padding:14px;border-radius:999px;background:var(--gold);color:var(--on-gold);
  border:0;font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.ghost{background:0;border:1px solid var(--rule);color:var(--dim)}
.danger{color:#C97A6A;border-color:rgba(201,122,106,.3)}
.ent{border:1px solid var(--rule);border-radius:16px;padding:13px 15px;margin-bottom:9px;cursor:pointer}
.ent .n{font-size:14.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
.ent .k{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim)}
.ent .d{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.pill{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:999px;
  border:1px solid var(--rule);color:var(--faint)}
.pill.on{border-color:rgba(217,178,106,.35);color:var(--gold)}
.meter{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;display:flex;margin:10px 0 6px}
.meter i{display:block}
.err{color:#C97A6A;font-size:12.5px;padding:10px 0}
.note{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:8px}
</style></head><body>
<div id="frame"><div id="wash"></div>
  <div class="status"><span id="clock">9:41</span><span style="letter-spacing:.12em">▮▮▮ ⌁</span></div>
  <header>
    <button class="ic" id="menuBtn" aria-label="Menu">☰</button>
    <div class="mid"><div class="t" id="title">…</div><div class="eyebrow" id="chap"></div></div>
    <button class="ic" id="setBtn" aria-label="Settings">⚙</button>
  </header>
  <div id="feed"></div>
  <div id="dock">
    <div class="modes" id="modes"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Speak, or direct…"></textarea>
      <button class="send" id="send" aria-label="Send">↑</button>
    </div>
    <div class="acts" id="acts" hidden>
      <button class="act keep" id="keep">Keep</button>
      <button class="act" id="regen">Regenerate</button>
      <button class="act" id="discard">Discard</button>
    </div>
  </div>
  <div id="sheet"><div class="panel"><div class="ph"><b id="pt"></b><button id="pclose">Close</button></div><div class="pb" id="pb"></div></div></div>
</div>
<!-- ponytail: manifest only, no service worker. SPEC §13 M7 warns service workers and
     streaming POSTs interact badly, and the manifest is the half that gates installation.
     Add a worker (bailing out of the fetch handler for non-GET) only when offline reading
     is actually wanted, and verify streaming survives it the same day. -->
<script type="module" src="./web/phone.js"></script>
</body></html>
