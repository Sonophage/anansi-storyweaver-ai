  <path d="M40 10L70 40 40 70 10 40z" stroke="#c8a252" stroke-width="1.2"/>
  <path d="M40 0l2.5 4h-5zM40 80l-2.5-4h5zM0 40l4-2.5v5zM80 40l-4 2.5v-5z" fill="#c8a252"/>
</svg>
