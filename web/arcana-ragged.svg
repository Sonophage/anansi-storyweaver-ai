<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" preserveAspectRatio="none">
  <!-- A mask with a painted edge: white inside, torn at the border, so a picture under it reads as
       laid on with a brush rather than cut out with a blade. -->
  <defs>
    <filter id="tear" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="384" height="384" fill="#fff" filter="url(#tear)"/>
</svg>
