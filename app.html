/* EVERY SLIDER, THIN AND ROUNDED (Seth, 2026-11-03: "all sliders should be thin and also rounded"):
   a 4px track with round ends and a small round thumb, in the theme's accent, drawn the same in
   Chromium and Firefox. The input itself stays 24px tall, so the finger has the room the thin track
   does not. Firefox also fills the track up to the thumb; Chromium has no part for that. */
input[type="range"] { -webkit-appearance:none; appearance:none; height:24px; background:transparent; cursor:pointer; accent-color:var(--gold); }
input[type="range"]::-webkit-slider-runnable-track { height:4px; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--gold) 35%, var(--chip)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:14px; height:14px;
  margin-top:-5px; border:0; border-radius:var(--r-pill); background:var(--gold); }
input[type="range"]::-moz-range-track { height:4px; border:0; border-radius:var(--r-pill);
  background:color-mix(in srgb, var(--gold) 35%, var(--chip)); }
input[type="range"]::-moz-range-progress { height:4px; border-radius:var(--r-pill); background:var(--gold); }
input[type="range"]::-moz-range-thumb { width:14px; height:14px; border:0; border-radius:var(--r-pill); background:var(--gold); }
input[type="range"]:focus-visible { outline:2px solid var(--gold-lit); outline-offset:2px; border-radius:var(--r-pill); }

/* ===== ARCANA ===================================================================================
   Seth, 2026-11-03: "black grey and gold ... the gold and filigree is what i do want to keep as well
   as the texture of things ... claire obscure with that watercolor paint brush feeling ... tarot,
   arcane", and then "a bit more into the arcane and a bit more into the art deco".

   ARCANA IS THE APP'S STYLING UNDER EVERY THEME (Seth, 2026-11-03: "Arcana everywhere, then
   default"). Everything here is what a THEMES row cannot say: the painted grounds, the gilt
   corners, the tarot arch, the numerals and suits, the type. None of it keys on a theme any more:
   every theme in THEMES (web/model.js) is a colour set, and Arcana is the shipped one. Every
   rule is `html:root ...`, which is the specificity the theme attribute selector it replaced
   had, so nothing here wins or loses a fight it did not before.
   EVERY GILT FILE IS A MASK filled with `--gold`, the theme's accent, so the line-work takes each
   theme's colour (test/app.ts ORNAMENT-MASK). What is neutral stays an image: the paper's grain
   (laid under every theme's page by themeVars), the moon and the dry brush.

   GOLD STAYS WHAT ADR 0004 SAYS IT IS. The one filled press on a screen is gold, now with a dry
   brush in it. The ornament — rules, corners, the arch, the sunburst — is gilt line-work, which is
   neither a label nor a state nor a press. Labels, tags, the page you are on and every count stay
   in ink; the page you are on has the ink rule beside it, and nothing under it.

   THE TEXTURES ARE SVG, web/arcana-*.svg: turbulence filters, not pictures, so each is a few
   hundred bytes, scales to any screen and is served by the same static path as icon.svg.
   ================================================================================================ */
/* THE CORNERS: a card is cut nearly square, 3px (`--r-tight`), for the stepped gilt to sit in; a
   control keeps the app's own rounding (`--r`, the pill), which the ornament does not touch (Seth,
   2026-11-03: "round the corners of buttons and inputs like I had on the original"). */
html:root :is(.card, .lbanner, #col .plate, .storycard, .resumeband > .glass, :is(.pocketlist, .stringlist) .pocketrow) { border-radius:var(--r-tight); }
html:root {
  --arc-deco:'Poiret One','IBM Plex Sans',system-ui,sans-serif;     /* titles: thin geometric capitals */
  --arc-small:'Josefin Sans','IBM Plex Sans',system-ui,sans-serif;  /* labels and the menu's words */
  --arc-serif:'Cormorant Garamond','EB Garamond',Georgia,serif;     /* a scene's title and its line */
  --lift:0 1px 2px rgba(0,0,0,.32), 0 8px 22px -6px rgba(0,0,0,.55); /* a box over the paper */
}
/* BOXES LIFT OFF THE PAGE (Seth, 2026-11-03): every card, the side panel, the boxes you type in and the
   composer carry one soft shadow, so each sits over the painted paper and not in it. The composer's
   box is `#inputWrap`, so the textarea inside it is left out, and the mode dial keeps its inset ring
   (`#modes select`, above). The shadow is outside the box, so a card's gilt corners, drawn inside it,
   are untouched. A menu row on the page you are on keeps its ink line (`.arted[aria-current]`). A
   shelf card and the Library's hero are not here: each already has its own deeper shadow. */
html:root :is(.card, .lbanner, :is(.pocketlist, .stringlist) .pocketrow, #rail .railrow, #rail .railtile,
  #sideInner, #inputWrap, textarea:not(#input), select:not(#modes select),
  input:is(:not([type]), [type="text"], [type="search"], [type="number"], [type="url"], [type="email"], [type="password"])) { box-shadow:var(--lift); }
html:root #rail .railrow.arted[aria-current] { box-shadow:inset 2px 0 0 var(--ink-bright), var(--lift); }

/* THE GROUNDS. The page's is the row's wash; the menu, the side panel and the sheets get the same
   painted canvas over their own colour, so nothing is flat. The side panel's is on
   #sideInner, NOT #side: on a phone #side is the dimmed veil over the whole page, laid out even
   while closed, and a ground on it covered the page (it did, on the first try). */
html:root :is(#rail, #sideInner, #appearance, #pocketPanel, #mergePanel) {
  background-image:url('/web/arcana-canvas.svg'); background-size:cover; background-position:center; }

/* THE CORNERS, one gilt vocabulary everywhere: four stepped corners on a card. EVERY GILT FILE IS A MASK filled with the theme's accent
   (`background:var(--gold)`), so the line-work is gold under Arcana, rose under Romance, steel under
   Sci-fi; a file with the gold baked in would be gold under all of them. The corners are on a card's
   ::after, laid over it and taking no taps; the cards that use their own ::after are left out (a
   tall thread card draws its own, below; a deck card's says Yes or No). */
html:root :where(#sideBody .card, #appearance .card, #page .card.plate, .resumeband > .glass):not(.thtall, .deckcard) { position:relative; }
html:root :is(#sideBody .card, #appearance .card, #page .card.plate, .resumeband > .glass):not(.thtall, .deckcard)::after {
  content:''; position:absolute; inset:0; pointer-events:none; background:var(--gold);
  -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat; }
/* NO RULE UNDER A HEADER (Seth, 2026-11-03: "we can remove the triangle divider in the header where
   the title is, from everywhere", then "gilt lines and chevron will be removed"). The top bar and a
   side panel's head had a chevron divider under the title, and the hairline it replaced; neither
   is drawn. The same holds for the menu's model, the Library's title and a scene's head, below.
   test/app.ts NO-DIVIDER. */
html:root :is(#sideHead, #bar) { border-bottom-color:transparent; }

/* THE TYPE. Titles in thin deco capitals, labels in a geometric sans; the prose is untouched and
   keeps whatever font the writer picked in Look. */
html:root #bar .bare-btn .serif,
html:root .resumeband .bandtitle,
html:root .storycard .art .serif {
  font-family:var(--arc-deco); font-weight:400; text-transform:uppercase; letter-spacing:.16em; }
html:root :is(#bar .up, .resumeband .herokind, .resumeband .herocount, .band-num,
  #col .block .from, .railhead, .kicker) { font-family:var(--arc-small); letter-spacing:.3em; }
/* A tag is a short word in a row of them: at .3em each chip read twice its width (Seth, 2026-11-03).
   Out of the list above, whose `#col` made it outrank any rule for a tag on its own. */
html:root .tag { font-family:var(--arc-small); letter-spacing:.14em; }
/* Tighter where the line is short: a book's name in the bar, and the hero's "where you left off". */
html:root #bar .bare-btn .serif { letter-spacing:.08em; }
html:root .resumeband .herokind { letter-spacing:.1em; }
@media (max-width:719px) { html:root #sideInner { border-top-color:var(--gold-dim); } }

/* THE LIBRARY'S HERO IS A TAROT CARD: an arched top, a double gilt frame inside it, a sunburst
   rising behind the title where the breathing rings were. */
html:root .resumeband {
  border-radius:min(46vw, 300px) min(46vw, 300px) var(--r-tight) var(--r-tight) / 210px 210px var(--r-tight) var(--r-tight);
  border-color:var(--gold-dim); }
html:root .resumeband::before,
html:root .resumeband::after { content:''; position:absolute; pointer-events:none; z-index:2;
  border-radius:inherit; }
html:root .resumeband::before { inset:6px; border:1px solid var(--gold); }
html:root .resumeband::after { inset:11px; border:1px solid var(--gold-dim); opacity:.55; }
html:root .resumeband > .rings > i { display:none; }
html:root .resumeband > .rings::before { content:''; position:absolute; width:460px; height:230px;
  left:-230px; top:-200px; background:var(--gold); opacity:.8;
  -webkit-mask:url('/web/arcana-sunburst.svg') center / contain no-repeat;
  mask:url('/web/arcana-sunburst.svg') center / contain no-repeat; }
html:root .resumeband .bandtitle { font-size:clamp(30px, 10vw, 56px); }

/* No cover: the card's back. A watercolour bloom in the accent under a constellation, on the painted
   canvas, in place of a plain gradient: the bloom on the shade's ::before, the stars on its ::after
   (which a cover's hero uses for the same stars, below). */
html:root .resumeband:not(.haspic) { background:url('/web/arcana-canvas.svg') center / cover, var(--sheet); }
html:root .resumeband:not(.haspic) > .wash::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--gold); opacity:.55; -webkit-mask:url('/web/arcana-wash.svg') 50% 30% / 125% auto no-repeat;
  mask:url('/web/arcana-wash.svg') 50% 30% / 125% auto no-repeat; }
html:root .resumeband:not(.haspic) > .wash::after { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--gold); -webkit-mask:url('/web/arcana-stars.svg') 50% 16% / 88% auto no-repeat;
  mask:url('/web/arcana-stars.svg') 50% 16% / 88% auto no-repeat; }

/* A SHELF CARD WITH NO COVER gets the same back. `.bare` is written by the card's renderer when
   there is no cover: the art carries its cover or its gradient inline, so only a class can tell
   the two apart, and only the bare one is overridden. */
html:root .storycard { border-color:var(--edge-lit); }
html:root .storycard .art.bare {
  background:url('/web/arcana-moon.svg') 50% 34% / 54px 54px no-repeat,
    url('/web/arcana-canvas.svg') center / cover, var(--sheet) !important; }
/* Its bloom and sunburst in the accent, on the shade over it: the art's own ::after is its spine. */
html:root .storycard .art.bare > .fade::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--gold); opacity:.5; -webkit-mask:url('/web/arcana-wash.svg') 50% 34% / 120% auto no-repeat;
  mask:url('/web/arcana-wash.svg') 50% 34% / 120% auto no-repeat; }
html:root .storycard .art.bare > .fade::after { content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--gold); opacity:.7; -webkit-mask:url('/web/arcana-sunburst.svg') 50% 26% / 120% auto no-repeat;
  mask:url('/web/arcana-sunburst.svg') 50% 26% / 120% auto no-repeat; }

/* THE HEAD OF A SCENE IS A TAROT TITLE (Seth, 2026-11-03, his reference "SCENE IX / The Drake's
   Key"): centred, under a half sunburst rising from a small arc; "SCENE IX" in spaced capitals with
   the number in Roman numerals; the title large in a high-contrast serif; the scene's line in its
   italic, with no bar beside it and no rule under it (the dividers left on 2026-11-03, NO-DIVIDER).
   The sunburst is the gilt file as a mask in the accent, like every ornament here. */
html:root .band { align-items:center; text-align:center; gap:12px; padding:4px 0 8px; }
html:root .band-sun { display:block; width:min(400px, 78%); aspect-ratio:3 / 1; margin:0 0 -4px;
  background:var(--gold); opacity:.6;
  -webkit-mask:url('/web/arcana-sunburst.svg') center bottom / contain no-repeat;
  mask:url('/web/arcana-sunburst.svg') center bottom / contain no-repeat; }
html:root .band-num { font-size:15px; letter-spacing:.42em; margin-right:-.42em; color:var(--mute); }
html:root .band-title { font-family:var(--arc-serif); font-weight:500; font-size:58px; line-height:1.05;
  color:var(--ink-bright); letter-spacing:.005em; }
html:root .band-epi { justify-content:center; max-width:560px; }
html:root .band-epi i { display:none; }
html:root .band-epi span { font-family:var(--arc-serif); font-style:italic; font-size:24px; line-height:1.35; color:var(--mute); }
@media (max-width:719px) { html:root .band-sun { width:min(240px, 70%); }
  html:root .band-num { font-size:12px; } html:root .band-title { font-size:36px; }
  html:root .band-epi span { font-size:19px; }}

/* A GLYPH PER ACTION (Seth, 2026-11-03, his reference "≈ WOVEN"): the chip over a passage carries a
   small line glyph before its spaced capitals, one per label, in place of the dot. This is the one
   table. `data-press` is the label the chip shows (`pressOf`, web/model.js), and test/app.ts
   PRESS-GLYPH holds the table to every label `pressOf` can return, one each, no file twice. The glyph
   is a mask in the accent, like every ornament; the words keep the colour of the rule beside them.
     woven      two threads in a wave: the model wove it.
     speak      a speech bubble: words said aloud.
     act        a bolt: a deed done.
     direct     a four-pointed star: the bearing Anansi was given.
     narrate    a quill: the writer told it.
     coop       two rings joined: two writers taking turns.
     continue   three chevrons: the tale running on.
     yours      a seal: the writer's own hand, from before modes were kept.
     spoken     a voice in bars: a line someone spoke.
     anansi     the spider: Anansi wrote it, from before modes were kept. */
html:root .from[data-press="woven"]    { --glyph:url('/web/arcana-glyph-woven.svg'); }
html:root .from[data-press="speak"]    { --glyph:url('/web/arcana-glyph-speak.svg'); }
html:root .from[data-press="act"]      { --glyph:url('/web/arcana-glyph-act.svg'); }
html:root .from[data-press="direct"]   { --glyph:url('/web/arcana-glyph-direct.svg'); }
html:root .from[data-press="narrate"]  { --glyph:url('/web/arcana-glyph-narrate.svg'); }
html:root .from[data-press="coop"]     { --glyph:url('/web/arcana-glyph-coop.svg'); }
html:root .from[data-press="continue"] { --glyph:url('/web/arcana-glyph-continue.svg'); }
html:root .from[data-press="yours"]    { --glyph:url('/web/arcana-glyph-yours.svg'); }
html:root .from[data-press="spoken"]   { --glyph:url('/web/arcana-glyph-spoken.svg'); }
html:root .from[data-press="anansi"]   { --glyph:url('/web/arcana-glyph-anansi.svg'); }
html:root .from { gap:12px; }
html:root .from > i { width:18px; height:18px; border-radius:0; background:var(--gold);
  -webkit-mask:var(--glyph) center / contain no-repeat; mask:var(--glyph) center / contain no-repeat; }

/* A PANEL BESIDE THE PAGE OPENS ON A BANNER (Seth, 2026-11-03, his reference "TALE ... CLOSE"). A band
   across the panel's head: the tale's picture dimmed and greyed (or the painted paper), a sunburst
   rising from its foot, and a gilt diamond on its foot holding the panel's own mark. Under it the
   panel's name large in the thin deco capitals at the left and CLOSE in spaced capitals at the right;
   the tabs under that are spaced capitals with no boxes, the one you are on bright. Only beside the
   page: full screen keeps the header it had (`data-sidefull`, set by drawSide). The band is laid
   over the head's top padding, so the row of presses keeps its own flex line.
   THE PANEL'S MARK, one row each, is this one table, keyed on the band's `data-mark` (the panel's
   key; `read` for an open thread). test/app.ts PANEL-MARK holds it to every panel that opens beside
   the page, one each, no file twice.
     story      Tale            the moon, as in Seth's reference.
     threads    Threads         the web the threads are spun into.
     read       a thread, Read  a needle and its thread.
     chapter    This scene      a candle: the one scene, lit.
     chapters   Scenes          an open book.
     search     Prose search    the Hermit's lantern, that seeks.
     waiting    Workbench       the anvil, where the work is done.
     strings    Strings         the lyre.
     anansi     Talk            the spider, who is Anansi.
     context    What he reads   an open eye.
     teller     Storyteller     the Star, eight-pointed.
     history    Alterations     the hourglass: what was before.
     updates    What the update moved   a wheel turning. */
html:root .pbanner[data-mark="story"]    { --mark:url('/web/arcana-mark-moon.svg'); }
html:root .pbanner[data-mark="threads"]  { --mark:url('/web/arcana-mark-web.svg'); }
html:root .pbanner[data-mark="read"]     { --mark:url('/web/arcana-mark-needle.svg'); }
html:root .pbanner[data-mark="chapter"]  { --mark:url('/web/arcana-mark-candle.svg'); }
html:root .pbanner[data-mark="chapters"] { --mark:url('/web/arcana-mark-book.svg'); }
html:root .pbanner[data-mark="search"]   { --mark:url('/web/arcana-mark-lantern.svg'); }
html:root .pbanner[data-mark="waiting"]  { --mark:url('/web/arcana-mark-anvil.svg'); }
html:root .pbanner[data-mark="strings"]  { --mark:url('/web/arcana-mark-lyre.svg'); }
html:root .pbanner[data-mark="anansi"]   { --mark:url('/web/arcana-mark-spider.svg'); }
html:root .pbanner[data-mark="context"]  { --mark:url('/web/arcana-mark-eye.svg'); }
html:root .pbanner[data-mark="teller"]   { --mark:url('/web/arcana-mark-star.svg'); }
html:root .pbanner[data-mark="history"]  { --mark:url('/web/arcana-mark-hourglass.svg'); }
html:root .pbanner[data-mark="updates"]  { --mark:url('/web/arcana-mark-wheel.svg'); }
/* THE BAND SHOWS BESIDE THE PAGE, AND ON A PHONE EVEN THOUGH EVERY PANEL IS FULL THERE (Seth, 2026-11-03:
   "put back the nice ray header we had on those panels"). drawSide sets `data-sidebanner`. A desk in
   full screen keeps the plain header. */
html:not([data-sidebanner="1"]) #sideHead > .pbanner { display:none; }
/* It wraps: the name keeps its whole width, and when it and the presses do not fit on one line (Threads,
   with its count and its ＋, in a 400px drawer) the presses take a second line, at the right. */
html[data-sidebanner="1"] #sideHead { --band:124px; padding-top:calc(var(--band) + 50px); padding-bottom:10px;
  flex-wrap:wrap; row-gap:10px; }
html[data-sidebanner="1"] #sideHead > .pbanner { display:block; position:absolute; left:0; right:0; top:0;
  height:var(--band); pointer-events:none; animation:none;
  background:url('/web/arcana-canvas.svg') center / cover, var(--rail); }
html:root .pbanner > .pbpic { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center 30%;
  opacity:.26; filter:grayscale(.7) blur(1.5px);
  -webkit-mask-image:linear-gradient(to bottom, #000 30%, rgba(0,0,0,.4)); mask-image:linear-gradient(to bottom, #000 30%, rgba(0,0,0,.4)); }
/* The sunburst rises from the band's foot behind the diamond. */
html:root .pbanner::before { content:''; position:absolute; z-index:1; left:50%; bottom:0; width:min(560px, 100%); height:100%;
  transform:translateX(-50%); background:var(--gold); opacity:.8;
  -webkit-mask:url('/web/arcana-sunburst.svg') center bottom / 100% 100% no-repeat;
  mask:url('/web/arcana-sunburst.svg') center bottom / 100% 100% no-repeat; }
/* The diamond on the foot: the dark it holds, then its gilt (a mask in the accent); the mark over it in
   the bright ink, as the moon in the reference is pale. */
html:root .pbanner > .pbmark { position:absolute; z-index:2; left:50%; bottom:-30px; width:60px; height:60px; margin-left:-30px; }
html:root .pbanner > .pbmark::before { content:''; position:absolute; inset:0;
  background:color-mix(in srgb, var(--doc-bg) 92%, transparent); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
html:root .pbanner > .pbmark::after { content:''; position:absolute; inset:0; background:var(--gold);
  -webkit-mask:url('/web/arcana-diamond.svg') center / contain no-repeat; mask:url('/web/arcana-diamond.svg') center / contain no-repeat; }
html:root .pbanner::after { content:''; position:absolute; z-index:3; left:50%; bottom:-14px; width:28px; height:28px; margin-left:-14px;
  background:var(--ink-bright); -webkit-mask:var(--mark) center / contain no-repeat; mask:var(--mark) center / contain no-repeat; }
/* The name, large and thin, and CLOSE in spaced capitals. */
html[data-sidebanner="1"] #sideHead > .panelname { font-family:var(--arc-deco); font-weight:400; text-transform:uppercase;
  font-size:34px; line-height:1.1; letter-spacing:.18em; flex:0 0 auto; max-width:100%; }
html[data-sidebanner="1"] #sideHead > .caps-btn { font-family:var(--arc-small); font-size:13px; letter-spacing:.3em; margin-right:-.3em; margin-left:auto; }
/* THE TABS, spaced capitals with no boxes, the one you are on bright. One row that scrolls sideways
   when the names are wider than the panel. Each tab is still a 44px box to the finger, the words
   centred in it (28px tall until 2026-11-03, measured short on a phone by test/ui/targets.js), and
   it reaches half the gap to either side (Tale is 39px of words); the row's padding holds the reach
   of the first and last tab, and its margins give that padding back, so the words do not move. */
html[data-sidebanner="1"] #sideBody :is(.row-6:has(> [data-storytab], > [data-chaptab], > [data-tellertab]), .tabrow) {
  gap:22px; overflow-x:auto; scrollbar-width:none; padding:0 11px; margin-left:-11px; margin-right:-11px; }
html[data-sidebanner="1"] #sideBody :is([data-storytab], [data-chaptab], [data-tellertab], .tabchip) {
  flex:0 0 auto; min-height:44px; padding:0 11px; margin:0 -11px; border:0; border-radius:0; background:none; box-shadow:none;
  font-family:var(--arc-small); font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--dim); }
html[data-sidebanner="1"] #sideBody :is([data-storytab], [data-chaptab], [data-tellertab], .tabchip)[aria-pressed="true"] { color:var(--ink-bright); }
html[data-sidebanner="1"] #sideBody :is([data-storytab], [data-chaptab], [data-tellertab], .tabchip):hover { color:var(--gold); }
@media (max-width:719px) {
  html[data-sidebanner="1"] #sideHead { --band:96px; padding-top:calc(var(--band) + 44px); }
  html[data-sidebanner="1"] #sideHead > .panelname { font-size:26px; letter-spacing:.14em; }
  html[data-sidebanner="1"] #sideBody :is([data-storytab], [data-chaptab], [data-tellertab], .tabchip) { font-size:12px; letter-spacing:.18em; } }
/* A SHORT SCREEN HAS NO BANNER. Under 480px of height (a phone with its keyboard up, a square phone)
   the banner's 96px left a panel's body too little room: 36px on a 360x360 screen with the keyboard
   up, and the box being typed in sat under the keyboard. The header is the name alone there. */
@media (max-height:480px) {
  html[data-sidebanner="1"] #sideHead { --band:0px; padding-top:18px; }
  html[data-sidebanner="1"] #sideHead > .pbanner { display:none; } }

/* THE SCENE'S FIRST LETTER, illuminated: deco capital in a gilt box over a wash of gold. Still
   ::first-letter, for the reason above the rule it extends: the passage is contenteditable. */
html:root #col .block.opening .narr::first-letter {
  font-family:var(--arc-deco); color:var(--ink-bright); font-size:52px; line-height:1;
  padding:6px 10px 4px; margin:4px 12px 0 0; border:1px solid var(--gold);
  background:radial-gradient(closest-side, color-mix(in srgb, var(--gold) 38%, transparent), transparent); }
@media (max-width:719px) { html:root #col .block.opening .narr::first-letter { font-size:40px; padding:5px 8px 3px; } }

/* THE PRESSES. The one gold button keeps its gold and its pill, and gains a dry brush across it. The
   composer's quill is the exception: it is a gilt seal (THE QUILL IS A GILT SEAL, below). */
html:root :is(.btn:not(.ghost), #send.stopping, .rerollbox .rwgo) {
  background-image:url('/web/arcana-brush.svg'); background-size:100% 100%; background-repeat:no-repeat; }


/* THE QUILL IS A GILT SEAL (Seth, 2026-11-03: no brush on it, "more arcane"). Still the screen's one
   gold press (ADR 0004) and still the 60px circle: a gold fill a shade deeper at its rim, a fine ring
   of the dark inside its edge, a faint sixteen-rayed sigil under the quill (web/arcana-sigil.svg, a
   mask in the dark on the gold), and a gilt ring just outside it. The quill stays in the dark ink on
   top. Its states stay apart: OPEN (the box is up) is the outer ring and the sigil in gold with no
   fill; HELD is pressed in and lit; WRITING keeps its glow (thinkglow, above), which is a shadow and
   so does not touch the rings. */
html:root #quill { position:relative; isolation:isolate;
  background:radial-gradient(circle at 50% 38%, var(--gold-lit), var(--gold) 58%, color-mix(in srgb, var(--gold) 72%, #000) 100%);
  transition:transform var(--t) var(--ease), filter var(--t) var(--ease); }
html:root #quill > svg { position:relative; z-index:1; transform:translateY(-17.5%) scaleY(-1); }
html:root #quill::before { content:''; position:absolute; inset:3px; border-radius:50%; pointer-events:none;
  background:var(--on-gold); opacity:.42;
  -webkit-mask:url('/web/arcana-sigil.svg') center / 100% 100% no-repeat; mask:url('/web/arcana-sigil.svg') center / 100% 100% no-repeat; }
html:root #quill::after { content:''; position:absolute; inset:-6px; border-radius:50%; pointer-events:none;
  border:1px solid var(--gold-dim); }
html:root #quill:active:not(:disabled) { transform:scale(.93); filter:brightness(1.12); }
html:root #quill[aria-expanded="true"] { background:none; border:1px solid var(--gold); color:var(--gold); }
html:root #quill[aria-expanded="true"]::before { background:var(--gold); opacity:.5; }
html:root #quill[aria-expanded="true"]::after { border-color:color-mix(in srgb, var(--gold) 45%, transparent); }

/* THE MENUS. Nothing under the model, the tiles as small square cards, the page you are on in
   the bright ink with the ink rule beside it (ADR 0004) and nothing under it (Seth, 2026-11-03:
   "remove that underline overall"), every row's picture with a painted edge, and the rune wheel
   faint at the foot of the rail where the list runs out. */
html:root .talemodel > button[data-modelmenu] { border-bottom-color:transparent; }
html:root .talemodel > button[data-modelmenu] .txt > span:first-child {
  font-family:var(--arc-deco); font-size:17px !important; letter-spacing:.1em; }
html:root #rail .taletiles > .railtile:not([aria-pressed="true"]) {
  border:1px solid var(--edge) !important; background-color:rgba(11,11,12,.4) !important; }
html:root #rail .taletiles > .railtile[aria-current] {
  border-color:var(--edge-lit) !important; color:var(--ink-bright) !important;
  box-shadow:inset 2px 0 0 var(--ink-bright), var(--lift); }
html:root .railtile > .txt { font-family:var(--arc-small); letter-spacing:.04em; }
html:root .arted > .rowart {
  -webkit-mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat;
  mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat; }
html:root #rail::after { content:''; position:absolute; left:50%; bottom:24px; z-index:-1;
  width:240px; height:240px; margin-left:-120px; pointer-events:none; opacity:.14;
  background:var(--gold); -webkit-mask:url('/web/arcana-runes.svg') center / contain no-repeat;
  mask:url('/web/arcana-runes.svg') center / contain no-repeat; }
/* THE MENUS' LISTS ARE CARDS (Seth, 2026-11-03: the tale menu's Scenes and the main menu's Tales "to
   match Arcana ... not the plain rows they are now"). Each row is a small card: a hairline frame cut
   nearly square, the stepped gilt corners on its ::before (a row with a picture keeps its ::after for
   the picture's shade), the painted canvas where there is no picture, the name in the deco face, and a
   scene's numeral over its name in the label face (`roman`, web/model.js). The page you are on keeps
   its ink rule (ADR 0004); its frame is the dim gilt. */
html:root #rail .railrow { position:relative; isolation:isolate; display:flex; flex-direction:column;
  justify-content:center; gap:3px; margin-bottom:6px; padding:9px 11px;
  border:1px solid var(--edge); border-radius:var(--r-tight);
  background:url('/web/arcana-canvas.svg') center / cover, var(--sheet); }
html:root #rail .railrow[aria-current] { border-color:var(--gold-dim); }
html:root #rail .railrow::before { content:''; position:absolute; inset:2px; pointer-events:none;
  background:var(--gold); opacity:.7;
  -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 12px no-repeat, url('/web/arcana-corner-tr.svg') top right / 12px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 12px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 12px no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 12px no-repeat, url('/web/arcana-corner-tr.svg') top right / 12px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 12px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 12px no-repeat; }
html:root #rail .railrow > .txt { font-family:var(--arc-deco); font-size:14px; letter-spacing:.02em; line-height:1.25; }
html:root #rail .railrow > .rownum { display:block; font-family:var(--arc-small); font-size:11px; line-height:1;
  letter-spacing:.24em; color:var(--dim); }
html:root #rail .railrow.arted > .rownum { color:var(--ink); text-shadow:0 1px 3px rgba(0,0,0,.6); }
html:root #rail .railrow[aria-current] > .rownum { color:var(--mute); }
/* A ROW OR TILE UNDER THE POINTER TURNS THE ACCENT, with no underline (Seth, 2026-11-03). !important
   because each tile writes its colours on itself (drawRail's `tile`), and the second selector because
   the page you are on sets its ink at a higher weight than the first. */
html:root #rail :is(.railtile, .railrow):is(:hover, :focus-visible),
html:root #rail .taletiles > .railtile[aria-current]:is(:hover, :focus-visible) {
  border-color:var(--gold-dim) !important; color:var(--gold) !important; text-decoration:none; }
html:root #rail :is(.railtile, .railrow):is(:hover, :focus-visible) :is(.txt, .tileicon, .rownum) {
  color:var(--gold) !important; text-decoration:none; }
html:root[data-ui-rail="closed"] #rail::after { display:none; }

/* NO GLOW ALONG THE TOP (Seth, 2026-11-03: "that top glow can go away"). It is the waiting notice
   (#owed, above); what is waiting is said by the Workbench count in the tale's menu instead. Under
   every theme since Arcana's styling became the app's (2026-11-03). */
html:root #owed { display:none; }

/* A TALE'S BANNER over its threads: a gilt frame inside its edge and stepped corners, the tale's
   name in the deco capitals. With no cover it is a card back like the shelf's: a bloom of gold
   under a constellation and a sunburst. `:has(.art)` is the cover; the banner has no class for it. */
html:root .lbanner { border-color:var(--gold-dim); min-height:120px; }
/* The inner frame is an outline, which leaves ::before free for the card back's sky. */
html:root .lbanner { outline:1px solid color-mix(in srgb, var(--gold) 60%, transparent); outline-offset:-6px; }
html:root .lbanner::after { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:var(--gold); -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 22px no-repeat, url('/web/arcana-corner-tr.svg') top right / 22px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 22px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 22px no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 22px no-repeat, url('/web/arcana-corner-tr.svg') top right / 22px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 22px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 22px no-repeat; }
html:root .lbanner > .txt { z-index:2; }
html:root .lbanner .serif { font-family:var(--arc-deco); text-transform:uppercase; letter-spacing:.16em; }
html:root .lbanner:not(:has(.art)) { background:url('/web/arcana-canvas.svg') center / cover, var(--sheet) !important; }
html:root .lbanner:not(:has(.art))::before { content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:var(--gold); opacity:.6;
  -webkit-mask:url('/web/arcana-sunburst.svg') 82% 120% / 300px auto no-repeat, url('/web/arcana-stars.svg') 86% 30% / 260px auto no-repeat, url('/web/arcana-wash.svg') 88% 50% / 340px auto no-repeat;
  mask:url('/web/arcana-sunburst.svg') 82% 120% / 300px auto no-repeat, url('/web/arcana-stars.svg') 86% 30% / 260px auto no-repeat, url('/web/arcana-wash.svg') 88% 50% / 340px auto no-repeat; }

/* THE PICTURE AT THE HEAD OF A SCENE, framed the same way. */
html:root #col .plate { border:1px solid var(--gold-dim); }
html:root #col .plate::before { content:''; position:absolute; inset:5px; z-index:1;
  border:1px solid var(--gold); opacity:.6; pointer-events:none; border-radius:var(--r-tight); }
html:root #col .plate-title { font-family:var(--arc-deco); text-transform:uppercase; letter-spacing:.12em; }

/* THREAD CARDS. The gold bar down the left (`.card.plate`, above) read as a state colour; the card
   is framed in gilt corners instead, and its name is in the deco capitals. */
html:root .card.plate { border-left:1px solid var(--edge); }
html:root .card.plate .platename { font-family:var(--arc-deco); text-transform:uppercase;
  letter-spacing:.12em; font-size:20px; }
/* Its corners are the shared card corners (THE RULES AND CORNERS, above). */
/* Its picture, the band across the top of a card on the cross-tale Threads page, with a painted
   edge; and the same band painted as a card back when there is no picture, so a card with a face
   and a card without one stand the same height in the grid. */
html:root #page .card.plate > img {
  -webkit-mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat; mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat; }
html:root #page .card.plate:not(:has(> img))::before { content:''; display:block; height:104px;
  margin:0 0 8px; border:1px solid var(--edge); border-radius:var(--r-tight);
  background:url('/web/arcana-moon.svg') 50% 46% / 34px no-repeat,
    radial-gradient(closest-side, color-mix(in srgb, var(--gold) 34%, transparent), transparent) 50% 50% / 70% 120% no-repeat,
    url('/web/arcana-canvas.svg') center / cover, var(--rail); }
/* ONE NUMERAL PER KIND, LIKE TAROT (Seth, 2026-11-03: "the numeral says what the thread or pocket
   IS"). Every Character wears the same card, every outfit the same; the place in a list says nothing.
   This is the one table. `data-arcana` is the kind on a thread card and on a pocket kind's heading
   (and the tale's Promises and Open questions), and `--arcana` is the numeral drawn from it.
   test/app.ts holds it to every thread kind and every pocket kind in src/slots.ts, one each, no
   numeral twice. Always true is not a pocket and has none.
     THREADS
       character      I      The Magician: the one who acts, will made into deeds.
       lore           II     The High Priestess: hidden knowledge behind the veil, the scroll.
       item           X      The Wheel of Fortune: a thing that turns, changes hands, turns the tale.
       place          XXI    The World: the whole ground the story stands on.
     POCKETS ARE THE MINOR ARCANA (Seth, 2026-11-03), so they have no numeral: each kind is in one of
     the four suits, and each pocket is ranked in its kind on its thread (`minorRank`, web/model.js).
       CUPS, feeling and the bonds between people
         relationships   two people and what holds them; the Two of Cups is a pledge.
         interiority     what is felt and never said; the cup is what is held inside.
       SWORDS, word and thought
         voice           how a person speaks; the blade is the edge on a word.
         question        what is asked and not yet answered; swords are the suit of the mind, and of doubt.
       PENTACLES, the body and the material world
         appearance      how it looks, plain in the light; the suit of the seen and the touched.
         outfit          what it wears, coat and cloth; the suit of things owned.
         what_it_does    what it can do in the world; the coin is power that is spent.
       WANDS, will, motion and fire
         promise         a thing the tale has set going and must carry through; will held over time.
         atmosphere      the air a place is felt in; wands are fire and weather, the suit that moves.
         who_is_here     the people gathered in a place, each come of their own will.
   AND ONE CONSTELLATION PER KIND, `--sky` (Seth, 2026-11-03: "can the constellations be different per
   thread type and pocket type"): web/arcana-sky-<kind>.svg, each drawn as its card. Character, Orion
   the Hunter, the real one placed from the stars' positions (Seth, 2026-11-03): Meissa, the two
   shoulders, the belt, the knees, the sword and the bow, east on the left as he stands seen from the
   ground, and right of the middle so the numeral's diamond does not hide his belt; lore, two pillars, the arch and a veil; item, the Wheel; place,
   the World's globe. A pocket's echoes its kind: a blade sounding for a voice, a hook for a question,
   two rings meeting for a bond, a cup with a lamp for what is kept inside, an open eye for how it
   looks, a coat for what it wears, the pentacle's star for what it can do, the Star on its staff for
   a promise, a moon over mist for the air of a place, a crowd under a call for who is here. A cover
   or a card with no kind keeps web/arcana-stars.svg. */
html:root [data-arcana="character"]     { --arcana:"I"; --sky:url('/web/arcana-sky-character.svg'); }
html:root [data-arcana="lore"]          { --arcana:"II"; --sky:url('/web/arcana-sky-lore.svg'); }
html:root [data-arcana="item"]          { --arcana:"X"; --sky:url('/web/arcana-sky-item.svg'); }
html:root [data-arcana="place"]         { --arcana:"XXI"; --sky:url('/web/arcana-sky-place.svg'); }
html:root [data-arcana="voice"]         { --suit:url('/web/arcana-suit-swords.svg'); --suit-name:"Swords"; --sky:url('/web/arcana-sky-voice.svg'); }
html:root [data-arcana="relationships"] { --suit:url('/web/arcana-suit-cups.svg'); --suit-name:"Cups"; --sky:url('/web/arcana-sky-relationships.svg'); }
html:root [data-arcana="outfit"]        { --suit:url('/web/arcana-suit-pentacles.svg'); --suit-name:"Pentacles"; --sky:url('/web/arcana-sky-outfit.svg'); }
html:root [data-arcana="what_it_does"]  { --suit:url('/web/arcana-suit-pentacles.svg'); --suit-name:"Pentacles"; --sky:url('/web/arcana-sky-what_it_does.svg'); }
html:root [data-arcana="interiority"]   { --suit:url('/web/arcana-suit-cups.svg'); --suit-name:"Cups"; --sky:url('/web/arcana-sky-interiority.svg'); }
html:root [data-arcana="question"]      { --suit:url('/web/arcana-suit-swords.svg'); --suit-name:"Swords"; --sky:url('/web/arcana-sky-question.svg'); }
html:root [data-arcana="promise"]       { --suit:url('/web/arcana-suit-wands.svg'); --suit-name:"Wands"; --sky:url('/web/arcana-sky-promise.svg'); }
html:root [data-arcana="atmosphere"]    { --suit:url('/web/arcana-suit-wands.svg'); --suit-name:"Wands"; --sky:url('/web/arcana-sky-atmosphere.svg'); }
html:root [data-arcana="appearance"]    { --suit:url('/web/arcana-suit-pentacles.svg'); --suit-name:"Pentacles"; --sky:url('/web/arcana-sky-appearance.svg'); }
html:root [data-arcana="who_is_here"]   { --suit:url('/web/arcana-suit-wands.svg'); --suit-name:"Wands"; --sky:url('/web/arcana-sky-who_is_here.svg'); }

/* THE TALE'S THREADS ARE THE MAJOR ARCANA. Every tall card has a face: its kind's numeral in a gilt
   diamond, with the sunburst and the constellation behind it. A card with no picture has them over
   a gold bloom; a card WITH a picture (`.thart`) has them laid over the picture, faint, so the
   picture still reads (Seth, 2026-11-03: a picture replaced all of it, and that was what was
   missing). Over a picture they are `::before` at z -1: above the picture (-2), and painted before
   the card's own fade (`::after`, also -1), which is clear at the top where they sit. The diamond
   is on the name's `::before` so the card's two are free for that; the name is not positioned, so
   the diamond is placed against the card. */
html:root #thlist .thplate.thtall:not(.thart) { background:url('/web/arcana-canvas.svg') center / cover, var(--sheet); }
/* The bloom on ::before, then the corners, the kind's sky and the sunburst on ::after, both under the
   words (z -1 in the card's own stacking), all in the accent. */
html:root #thlist .thplate.thtall:not(.thart)::before { content:''; position:absolute; inset:0; z-index:-1;
  pointer-events:none; background:var(--gold); opacity:.5;
  -webkit-mask:url('/web/arcana-wash.svg') 50% 4% / 74% auto no-repeat;
  mask:url('/web/arcana-wash.svg') 50% 4% / 74% auto no-repeat; }
html:root #thlist .thplate.thtall:not(.thart)::after { content:''; position:absolute; inset:0; z-index:-1;
  pointer-events:none; background:var(--gold);
  -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat, var(--sky, url('/web/arcana-stars.svg')) 50% 6% / 80% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 22% / 92% auto no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat, var(--sky, url('/web/arcana-stars.svg')) 50% 6% / 80% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 22% / 92% auto no-repeat; }
html:root #thlist .thplate.thart::before { content:''; position:absolute; inset:0; z-index:-1;
  pointer-events:none; opacity:.6; background:var(--gold);
  -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat, url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat, var(--sky, url('/web/arcana-stars.svg')) 50% 6% / 80% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 22% / 92% auto no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 20px no-repeat, url('/web/arcana-corner-tr.svg') top right / 20px no-repeat, url('/web/arcana-corner-bl.svg') bottom left / 20px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 20px no-repeat, var(--sky, url('/web/arcana-stars.svg')) 50% 6% / 80% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 22% / 92% auto no-repeat; }
html:root #thlist .thplate.thtall .platename::before { content:var(--arcana, "");
  position:absolute; left:50%; top:58px; width:84px; height:84px; margin-left:-42px;
  display:flex; align-items:center; justify-content:center; pointer-events:none;
  font-family:var(--arc-deco); font-size:24px; letter-spacing:.02em; color:var(--ink-bright);
  background:color-mix(in srgb, var(--doc-bg) 85%, transparent); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
/* The diamond's gilt is a mask filled with the accent, laid over the dark the numeral sits on: the
   file is line only, so it takes the theme's colour. */
html:root #thlist .thplate.thtall .platename::after { content:'';
  position:absolute; left:50%; top:58px; width:84px; height:84px; margin-left:-42px; pointer-events:none;
  background:var(--gold); -webkit-mask:url('/web/arcana-diamond.svg') center / contain no-repeat;
  mask:url('/web/arcana-diamond.svg') center / contain no-repeat; }
/* Over a picture the diamond is smaller and higher, at the head of the card where a tarot card has
   its number, and less than solid: centred where the bare card has it, it sat on every face. */
html:root #thlist .thplate.thart .platename::before { top:14px; width:60px; height:60px;
  margin-left:-30px; font-size:17px; background:color-mix(in srgb, var(--doc-bg) 70%, transparent); }
html:root #thlist .thplate.thart .platename::after { top:14px; width:60px; height:60px;
  margin-left:-30px; opacity:.85; }

/* A POCKET KIND'S SUIT, beside its heading in a thread's Pockets list (and the tale's Promises and
   Open questions): the suit's mark in a small gilt diamond at the right of the heading's rule. Two
   mask layers in one, the diamond and the mark, filled with the accent. */
html:root :is(.pocketlist .pkgroup, .lbl.sect)[data-arcana] { display:flex; align-items:center; gap:10px; }
html:root :is(.pocketlist .pkgroup, .lbl.sect)[data-arcana]::after { content:'';
  margin-left:auto; flex:0 0 auto; width:22px; height:22px; background:var(--gold);
  -webkit-mask:var(--suit) center / 11px 11px no-repeat, url('/web/arcana-diamond.svg') center / contain no-repeat;
  mask:var(--suit) center / 11px 11px no-repeat, url('/web/arcana-diamond.svg') center / contain no-repeat; }

/* POCKETS ARE THE MINOR ARCANA (Seth, 2026-11-03: "with similar styling" to the threads' cards). Each
   pocket in a thread's list is a card: a gilt frame with stepped corners, the painted card back with
   its kind's constellation faint behind the eye, its suit's mark in a small gilt diamond at the left,
   its rank and suit over its name ("Ace of Cups", "Knight of Swords"), the name in the deco face. The
   eye stays the control on the right. The gilt is masks filled with the accent: the corners on the
   card's ::after, the sky on its ::before, the diamond and the mark on the suit's two. */
html:root :is(.pocketlist, .stringlist) .pocketrow { position:relative; isolation:isolate; gap:12px;
  margin:8px 0 0; padding:12px 6px 12px 12px; border:1px solid var(--edge);
  background:url('/web/arcana-canvas.svg') center / cover, var(--sheet); }
html:root :is(.pocketlist, .stringlist) .pocketrow.lit { border-color:var(--gold-dim); }
html:root :is(.pocketlist, .stringlist) .pocketrow::before { content:''; position:absolute; inset:0; z-index:-1;
  pointer-events:none; opacity:.3; background:var(--gold);
  -webkit-mask:var(--sky) right -24px center / auto 150% no-repeat; mask:var(--sky) right -24px center / auto 150% no-repeat; }
html:root :is(.pocketlist, .stringlist) .pocketrow::after { content:''; position:absolute; inset:2px; pointer-events:none;
  background:var(--gold); opacity:.8;
  -webkit-mask:url('/web/arcana-corner-tl.svg') top left / 14px no-repeat, url('/web/arcana-corner-tr.svg') top right / 14px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 14px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 14px no-repeat;
  mask:url('/web/arcana-corner-tl.svg') top left / 14px no-repeat, url('/web/arcana-corner-tr.svg') top right / 14px no-repeat,
    url('/web/arcana-corner-bl.svg') bottom left / 14px no-repeat, url('/web/arcana-corner-br.svg') bottom right / 14px no-repeat; }
.pksuit, .pkrank { display:none; }
html:root :is(.pocketlist, .stringlist) .pksuit { display:block; position:relative; flex:0 0 auto; width:38px; height:38px; }
html:root :is(.pocketlist, .stringlist) .pksuit::before { content:''; position:absolute; inset:0;
  background:color-mix(in srgb, var(--doc-bg) 85%, transparent); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
html:root :is(.pocketlist, .stringlist) .pksuit::after { content:''; position:absolute; inset:0; background:var(--gold);
  -webkit-mask:var(--suit) center / 17px 17px no-repeat, url('/web/arcana-diamond.svg') center / contain no-repeat;
  mask:var(--suit) center / 17px 17px no-repeat, url('/web/arcana-diamond.svg') center / contain no-repeat; }
html:root :is(.pocketlist, .stringlist) .pkrank { display:block; font-family:var(--arc-small); font-size:11px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
html:root :is(.pocketlist, .stringlist) .pkrank::after { content:" of " var(--suit-name, ""); }
html:root :is(.pocketlist, .stringlist) .pkrank { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* An outfit's switch is words, not the eye: kept short so the card's name still has the room. */
html:root :is(.pocketlist, .stringlist) .pocketsw { letter-spacing:.06em; padding:6px 8px; white-space:normal; max-width:96px;
  text-align:center; line-height:1.3; }
html:root :is(.pocketlist, .stringlist) .pkname { font-family:var(--arc-deco); text-transform:uppercase;
  letter-spacing:.1em; font-size:15px; }
/* ITS LEFT IS THE THREAD'S PICTURE (Seth, 2026-11-03: "pocket cards fade from the banner to dark", and
   once it was live, from left to right). A thread with a picture deals its pocket cards with it on
   their left, behind the suit and the name, fading to the card's dark toward the right, where the eye
   is. Under the
   sky and the words (z -2, as a thread card's picture), and less than solid, so the name and the
   rank over it still read; the eye keeps a shadow, as it does on a thread card's picture. */
html:root .pocketlist .pocketrow.pkart > .pkpic { position:absolute; inset:0; z-index:-2; width:100%; height:100%;
  object-fit:cover; object-position:center 25%; border-radius:inherit; opacity:.62;
  -webkit-mask-image:linear-gradient(to right, #000 0%, rgba(0,0,0,.55) 40%, transparent 85%);
  mask-image:linear-gradient(to right, #000 0%, rgba(0,0,0,.55) 40%, transparent 85%); }
html:root .pocketlist .pocketrow.pkart .pocketopen { text-shadow:0 1px 3px rgba(0,0,0,.85); }
html:root .pocketlist .pocketrow.pkart > :is(.pocketsw, .pkeye) { filter:drop-shadow(0 1px 3px rgba(0,0,0,.85)); }
/* The kind's heading over its cards needs no rule of its own: the cards are framed. */
html:root .pocketlist .pkgroup { border-bottom:0; padding-bottom:0; margin-top:24px; }

/* A COVER WITH A PICTURE keeps the card's sky (Seth, 2026-11-03): the sunburst and the constellation
   laid faint over the Library's hero, a shelf card and a tale's banner, as the bare ones have them
   over the bloom. On the shade each already lays over its picture, so the words stay readable. */
html:root .resumeband.haspic > .wash::after,
html:root .storycard .art:not(.bare) > .fade::after,
html:root .lbanner > .fade::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:var(--gold); }
/* The hero's sunburst is already there, behind the title (`.rings::before`, above), but under the
   picture's shade it all but vanished; over a picture it is lifted above the shade, faint, with the
   words above it. The constellation is added, sized like the bare hero's. */
html:root .resumeband.haspic > .rings { z-index:1; opacity:.75; }
html:root .resumeband.haspic > :is(.herobody, .glass) { z-index:2; }
html:root .resumeband.haspic > .wash::after { opacity:.75;
  -webkit-mask:url('/web/arcana-stars.svg') 50% 18% / min(88%, 560px) auto no-repeat;
  mask:url('/web/arcana-stars.svg') 50% 18% / min(88%, 560px) auto no-repeat; }
html:root .storycard .art:not(.bare) > .fade::after {
  -webkit-mask:url('/web/arcana-stars.svg') 50% 12% / 90% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 26% / 120% auto no-repeat;
  mask:url('/web/arcana-stars.svg') 50% 12% / 90% auto no-repeat, url('/web/arcana-sunburst.svg') 50% 26% / 120% auto no-repeat; }
html:root .lbanner > .fade::after {
  -webkit-mask:url('/web/arcana-sunburst.svg') 82% 120% / 300px auto no-repeat, url('/web/arcana-stars.svg') 86% 30% / 260px auto no-repeat;
  mask:url('/web/arcana-sunburst.svg') 82% 120% / 300px auto no-repeat, url('/web/arcana-stars.svg') 86% 30% / 260px auto no-repeat; }
html:root #thlist .thplate.thart { border-color:var(--gold-dim); }
html:root #thlist .thplate.thart > .thpic {
  -webkit-mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat; mask:url('/web/arcana-ragged.svg') center / 100% 100% no-repeat; }
</style>
</head>
<body>

<div id="shell">
  <nav id="rail" aria-label="Anansi"></nav>
  <div id="scrim"></div>

  <!-- OUT OF #doc, 2026-08-28, and this is a positioning fix rather than a tidy-up. The panel is
       `position:fixed; inset:0` at phone width and measured full-viewport in headless Chrome at
       every UI scale — and on a real Android it rendered as a band between the header and the
       composer, with both showing above and below it. A `position:fixed` element is only fixed to
       the VIEWPORT while no ancestor makes itself the containing block, and any of transform,
       filter, backdrop-filter, perspective, will-change, contain or `zoom` does. `zoom` is on
       <body> for the UI scale (app.html:72) and the bar carries a backdrop-filter; which one it
       was on that device is not worth chasing, because the fix removes the dependency instead of
       naming the cause. `#shell` is ALREADY `position:fixed; inset:0`, so a child of it with
       `position:absolute; inset:0` fills the window with no fixed positioning involved at all.
       #rail and #scrim have always lived here for the same reason. -->
  <div id="appearance" hidden></div>
  <!-- #126. The pocket panel, full screen over the drawer. Here and not in #side for the reason
       above: #side carries a transform at tablet width, which would hold a fixed child inside it. -->
  <div id="pocketPanel" hidden></div>
  <!-- Merge two threads: the same full-screen box, for the same reason. -->
  <div id="mergePanel" hidden></div>

  <main id="doc">
    <div id="wash"></div>
    <div id="devbar">development server</div>
    <header id="bar"></header>
    <!-- The chapter meter, full width and immediately under the header. It was a 74px rule inside
         the running head, which put it into the one row that is hidden until you scroll. Seth: "it
         should span the full window".
         A DIV, NOT A BUTTON, since 2026-09-02: it counted context and its press opened the readout
         below. It counts chapters now and that readout is always open, so the press had nothing
         left to do — and a focusable button that does nothing is a promise the surface breaks. -->
    <!-- The cover, kept behind the prose while you read. Outside #read on purpose: a sticky
         element cannot leave its own scroller, so a backdrop that must not move cannot live in
         the thing that moves. -->
    <div id="backdrop" hidden aria-hidden="true"></div>
    <div id="ctxbar" hidden></div>
    <div id="ctxread" hidden></div>
    <div id="read" class="scroll"><div id="col"></div></div>
    <div id="page" class="scroll" hidden></div>
    <div id="dock">
      <!-- Above the mode rail and outside #dockCol, which is capped at the column width. Who you
           are speaking or acting as is not a mode, and sharing the rail with the four that are is
           what made it read as a fifth. -->
  <div id="dockCol"></div></div>
  </main>

  <aside id="side" hidden>
    <div id="sideInner">
      <div id="sideHead"></div>
      <div id="sideBody" class="scroll"></div>
    </div>
  </aside>
</div>

<!-- SOMETHING WANTS YOU. A band of the accent along the top edge, over everything, so it is on
     screen wherever you are — the rail's Waiting row says the same thing but only while the rail is
     open. Not a toast and not a count: it is a light, and pressing Waiting is what answers it. -->
<div id="owed" aria-hidden="true" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<!-- WHAT JUST HAPPENED, FOR A READER WHO CANNOT SEE THE PAGE MOVE. Anansi streams prose in, and a
     screen reader got silence while it arrived and silence when it landed.
     NOT `aria-live` ON #col: that element is rewritten whole on every repaint — a panel opening, a
     chapter paging, a toast — so a live region there would read the entire chapter out again each
     time. This holds one short sentence instead, written only when a passage actually arrives. -->
<div id="announce" class="vh" role="status" aria-live="polite"></div>

<script type="module" src="./web/app.js"></script>
</body>
</html>
