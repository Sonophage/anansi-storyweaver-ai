<!DOCTYPE html>
<!-- The look lives in data-ui-* so it cannot collide with the data-* names the click
     delegation treats as actions. data-theme on <html> plus [data-theme] in the
     delegation meant every click in the app matched <html> and toggled the rail. -->
<html lang="en" data-ui-theme="obsidian" data-ui-font="serif" data-ui-size="m">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: when the on-screen keyboard opens, SHORTEN the layout
     viewport instead of leaving it alone and sliding the keyboard over the top. Chrome's default on
     Android is resizes-visual, which puts the composer under the keyboard and makes you scroll to
     find the thing you are typing into. Nothing here is sized in vh, so shortening is safe.
     viewport-fit=cover lets the page reach the edges, which is why the insets below exist. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0C">
<title>Anansi</title>
<link rel="icon" href="./web/icon.svg">
<link rel="manifest" href="./web/app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Tokens. The three themes come from the design's own theme() function; the
   only change is that they live in custom properties instead of style strings,
   so a repaint does not rewrite every element's inline style.
   --------------------------------------------------------------------------- */
/* Every colour the app uses lives here. A THEME is one block below overriding any of these — that
   is the whole contract, and it only holds if nothing hardcodes a hex. web/app.js used to carry
   162 of them in inline styles, so the panel and the rail could not be themed at all while the
   document could. */
:root {
  /* ink, on the panel and the rail — brightest to faintest */
  --ink-bright:#F3ECE0; --ink:#EAE3D6; --mute:#8A8478; --faint:#78726A; --dim:#6E6961;
  --ink-ghost:#635E56;
  --gold:#D9B26A; --gold-lit:#E0C48C; --gold-dim:#BCA97F; --on-gold:#100D08;
  --rail:#0C0C0E; --sheet:#0E0D10; --line:#1A1917; --edge:#23211D; --chip:#2A2721;
  --edge-lit:#3A372F; --field:#141317;
  --good:#7FB083; --warn:#C99356; --bad:#C8705A;

  /* ONE RADIUS FAMILY. Twenty-four distinct values lived in these two files — 1, 2, 3, 4, 6, 7,
     8, 9, 10, 11, 13, 14, 16, 18, 26 and a pill — which is not a decision, it is fifteen of them
     taken separately. Three: a hairline for marks and swatches, one for everything with a body,
     and the pill. Circles stay circles. */
  --r-tight:3px; --r:12px; --r-pill:999px;

  /* ONE MOTION CURVE. The three that lived here were the same intent written three ways, and
     nothing in the app could say which of them a given move was. --ease and --ease-in are kept
     as aliases so no rule has to be rewritten to agree with this. */
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.16,1,.3,1);
  --t-fast:.12s;                            /* a state you should not notice changing */
  --t:.2s;                                  /* the default: hovers, chips, toggles */
  --t-slow:.32s;                            /* something moving across the screen */
  --t-page:.42s;                            /* a whole surface arriving */

  --prose:20px; --bubble:17px; --gap:30px; --col:720px;
}
/* The nine themes are NOT here. They are one row each in web/model.js and every token is derived
   from that row by themeVars(), which applyLook() writes onto <html> as custom properties. Three
   hand-written blocks lived here and that is exactly why there were three: each new theme meant
   restating the greys, the gold and the chrome by hand, and the light one that forgot rendered
   dark text on cream. Rules that are NOT colours still key on data-ui-theme, below. */
html[data-ui-size="xs"] { --prose:16px; --bubble:14.5px; --gap:22px; --col:620px; }
html[data-ui-size="s"] { --prose:18px; --bubble:16px; --gap:26px; --col:660px; }
html[data-ui-size="m"] { --prose:20px; --bubble:17px; --gap:30px; --col:720px; }
html[data-ui-size="l"] { --prose:23px; --bubble:19px; --gap:34px; --col:780px; }
html[data-ui-size="xl"] { --prose:26px; --bubble:21px; --gap:38px; --col:840px; }

/* UI scale, which is a different axis from reading size: that one moves the prose, this one moves
   the chrome around it — rail, panels, labels, buttons.
   ponytail: `zoom` on the body, not a rem refactor. The stylesheet is px throughout, so a root
   font-size would move nothing; zoom moves everything including the px. Ceiling: it can nudge
   fixed-position elements and anything sized in viewport units. If that shows up, the upgrade is
   converting the chrome to rem and dropping this. */
/* Reading mode. A button, not a scroll listener: auto-hiding chrome moves controls under a thumb
   mid-tap, and F34 already measured how little movement it takes to lose a tap on this surface.
   The composer FADES rather than unmounting, so the mode is visible in the layout and the draft in
   the textarea survives being turned off again. */
/* The composer GOES, rather than fading — Seth's call over my fade.
   display:none, not an unmount: out of the layout, out of the tab order, out of the accessibility
   tree, and still in the DOM, so a half-written sentence cannot be lost by toggling the mode. The
   round trip is asserted in test/ui/phone.js. */
/* Pull-to-refresh, off. Scrolling up at the top of the reading pane on Android reloaded the page —
   which in reading mode is constant, because there is no composer under the prose to scroll past.
   `contain` rather than `none`: the pane still bounces at its own edges, it just stops handing the
   gesture to the browser chrome. On #read because that is what scrolls, and on body because the
   document itself can take the gesture when the pane is short. */
#read, body { overscroll-behavior-y: contain; }

html[data-reading="1"] #dock { display:none; }
/* Taps in the prose do nothing while reading — that is what reading mode is for — but a
   deliberate DOUBLE click still reaches the tray, because dblclick is a document-level listener
   and does not need the block to take pointer events. */
html[data-reading="1"] #col .block { pointer-events:none; }
html[data-reading="1"] #col .block .acts { pointer-events:auto; }
/* READING MODE keeps the tray — a double tap still opens it — but only the parts that make sense
   with no composer on screen. Everything that WRITES is marked `wr` and goes; what is left is
   Regenerate, Branch and the chapter list. Seth: "in reading mode double clicking should work but
   it should only have regenerate, branch, and a skip to chapter". */
html[data-reading="1"] .acts .wr { display:none !important; }
/* And the chapter list is reading-mode's own: while writing, the rail's Chapters list is right
   there, and a second copy inside every passage's tray is a second thing to keep in step. */
.acts .readonly { display:none; }
html[data-reading="1"] .acts .readonly { display:flex; }
/* min-height:0 for the same reason the rail's list needs it: this is a flex child of .acts, and a
   flex child will not shrink below its content by default, so overflow-y:auto never engages and it
   grows instead. At forty chapters that pushed the tray past its own max-height. */
.chaplist { display:flex; flex-direction:column; gap:2px; max-height:40vh; min-height:0;
  overflow-y:auto; flex-shrink:1;
  border-top:1px solid var(--chip); margin-top:4px; padding-top:4px; }
.chaplist button { justify-content:flex-start; font-size:12.5px; color:var(--mute); padding:7px 10px; }
.chaplist button[aria-current="true"] { color:var(--gold); }

html[data-ui-scale="90"]  body { zoom:0.90; }
html[data-ui-scale="110"] body { zoom:1.10; }
html[data-ui-scale="125"] body { zoom:1.25; }
@media (max-width:719px) {
  html[data-ui-size="xs"] { --prose:14.5px; --bubble:13.5px; --gap:16px; }
  html[data-ui-size="s"] { --prose:16px; --bubble:14.5px; --gap:18px; }
  html[data-ui-size="m"] { --prose:17.5px; --bubble:15.5px; --gap:22px; }
  html[data-ui-size="l"] { --prose:19.5px; --bubble:17px; --gap:26px; }
  html[data-ui-size="xl"] { --prose:22px; --bubble:18.5px; --gap:30px; }
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; background:var(--doc-bg); color:var(--body);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
input, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:var(--r-tight); }
/* ── motion ──────────────────────────────────────────────────────────────────────────────────
   One system, four durations, three curves, all declared in :root. The rule the app follows:
   motion explains where something came from. A panel slides from the edge it lives on; a passage
   rises because it was written below; a chip does not move at all because it did not go anywhere.
   Nothing here loops except the working bar, which is reporting that a call is still running.

   Everything is opacity and transform only — both composited, so a 358-passage document does not
   drop frames when the side panel opens. No animating height, width, top or left. */

/* The whole app respects the system setting. This is the ONLY blanket reset; individual rules
   below add static fallbacks where removing the animation would remove the information too. */
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; }
  html { scroll-behavior:auto !important; } }

@keyframes rise   { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
@keyframes settle { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
@keyframes fade   { from { opacity:0; } to { opacity:1; } }
@keyframes lift   { from { opacity:0; transform:translateY(10px) scale(.985); } to { opacity:1; transform:none; } }

/* A new passage RISES: it was written at the bottom and it arrives from there. Only the newest
   one animates — replaying the whole document on every repaint would be a slot machine, and at
   358 passages it would be a slow one. The renderer marks it; `:last-of-type` cannot, because it
   means "last <div>" and the chapter pager is a div that comes after every block. */
#col .block.newest { animation:rise var(--t-slow) var(--ease-out) both; }
/* The passage as it arrives. Dimmed and carried by a caret, because it is not in the book yet:
   nothing is saved until the stream ends and accept returns. It replaces a p50 of 5.7 seconds
   of blank page, which read as a hung app (COUNCIL-04 #3). */
/* THE VEIL. The book is busy, and it says so by dimming the page rather than by adding a paragraph
   to it. Sized to the reading column in JS — never to #doc, which also holds the composer, and a
   veil over the composer is a veil over Stop. */
/* FULL SCREEN, ON TOP OF EVERYTHING, WITH STOP INSIDE IT. The veil used to be sized to #read in
   JS so that it would not cover the composer, because covering the composer covered Stop. Stop is
   in here now, which is what makes covering everything safe.
   `absolute` inside #shell, which is itself fixed to all four edges — not `fixed`, because a fixed
   element is only fixed until an ancestor makes itself its containing block, and `zoom` on <body>
   for the UI scale does exactly that. That is what rendered the themes menu as a band on a phone.
   z-index 50 clears #rail and #appearance and #dock.big at 40/41 and stays under #toast at 60,
   which is pointer-events:none and so cannot swallow Stop. */
/* TRANSLUCENT AND BLURRED, not opaque. The page stays there behind it — you can see the shape of
   what you were reading, you just cannot read it, which is the difference between "the book is
   busy" and "the book is gone". The tint comes from the theme's own paper rather than a literal,
   so it is the right darkness on Parchment as well as on Obsidian. */
#ghost.veil { position:absolute; inset:0; z-index:50; display:flex; align-items:center;
  justify-content:center;
  /* NO TINT AT ALL, 2026-08-28. 62% then 31% then none: Seth wanted to see the blur on its own.
     A blur alone still says "busy" — the words go and the shapes stay — and it says it without
     putting a sheet of colour between you and your book. If this reads as too legible on a light
     theme the tint comes back as a theme token, not as a literal. */
  animation:veilin var(--t-slow) var(--ease-out) both; }
/* ONE BLUR, TWO SURFACES. Seth, 2026-08-28: "when we maximize the input box, do the same treatment
   on that background as the one that we do when we press send so that that experience is cohesive."
   Shared rather than copied, the same bargain as the two dock buttons — a second declaration of the
   same blur is how the two drift apart, and these are the app's only two full-screen takeovers.
   3.5px — 14, then 7, then this, all on 2026-08-28 and all by eye, which is the only instrument for
   it. With the tint gone the blur is the only thing between the writer and the page, and it only
   has to say "not now" rather than take the book away. */
#ghost.veil, #dock.big { background:transparent;
  backdrop-filter:blur(3.5px) saturate(.95); -webkit-backdrop-filter:blur(3.5px) saturate(.95); }
#ghost.veil.leaving { animation:veilout var(--t) var(--ease) both; }
#ghost.veil .narr { text-align:center; display:flex; flex-direction:column; align-items:center; gap:22px; }
#ghost.veil .head { color:var(--gold-dim); font-family:ui-monospace,monospace; font-size:16px;
  letter-spacing:.05em; white-space:nowrap; animation:veilbreathe 1.5s ease-in-out infinite; }
/* THE WEB DRAWS ITSELF. Seven strokes, the same ones as web/icon.svg, because she is Anansi and
   the wait is long enough to deserve something to watch. `pathLength="1"` normalises every stroke
   to one unit, so a single dasharray draws a 320px radial and a 1030px ring at the same rate
   without anybody measuring either. Radials first, then the rings, then the whole thing breathes.
   `stroke-dashoffset` and `opacity` are both compositor properties: this costs nothing on a box
   that is loading a 35B model at the same time. */
/* The whole web turns, slowly, for as long as she is thinking — a web being spun rather than a
   picture of one. 48s for a full turn is below the speed anything reads as spinning; it is the
   kind of movement you notice only by looking away and back. `rotate` on the element and the draw
   on its strokes are two different properties, so neither interrupts the other. */
#ghost.veil .web { width:min(46vw, 210px); height:auto; color:var(--gold-dim); opacity:.9;
  animation:webturn 48s linear infinite; }
#ghost.veil .web g > * {
  stroke-dasharray:1; stroke-dashoffset:1;
  animation:webdraw 1.1s var(--ease-out) forwards, webbreathe 4s ease-in-out 1.6s infinite;
}
@keyframes webturn { to { transform:rotate(360deg); } }
#ghost.veil .web g > :nth-child(1) { animation-delay:0s, 1.6s; }
#ghost.veil .web g > :nth-child(2) { animation-delay:.08s, 1.7s; }
#ghost.veil .web g > :nth-child(3) { animation-delay:.16s, 1.8s; }
#ghost.veil .web g > :nth-child(4) { animation-delay:.24s, 1.9s; }
#ghost.veil .web g > :nth-child(5) { animation-delay:.42s, 2.0s; }
#ghost.veil .web g > :nth-child(6) { animation-delay:.54s, 2.1s; }
#ghost.veil .web g > :nth-child(7) { animation-delay:.66s, 2.2s; }
@keyframes webdraw { to { stroke-dashoffset:0; } }
@keyframes webbreathe { 0%, 100% { opacity:1; } 50% { opacity:.35; } }
/* Styled beside #send.stopping at the foot of this file, so the two read as one control. */
#ghost.veil .veilstop { display:flex; align-items:center; gap:8px; padding:11px 20px;
  border-radius:var(--r-pill); border:1px solid var(--edge-lit); background:var(--sheet);
  color:var(--ink-bright); font-size:12.5px; letter-spacing:.06em; }
@keyframes veilin { from { opacity:0; } to { opacity:1; } }
@keyframes veilout { from { opacity:1; } to { opacity:0; } }
/* PLAN-07 bug 3: this was also called `breathe`, and so was #send.stopping's at the bottom of
   this file. The later declaration wins for BOTH, so the veil's head has never pulsed at the
   amplitude written for it — .7-to-.28 here against 1-to-.62 there. Renamed rather than merged:
   they are two different amplitudes for two different things. */
@keyframes veilbreathe { 0%, 100% { opacity:.7; } 50% { opacity:.28; } }
@media (prefers-reduced-motion: reduce) {
  #ghost.veil { animation:none; }
  #ghost.veil .head { animation:none; }
  /* The web is DRAWN, not animated in: without this it would sit at dashoffset 1, which is a web
     that never appears at all. */
  #ghost.veil .web { animation:none; }
  #ghost.veil .web g > * { animation:none; stroke-dashoffset:0; }
}

/* THE PASSAGE ARRIVING, LEFT TO RIGHT. A mask three times the width of the block: at 100% the
   transparent end of the gradient sits over the text and it is hidden; sliding to 0% draws the
   opaque end across from the left. Slow on purpose — Seth asked for slowly, and a wipe fast enough
   to be a transition is not the effect. `both` holds the finished state, so a repaint that lands
   after the animation cannot leave a half-masked paragraph. */
#col .block.arrived {
  -webkit-mask-image:linear-gradient(90deg, #000 0 33%, transparent 66% 100%);
          mask-image:linear-gradient(90deg, #000 0 33%, transparent 66% 100%);
  -webkit-mask-size:300% 100%;         mask-size:300% 100%;
  -webkit-mask-repeat:no-repeat;       mask-repeat:no-repeat;
  animation:wipe 1.5s var(--ease-out) both;
}
@keyframes wipe {
  from { -webkit-mask-position:100% 0; mask-position:100% 0; }
  to   { -webkit-mask-position:0 0;    mask-position:0 0; }
}
@media (prefers-reduced-motion: reduce) {
  #col .block.arrived { animation:none; -webkit-mask-image:none; mask-image:none; }
}
@keyframes caret { 50% { opacity:0; } }

/* The decode. The element keeps its real text; the glyphs are an attribute painted over the top,
   so nothing that READS the page — a screen reader, a copy, a test — ever sees them. Half a second,
   on a title that changed. */
.decoding { color:transparent !important; position:relative; }
.decoding::after {
  content:attr(data-glyphs); position:absolute; left:0; top:0; white-space:pre;
  color:var(--chrome-ink); pointer-events:none;
}
#sideHead .decoding::after { color:var(--ink-bright); }
.up.decoding::after { color:var(--label); }
@media (prefers-reduced-motion: reduce) { .decoding { color:inherit !important; } .decoding::after { content:none; } }

/* A panel's contents SETTLE in after the panel itself has arrived, so the two reads as one move
   rather than a race. The delay is the panel's own transition, near enough. */
#sideBody > * { animation:settle var(--t) var(--ease-out) both; }
#page > * { animation:lift var(--t-page) var(--ease-out) both; }

/* Rows and cards stagger, barely. Six steps is enough to read as a sequence; past that it is a
   wait. Anything below the sixth arrives with the sixth. */
#sideBody .card, #sideBody .row, #page .storycard {
  animation:rise var(--t-slow) var(--ease-out) both; }
#sideBody .card:nth-child(1),  #page .storycard:nth-child(1)  { animation-delay:0ms; }
#sideBody .card:nth-child(2),  #page .storycard:nth-child(2)  { animation-delay:22ms; }
#sideBody .card:nth-child(3),  #page .storycard:nth-child(3)  { animation-delay:44ms; }
#sideBody .card:nth-child(4),  #page .storycard:nth-child(4)  { animation-delay:66ms; }
#sideBody .card:nth-child(5),  #page .storycard:nth-child(5)  { animation-delay:88ms; }
#sideBody .card:nth-child(n+6),#page .storycard:nth-child(n+6){ animation-delay:110ms; }

/* Things you press answer immediately. --t-fast is the point where a change stops feeling like a
   change and starts feeling like the button was already that way. */
button, .tag, .chip, .card, .row, select, input, textarea, a.btn {
  transition:background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease); }
button:not(:disabled):active { transform:translateY(.5px); }
.storycard { transition:transform var(--t) var(--ease-out), border-color var(--t) var(--ease); }
.storycard:hover { transform:translateY(-2px); }
.card:hover { border-color:var(--edge-lit); }

/* Focus is not decoration: it is the only thing telling a keyboard where it is. It never fades in,
   because a ring that arrives late is a ring you have already moved past. */
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:var(--r); transition:none; }

/* The toast comes up from the composer it is talking about, and leaves the way it came. */
#toast { animation:rise var(--t) var(--ease-out) both; }

/* Chips that toggle — modes, outfits, kinds — do NOT move. They did not go anywhere; only their
   state changed, and moving them would say otherwise. */
#modes button, [data-wear], [data-lorekind], [data-kind] { transition:color var(--t-fast) var(--ease),
  border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }

/* Surfaces that replace their whole contents. Each one is a different KIND of change, so each
   one says something different about what happened:

     #bar        the title of what you are looking at — it cross-fades, because you did not move,
                 the thing you are looking at changed
     #sideHead   the same, for the panel
     #hits       results arriving, so they rise like anything else in a list
     #books      the same on the Worlds page

   `#page > *` and `#sideBody > *` above already cover page and panel contents. None of these has
   an EXIT: an exit needs the old DOM held while the new one is built, and every version of that
   either double-renders or drops frames on a long document. An entrance that says where the
   content came from does the work without the cost. */
#bar > div, #sideHead > * { animation:fade var(--t) var(--ease-out) both; }
#hits > *, #books > * { animation:rise var(--t) var(--ease-out) both; }
#hits > *:nth-child(1) { animation-delay:0ms; }
#hits > *:nth-child(2) { animation-delay:20ms; }
#hits > *:nth-child(3) { animation-delay:40ms; }
#hits > *:nth-child(n+4) { animation-delay:60ms; }

/* The composer bar rebuilds whenever you change mode, and the textarea under it must not move
   while you are typing into it. Only the row of modes reacts. */
#modes { animation:fade var(--t-fast) var(--ease-out) both; }

/* The document scrolls to a search hit rather than jumping, so you can see where it took you. */
@media (prefers-reduced-motion:no-preference) { #read { scroll-behavior:smooth; } }
.tnum { font-variant-numeric:tabular-nums; }
.serif { font-family:'Instrument Serif',Georgia,serif; }
/* SMALL CAPS, SENTENCE CASE. Tracked uppercase shouts and loses the shape of a word; small caps
   from a sentence-cased source keeps the ascenders and reads as a label rather than a heading.
   The source text is already sentence case everywhere, so this is a CSS change, not a copy one. */
.up { letter-spacing:.1em; font-variant-caps:all-small-caps; }
.scroll { overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--chip) transparent; }
.scroll::-webkit-scrollbar { width:8px; height:8px; }
.scroll::-webkit-scrollbar-thumb { background:var(--chip); border-radius:var(--r-tight); }

/* --- shell ------------------------------------------------------------- */
#shell { position:fixed; inset:0; display:flex; overflow:hidden; }

#rail {
  background:var(--rail); display:flex; flex-direction:column; overflow:hidden;
  flex:0 0 auto; width:248px; border-right:1px solid var(--line);
  transition:width var(--t-slow) var(--ease); position:relative; z-index:30;
}
html[data-ui-rail="closed"] #rail { width:76px; }
#rail .txt { opacity:1; transition:opacity var(--t-fast) var(--ease); white-space:nowrap; overflow:hidden; }
html[data-ui-rail="closed"] #rail .txt { opacity:0; }

#scrim {
  position:absolute; inset:0; z-index:20; background:rgba(5,5,7,.6); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity var(--t-slow) var(--ease);
}
/* ONE scrim, two things behind it. The rail raises it under 1100px; the ⋯ tray raises it at every
   width, because the tray is now a sheet over the middle of the content and a sheet over content
   with nothing behind it is a sheet you cannot tell is modal. syncTray() writes data-tray, and
   #scrim's own listener shuts the tray first and the rail second, because the tray is on top. */
/* And it rises above the side panel while the tray is up. #scrim's base z-index is 20, under
   #side's 30, because the rail's scrim must not dim the panel. The tray's must: the sheet is
   centred on the viewport, and at desk width with a 400px panel open the panel was ON TOP of it —
   page.click reported the History button visible and the press landed on the panel behind
   nothing. Centring inside the reading column instead needs a transform on #read to make it the
   containing block, which makes #read a stacking context and puts the sheet back under the scrim. */
html[data-tray="1"] #scrim { opacity:1; pointer-events:auto; z-index:31; }

#doc { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--doc-bg); }
#wash { position:absolute; inset:0; pointer-events:none; background:var(--doc-wash); }

#side {
  flex:0 0 auto; width:400px; background:var(--rail); overflow:hidden;
  border-left:1px solid var(--line); transition:width var(--t-slow) var(--ease); z-index:30;
}
#side[hidden] { display:block; width:0; border-left-color:transparent; }
#sideInner { width:400px; height:100%; display:flex; flex-direction:column; overflow:hidden; }

/* Tablet: rail and panel both float over the document. */
@media (max-width:1099px) {
  #rail {
    position:absolute; top:0; bottom:0; left:0; width:264px;
    transform:translateX(0); transition:transform var(--t-slow) var(--ease);
    box-shadow:40px 0 90px rgba(0,0,0,.6);
  }
  html[data-ui-rail="closed"] #rail { width:264px; transform:translateX(-100%); box-shadow:none; }
  html[data-ui-rail="closed"] #rail .txt { opacity:1; }
  html[data-ui-rail="open"] #scrim { opacity:1; pointer-events:auto; }
  #side {
    position:absolute; top:0; bottom:0; right:0; width:400px;
    transform:translateX(0); transition:transform var(--t-slow) var(--ease);
    box-shadow:-40px 0 90px rgba(0,0,0,.6);
  }
  #side[hidden] { width:400px; transform:translateX(100%); box-shadow:none; border-left-color:var(--line); }
}
/* Phone: the MENU is a full-screen sheet from the bottom, like the panel beside it.
   Seth: "instead of it coming from the left could we have it come up from the bottom and be full
   screen". Two things it settles at once. The drawer left a strip of document beside it at 264px of
   264, which reads as reachable whether or not it is — and the same edge is now the edge every sheet
   in the app arrives from, so the rail stops being the one surface with its own idiom.

   Full screen rather than a tall sheet on purpose: a menu with the shelf showing under it is a menu
   you are half in. There is nothing behind it to tap, which is the structural version of the
   click-through Seth reported and which I could not reproduce on emulated touch — the scrim takes
   the tap there. This removes the surface the question was about rather than answering it. */
@media (max-width:719px) {
  #rail, html[data-ui-rail="closed"] #rail {
    position:fixed; inset:0; width:auto; z-index:40;
    border-right:0; box-shadow:0 -30px 90px rgba(0,0,0,.6);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    transform:translateY(0); transition:transform var(--t-slow) var(--ease-out);
  }
  html[data-ui-rail="closed"] #rail { transform:translateY(100%); box-shadow:none; }
  /* Nothing to dim: the sheet is the whole screen. Leaving the scrim up under it only costs a
     backdrop-filter over a surface nobody can see. */
  html[data-ui-rail="open"] #scrim { opacity:0; pointer-events:none; }
  #rail .txt { opacity:1 !important; }
}

/* Phone: the panel becomes a bottom sheet. */
@media (max-width:719px) {
  #side {
    position:absolute; inset:0; width:auto; border-left:0; box-shadow:none;
    display:flex; flex-direction:column; justify-content:flex-end;
    background:rgba(6,6,8,.72); backdrop-filter:blur(8px);
    transform:none; transition:background var(--t) var(--ease);
  }
  #side[hidden] { display:flex; width:auto; transform:none; background:rgba(6,6,8,0);
    backdrop-filter:none; pointer-events:none; }
  /* THE SHEET ARRIVES FROM THE EDGE IT LIVES ON. On a phone the panel is a sheet along the bottom,
     so it rises from the bottom. It used to slide 30px and fade — a move that says "something
     appeared here" rather than "this came up from down there", and at 30px it read as a flinch. */
  #sideInner {
    width:auto; height:auto; max-height:88%; background:var(--sheet); border:1px solid var(--chip);
    border-bottom:0; border-radius:var(--r) var(--r) 0 0;
    transform:translateY(0); opacity:1;
    transition:transform var(--t-slow) var(--ease), opacity var(--t) var(--ease);
  }
  #side[hidden] #sideInner { transform:translateY(100%); opacity:0; }
}

/* --- header ------------------------------------------------------------ */
#bar {
  position:relative; display:flex; align-items:center; gap:18px; padding:18px 40px; flex:0 0 auto;
  border-bottom:1px solid var(--chrome-line); background:var(--chrome); backdrop-filter:blur(18px);
}
/* The hamburger is gone. It sat at the top left of every screen as a second door to the same menu
   the web on the right opens, and two doors to one room is one door too many. Seth: "remove the
   hamburger as the menus toggle. and remove it from the top". */
@media (max-width:719px) { #bar { padding:calc(16px + env(safe-area-inset-top, 0px)) 20px 14px; gap:14px; } }

.pill { border:1px solid var(--chrome-line); padding:8px 14px; border-radius:var(--r); font-size:12px; color:var(--chrome-dim); white-space:nowrap; }
.pill[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
.deskonly { display:block; }
@media (max-width:719px) { .deskonly { display:none; } }
.phoneonly { display:none; }
@media (max-width:719px) { .phoneonly { display:block; } .phoneonly[data-rail] { display:flex; } }

/* --- appearance popover ------------------------------------------------ */
#appearance {
  /* z-index 41, not 25. It was 25 while this lived inside #doc, where `right:32px` measured from
     the DOC's right edge — which on a desk with the side panel open is 400px clear of #side. Out
     here in #shell the same 32px measures from the WINDOW, so the card landed underneath #side at
     z-index 30 and its themes could not be pressed. Caught by handlers.js, which clicks Parchment
     and reads the theme back.
     41 rather than 31: it is the same number the full-screen rule below uses, because it is the
     same decision — a menu goes above the panels, at every width. */
  position:absolute; top:70px; right:32px; z-index:41; width:274px; border-radius:var(--r);
  border:1px solid var(--chip); background:rgba(16,15,18,.97); backdrop-filter:blur(20px);
  box-shadow:0 30px 70px rgba(0,0,0,.65); padding:16px 18px;
  display:flex; flex-direction:column; gap:14px; color:var(--ink);
}
#appearance[hidden] { display:none; }
/* A PANEL, THE WAY THE MENU IS. A 274px card pinned under the top-right corner is a desk shape:
   on a phone it is the far corner from a thumb and it covers the prose it exists to restyle — and
   a half-height sheet still sits over the composer, which is the window you are writing in.
   So it is the same shape as the rail's sheet: fixed to all four edges, its own screen, with the
   list scrolling inside it. `position:fixed`, not absolute, because `zoom` on <body> for the UI
   scale re-bases an absolutely positioned element and the panel drifted off the screen at XL —
   which is the size Seth writes at, and the reason the menu was unusable there.
   THE BREAKPOINT IS 1099, NOT 719, because that is where `overlay()` in app.js says every menu
   becomes an overlay — it is where #rail and #side stop being columns and become drawers over the
   doc. This block used to say 719, so between 720 and 1099 every other menu overlaid the screen
   and this one alone stayed a desk card pinned in a corner. Two numbers for one decision. If the
   overlay breakpoint moves, move it here too; test/web.ts asserts the two agree. */
@media (max-width:1099px) {
  #appearance {
    /* absolute, not fixed: #shell is the fixed one and this is now its child. Nothing an
       ancestor does to its containing block can move this any more. */
    position:absolute; inset:0; top:0; right:0; left:0; bottom:0; width:auto; max-height:none;
    z-index:41; border-radius:0; border:0; overflow-y:auto;
    /* FULL SCREEN MEANS FULL SCREEN, 2026-08-28. It was already fixed to all four edges here, and
       it still did not read as a screen: the desk card's `rgba(16,15,18,.97)` came with it, so the
       prose showed through at 3% behind a blur. That hardcoded colour is also Obsidian's sheet
       baked into a rule the other eight themes share — the same fault the logo had. Opaque, and
       from the theme's own token. */
    background:var(--sheet); backdrop-filter:none;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    box-shadow:none;
    animation:sheet var(--t-slow) var(--ease-out) both;
  }
}
@keyframes sheet { from { transform:translateY(14px); opacity:0 } to { transform:none; opacity:1 } }
/* THE WAY OUT STAYS ON SCREEN. Full-screen means there is no outside left to tap, so the close
   button is the only exit — and it sat at the top of a panel that scrolls 332px at XL, so scrolling
   to the last theme scrolled away the only way back. A trap I made by making the panel full-screen;
   the half-height sheet before it had an outside. */
@media (max-width:1099px) {
  #appearance .sheet-head { position:sticky; top:0; z-index:1; background:var(--sheet);
    margin:-20px -18px 0; padding:20px 18px 16px; }
  /* Air between the close button and the tab row. The head is STICKY, so the tabs pass under it
     as the list scrolls and at 12px of padding the ✕ sat right on top of them — Seth: "a bit of
     padding above the toggles so that it doesnt overlap with the x". 16px on the head plus this
     margin, on top of #appearance's own 14px gap, so the ✕ has clear space beneath it before
     anything scrolls into it. */
  #appearance .sheet-head + div { margin-top:6px; }
}
.chip { padding:9px 12px; border-radius:var(--r); border:1px solid var(--chip); color:var(--mute); font-size:13px; }
.chip[aria-pressed="true"] { border-color:rgba(217,178,106,.5); background:rgba(217,178,106,.08); color:var(--ink); }

/* --- reading column ---------------------------------------------------- */
#read { position:relative; flex:1; min-height:0; display:flex; justify-content:center; padding:40px 0 0; }
/* A chapter that opens on its cover opens at the top of the window. The 40px is air above a
   TITLE; above a full-bleed picture it is a gap, and the picture is the thing that should meet
   the header. */
#doc.plated #read { padding-top:0; }
/* THE COVER, BEHIND THE PROSE. Per story, off by default, and it replaced a sticky heading — a
   strip that followed you down the page is a label, and this is the chapter having a place.
   It fills the document and does not move, and the prose scrolls over it.

   `i` is the picture at the story's own strength; `u` is the gradient over it, left to right from
   nothing to the page's own colour. Two elements rather than one background with two layers,
   because the opacity belongs to the picture alone — applied to a stack it would fade the gradient
   with it and the text would lose the ground it reads off. */
#backdrop { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
#backdrop > i { position:absolute; inset:0; display:block; background-size:cover;
  background-position:center; }
#backdrop > u { position:absolute; inset:0; display:block;
  background:linear-gradient(90deg, transparent 0%, var(--doc-bg) 62%); }
/* The prose sits above it, and #read must not paint its own ground over the picture.
   `position:relative` with NO z-index, deliberately. A positioned element with a z-index other
   than auto creates a STACKING CONTEXT, and the ⋯ tray is `position:fixed; z-index:32` inside
   #col — trapped in a context at layer 1 it went under the scrim's 31, so the sheet opened behind
   its own blur. The note above #scrim warns about exactly this, and giving #col a z-index walked
   into it from the other side. Positioned-with-auto still paints above the absolutely-positioned
   backdrop, because #read comes after it in the document, and it makes no context to be caught in. */
#doc.behind #read { background:transparent; position:relative; }
/* AND SO DOES THE CHROME. The backdrop is a later sibling than #bar, so with everything at the
   same layer it painted over the header — the book's name, the three controls and the context bar
   all went under the picture. Seth: "the menu icons and header and book name and context should
   all sit above the image and gradient." Above the prose too, which is why it is 2 and not 1:
   the chrome is the frame, and a frame the picture can cover is not a frame. */
#doc.behind #bar, #doc.behind #ctxbar, #doc.behind #ctxread, #doc.behind #appearance {
  position:relative; z-index:2; }
/* On a phone the column IS the window, so there is no side for the picture to be whole down: the
   gradient goes nearly to the top of it and the image reads as a wash rather than a photograph. */
@media (max-width:719px) {
  #backdrop > u { background:linear-gradient(90deg, transparent 0%, var(--doc-bg) 34%); }
}
#doc.plated .plate { border-top-left-radius:0; border-top-right-radius:0; }
@media (max-width:719px) { #read { padding:22px 22px 0; } }
#col { width:100%; max-width:var(--col); height:max-content; display:flex; flex-direction:column; gap:var(--gap); padding-bottom:20px; }

.narr { font-size:var(--prose); line-height:1.7; color:var(--narr); text-wrap:pretty; white-space:pre-wrap; }
html[data-ui-font="serif"] .narr { font-family:'Instrument Serif',Georgia,serif; font-style:italic; }
html[data-ui-font="sans"] .narr { font-family:'IBM Plex Sans',system-ui,sans-serif; font-style:normal; }
/* The four below are SYSTEM stacks on purpose. The two above come from fonts.googleapis.com, which
   is the only network this page touches; adding more families would deepen that for a local-first
   app. These cost nothing and work with the wire unplugged. */
html[data-ui-font="book"] .narr { font-family:'Iowan Old Style',Palatino,'Palatino Linotype','Book Antiqua',Georgia,serif; font-style:normal; }
html[data-ui-font="garamond"] .narr { font-family:Garamond,'EB Garamond','Apple Garamond',Baskerville,'Times New Roman',serif; font-style:normal; }
html[data-ui-font="system"] .narr { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-style:normal; }
html[data-ui-font="mono"] .narr { font-family:ui-monospace,'IBM Plex Mono',Menlo,Consolas,monospace; font-style:normal; }
.said { max-width:600px; font-size:var(--bubble); line-height:1.65; color:var(--body); text-wrap:pretty; white-space:pre-wrap; }
.who { font-size:10.5px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--label); }
.block { position:relative; display:flex; flex-direction:column; gap:10px; }
/* Set like a book: paragraphs run on, and the indent is what separates them rather than a blank
   line. The FIRST paragraph of a passage is flush, which is the convention every printed novel
   follows and the reason a drop cap works at all. */
.narr p { margin:0; }
.narr p + p { text-indent:1.4em; }

/* THREE rules down the left margin, and the margin is the only place they are.
   Your own lines used to hang off the right edge, ragged-right and mirrored, which reads as a chat
   app rather than a manuscript — a page of prose has one left edge and everything lines up on it.
   The bar stays, and it is what tells them apart. */
.block.speak { padding-left:16px; border-left:1px solid var(--speak-rule); }
.block.you { padding-left:16px; border-left:1px solid var(--you-rule); }
/* Written to order. The passage the model produced from a directive you typed is not the same thing
   as one it continued on its own, and until now nothing on the page said which — the directive was
   in the database and had never been shown. */
.block.directed { padding-left:16px; border-left:1px solid var(--gold-dim); }
/* The last one on the page, boxed so the eye finds where the book has got to.
   OUTLINE, not border: an outline takes no space at all, so the box cannot move the prose. The first
   version used a border with padding and negative margins to compensate, and it shifted the document
   enough to break the running-head check in panels.js — the band's position is measured there, and
   46px of drift is exactly the kind of thing a decoration should never cause. */
#col .block.newest {
  outline:1px solid var(--chip); outline-offset:12px; border-radius:var(--r);
}
/* Where a search result put you. Fades on its own after a few seconds — a permanent mark on
   whatever you last looked for turns into furniture you stop seeing. */
.block.found { animation: found 6s ease-out forwards; border-radius:var(--r); }
/* Regenerate and Continue, under the last passage. Not in the ⋯ tray and not in the chrome:
   both mean "the end of the page", so they are drawn at the end of the page. Reading mode hides
   them with the rest of the controls — see the data-reading rule at the top. */
.carry { display:flex; gap:8px; padding:14px 0 2px; }
.carry button { border:1px solid var(--edge); border-radius:var(--r); padding:8px 15px;
  font-size:12.5px; color:var(--mute); display:flex; align-items:center; gap:7px;
  transition:border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.carry button:hover:not(:disabled) { border-color:var(--edge-lit); color:var(--ink); }
.carry button:disabled { opacity:.45; }
html[data-reading="1"] .carry { display:none !important; }
@keyframes found {
  0%, 60% { background:rgba(217,178,106,.14); box-shadow:0 0 0 8px rgba(217,178,106,.14); }
  100%    { background:transparent; box-shadow:0 0 0 8px transparent; }
}
@media (prefers-reduced-motion: reduce) { .block.found { animation:none; background:rgba(217,178,106,.12); } }
/* The actions used to appear on :hover only, which put Edit, Regenerate and History out of
   reach of every touch device — and made them untestable. Each block now carries a handle that
   is always present, and hover stays as a shortcut on a pointer. */
/* The ⋯ handle is gone, 2026-08-27: a double tap opens the tray and has since F34's fix, so it
   was a second door to the same room sitting over the prose on every passage. */
.acts {
  position:absolute; right:0; top:-22px; gap:6px; padding:6px; border-radius:var(--r);
  border:1px solid var(--chip); background:rgba(19,18,21,.96); box-shadow:0 20px 50px rgba(0,0,0,.6);
  display:none; z-index:7;
}
@media (hover:hover) { .block:hover .acts { display:flex; } }
/* THE TRAY OPENS CENTRED, NOT AT THE BLOCK. It used to sit at top:-22px right:0 of the paragraph it
   belongs to, so on a phone Edit, Regenerate and Delete arrived at the bottom edge of whichever
   paragraph had been tapped — off the side of the column, and under the thumb only by luck. The
   handle stays where it is; what it opens is a sheet in the middle of the screen, so the reach is
   the same for every paragraph in the chapter.

   Hover is untouched and stays a POINTER shortcut: on a mouse the tray still appears at the block,
   without the sheet and without the scrim. That is not an alternative to the handle — actions on
   :hover only were unreachable on every touch device, which is why the handle exists at all (see
   the note above .more) — so the two are kept side by side deliberately. */
/* The arrival animation comes off the block that has the tray open, and this is the whole reason
   the sheet ever landed anywhere but the middle of the screen. `#col .block.newest` carries
   `animation:rise ... both`, rise ends on `transform:none` but a FILLED transform animation still
   leaves the element a containing block for a position:fixed child and a stacking context that
   caps its z-index. So the sheet centred itself on the newest paragraph instead of on the screen,
   and the scrim painted over the top of it — page.click reported the History button visible and
   the press landed on the backdrop. The animation has finished playing by the time a tray opens. */
/* ISSUE #2, 2026-08-28, and this is the THIRD round of the same bug. The rule was `animation:none`
   alone, written for `.newest`'s filled transform animation. It does not reach `.arrived`, which a
   passage carries for 1.7s after the model writes it and which sets a `mask-image` — and a MASK
   makes an element a containing block for position:fixed descendants and a stacking context,
   exactly as a transform does. `animation:none` kills the wipe and leaves the mask, because the
   mask is a static property of the class rather than part of the animation. So the sheet at
   z-index 32 was capped inside the block and #scrim at 31 painted over it. Seth: "the blur screen
   and the menu are inverted ... any other selection is fine, it is just the new entry."

   TWO CLAUSES, NOT SEVEN. The first version cleared every property that can re-base a fixed child
   — filter, backdrop-filter, perspective, will-change, contain as well. Removing those five left
   the checks green, because nothing sets them on a block today: five lines of code defending
   against nothing. The guard for the CLASS is in test/ui/tray.js, which asserts an open block's
   computed style has none of the seven. Add the clause when the check goes red, with the
   falsification that earns it. */
#col .block[aria-expanded="true"] {
  animation:none;
  -webkit-mask-image:none; mask-image:none;
}
.block[aria-expanded="true"] .acts {
  display:flex; position:fixed; left:50%; top:50%; right:auto; transform:translate(-50%, -50%);
  z-index:32; flex-direction:column; gap:2px; padding:8px;
  width:min(300px, calc(100vw - 44px)); max-height:80vh; overflow-y:auto;
  background:var(--sheet); box-shadow:0 40px 90px rgba(0,0,0,.7);
}
/* Full-width rows, and the labels come back. They were hidden on a phone because the tray was a
   floating strip with no room for them; a centred sheet has the room, and four unlabelled glyphs
   one of which is Delete is not a menu. */
.block[aria-expanded="true"] .acts button { width:100%; padding:12px 14px; font-size:14px; }
.block[aria-expanded="true"] .acts .lbl-txt { display:inline; }
@media (max-width:719px) {
  .acts button { padding:10px 12px; }
  .acts button span { font-size:15px; }
  .acts .lbl-txt { display:none; }
}
.acts button { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--r); font-size:12.5px; color:var(--narr); white-space:nowrap; }
.acts button:hover { background:rgba(255,255,255,.05); }
.flag { display:flex; align-items:flex-start; gap:9px; font-size:11.5px; color:var(--bad);
  text-align:left; width:100%; max-width:100%; }
.flag > span:last-child {
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  line-height:1.5; min-width:0;
}
.flag[aria-expanded="true"] > span:last-child { -webkit-line-clamp:unset; }
/* The actions the flag opens. Hidden until it is expanded, so a passage with three flags is not
   six buttons of chrome over the prose. */
.flag[aria-expanded="false"] + .flagacts { display:none; }
.flagacts { display:flex; flex-wrap:wrap; gap:7px; margin:7px 0 0 14px; }
.flagacts button { padding:6px 11px; border-radius:var(--r); border:1px solid var(--chip);
  color:var(--mute); font-size:11.5px; text-align:left; }
.scenebreak { display:flex; align-items:center; gap:14px; }
.scenebreak i { flex:1; height:1px; background:var(--rule); }

/* GRAIN, on paper only. "Parchment takes grain; the two dark themes are screens and do not" —
   a dark theme with paper texture on it is a screen pretending, and it reads as dirt. Two dot
   fields at different scales so it does not tile visibly. */
#read::after {
  content:''; position:absolute; inset:0; pointer-events:none; opacity:0; z-index:1;
  background-image:radial-gradient(rgba(120,100,70,.16) .5px, transparent .5px),
                   radial-gradient(rgba(120,100,70,.1) .5px, transparent .5px);
  background-size:3px 3px, 7px 7px; background-position:0 0, 2px 3px;
}
html[data-ui-theme="parchment"] #read::after,
html[data-ui-theme="novelist"] #read::after { opacity:.5; }

/* --- the chapter opens ------------------------------------------------------
   A band, a drop cap and a line out of the chapter's own prose. A chapter used to begin with a
   10px label and go straight into the paragraph, which reads as a feed rather than as a book. */
/* The cover, used again at the head of a chapter. Same scrim and same serif as the shelf card
   below, because it is the same picture — two treatments of one image is two things to keep in
   step, and the shelf's is the one that has already been through a contrast pass. */
.plate { position:relative; height:210px; border-radius:var(--r); overflow:hidden;
  margin:0 0 18px; }
.plate .fade { position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(10,10,12,0) 30%, rgba(10,10,12,.94)); }
.plate-title { position:absolute; bottom:16px; left:20px; right:20px; font-size:38px;
  line-height:1.04; color:var(--ink-bright); text-wrap:pretty; }
@media (max-width:719px) { .plate { height:150px; } .plate-title { font-size:26px; bottom:12px;
  left:14px; right:14px; } }

.band { display:flex; flex-direction:column; gap:13px; padding:8px 0 10px; }
.band-title { font-size:48px; line-height:1.04; color:var(--body); text-wrap:pretty; }
.band-epi { display:flex; align-items:flex-start; gap:14px; max-width:520px; }
.band-epi i { width:1px; align-self:stretch; background:var(--gold-dim); opacity:.5; flex:0 0 auto; }
.band-epi span { font-style:italic; font-size:17px; line-height:1.5; color:var(--label); text-wrap:pretty; }
.band-rule { height:1px; background:var(--rule); margin-top:18px; }
@media (max-width:719px) { .band-title { font-size:30px; } .band-epi span { font-size:15px; }
  .band { gap:10px; padding:2px 0 6px; } .band-rule { margin-top:10px; } }

/* The drop cap is ::first-letter, NOT a span. The passage body is contenteditable and the editor
   saves its textContent, so a real element in there would be editable, deletable, and would go
   into the story the moment anyone typed near it. */
#col .block.opening .narr::first-letter {
  float:left; font-family:'Instrument Serif',Georgia,serif; font-style:normal;
  font-size:64px; line-height:.82; color:var(--body); margin:2px 10px 0 0;
}
@media (max-width:719px) { #col .block.opening .narr::first-letter { font-size:46px; margin:1px 8px 0 0; } }


/* --- composer ---------------------------------------------------------- */
/* Column, not row. #working cannot live inside #dockCol — drawDock() sets its innerHTML and would
   wipe the bar mid-generation — so it is a sibling, and as a row sibling with width:100% it pushed
   the whole composer off the right edge for the length of every call. */
/* THE CONTEXT BAR. Full width, three pixels, directly under the header — not a number to read,
   because the number is in the reading a press opens and the blocks behind it are one more press
   away in Context.
   These rules were deleted once, by an index-based splice that removed the running head's CSS and
   took the block sitting next to it. The bar went on rendering with no styling at all: present,
   not hidden, 792px wide and 0 tall, so it was invisible in the app and only a browser check
   caught it. Nothing else could have — every unit check reads the markup, and the markup was right. */
#ctxbar { display:block; width:100%; height:3px; flex:0 0 auto; background:var(--rule);
  position:relative; overflow:hidden; padding:0; border:0; }
#ctxbar i { display:block; height:100%; background:var(--gold-dim);
  transition:width var(--t-slow) var(--ease); }
#ctxbar.full i { background:var(--bad); }
#ctxbar:hover i, #ctxbar[aria-expanded="true"] i { background:var(--gold); }
/* What the bar opens. Everything that used to sit in the header beside the story title. */
#ctxread { flex:0 0 auto; display:flex; align-items:center; gap:20px; padding:9px 40px;
  border-bottom:1px solid var(--chrome-line); background:var(--chrome);
  font-size:11px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--label);
  animation:fade var(--t-fast) var(--ease-out) both; }
#ctxread .tnum { font-variant-numeric:tabular-nums; }
#ctxread button { color:var(--gold-dim); font-size:11px; letter-spacing:.1em;
  font-variant-caps:all-small-caps; }
@media (max-width:719px) { #ctxread { padding:8px 18px; gap:13px; } }

/* NO GROUND UNDER THE DOCK. Seth: "remove the dark background. when its minimized that color
   should only be in the input box." The gradient was a slab the width of the window fading up
   into the prose; what it was really doing was separating the composer from the page, and the box
   can say that by itself. `--dock` survives for the big composer, which IS the page. */
#dock { position:relative; flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
  padding:0 0 calc(28px + var(--hwkb-air, 0px)); background:transparent; }
@media (max-width:719px) { #dock { padding:5px 18px calc(19px + var(--hwkb-air, 0px) + env(safe-area-inset-bottom, 0px)); } }
/* WITH A HARDWARE KEYBOARD THE DOCK SITS STILL, so it can afford to sit off the edge. There is no
   soft keyboard to make room for and nothing below it to reach past — 10px of air, and it stays
   there because nothing moves it any more. Keyed on the root attribute `applyHwkb` writes, so the
   CSS and the meta swap are driven by one place.
   ADDED, not overridden. This said `padding-bottom:34px` — 24 + 10, correct until the phone base
   moved to 19px in the composer rework and the air silently became 15px. Two numbers five lines
   apart that had to agree by hand; now the air is stated once and the base can move without it. */
html[data-ui-hwkb="1"] #dock { --hwkb-air:10px; }
#dockCol { width:100%; max-width:var(--col); display:flex; flex-direction:column; gap:14px; }
/* WHO you are speaking or acting as. It was squeezed into the right-hand end of the modes rail,
   where it read as one more mode and ran out of room on a narrow window. Its own strip now, above
   the rail and the full width of the dock — Seth: "right now its awkwardly placed". */
/* The strip spans the dock; its CONTENTS line up with the mode rail underneath it, because the
   rail is capped at the column width and centred. Left-aligned against 40px of dock padding it
   floated away from the button that summoned it on any window wider than the column. */
/* THE FULL WIDTH OF THE WINDOW, and the two ends of it: the label hard left, the name hard right.
   Anything between them is the strip saying which of the two modes you are in and who you are
   being — Seth: "have the label next to the dropdown be left screen aligned and the drop down
   right screen aligned".

   IT IS TINTED, and the mode button below it is tinted to match, so the pair reads as one piece
   lifted off the rail rather than as a toolbar that happens to sit above one. Both colours come
   from the theme's own tokens rather than from literals, because a theme is one block of variables
   here and a hard-coded pair would be right in obsidian and wrong in the other eight. */
#asRow { width:100%; display:flex; padding:0; }
#asRow > .inner { width:100%; display:flex; align-items:center; gap:9px;
  justify-content:space-between; padding:7px 40px;
  border-top-left-radius:var(--r); border-top-right-radius:var(--r);
  font-size:10.5px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--label); }
/* NO TINT ON THE ROW. Speak's was mixed 88% toward the paper and was invisible; Act's came off the
   accent and was not — so one of the two modes had a filled bar and the other had nothing, which
   reads as a fault rather than as a distinction. Seth: "remove that background so it mimics the
   speaking version of it." Both gone, and the tokens with them: a colour only one of a pair wears
   is not a pair. */
/* THE BUTTON KEEPS NO BACKGROUND. Tinting it to match the strip above was meant to read as one
   raised block; what it actually did was give one of four modes a filled pill the other three do
   not have, which reads as a different KIND of control rather than as the selected one. Seth:
   "remove the background from act when its selected. its the only button that has it."
   The underline is how a selected mode has always said so, and it says it for all four.
   The strip above still carries the tint — that is the part that changes with the mode. */
/* ISSUE #4 — "the act as or speak as row doesn't reach the edges on the left or the right".
   It was inset THREE times on a phone: #dock already pads 18px (see its rule below), then #asRow
   added 18 and .inner added 18 again — 54px against the 18px #modes sits at, so the one strip
   above the mode rail was visibly narrower than everything under it. The dock's padding is the
   only one that should exist; both of the others are gone here. Desktop is untouched: there
   #dock has no horizontal padding at all and .inner's 40px is what centres the strip. */
@media (max-width:719px) { #asRow > .inner { padding:7px 0; } }
#asRow select { background:none; border:0; color:var(--gold); font-size:11.5px;
  letter-spacing:.06em; text-transform:none; max-width:min(60vw, 320px); }
@media (max-width:719px) { #asRow { padding:8px 0 0; } #asRow > .inner { max-width:none; } }
/* IT WRAPS RATHER THAN SCROLLING SIDEWAYS. It was overflow-x:auto with scrollbar-width:none — so
   when the row did not fit it scrolled with nothing on screen saying so, and a control past the
   edge was a control you had no reason to believe existed. It fits at 360px in the shipped sizes,
   but the UI scale goes to 125% and that is enough to push it over.
   Wrapping puts every control on screen at once, which is what a row of six modes needs. */
#modes { display:flex; align-items:center; flex-wrap:wrap; column-gap:22px; row-gap:6px;
  overflow-x:auto; scrollbar-width:none; }
#modes::-webkit-scrollbar { display:none; }
/* `margin-left:auto` on + Thread pushes it right on ONE line; on a wrapped second line it would
   shove it alone to the far edge with a hole beside it. Below the wrap point they simply follow. */
@media (max-width:560px) { #modes button[data-newlore] { margin-left:0 !important; } }
#modes button { flex:0 0 auto; font-size:10.5px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--label); padding-bottom:5px; border-bottom:1px solid transparent; white-space:nowrap; }
#modes button[aria-pressed="true"] { color:var(--gold-lit); border-bottom-color:var(--gold); }
/* Continue is an action, not a mode — it sends on the press. Given the same underline as the four
   selectable modes it read as a fifth thing you pick, which is the one thing it is not. */
#modes button[data-continue] { border:1px solid var(--chip); border-radius:var(--r-pill); padding:5px 13px;
  color:var(--gold-dim); letter-spacing:.2em; }
#modes button[data-continue]:hover:not(:disabled) { border-color:rgba(217,178,106,.42); color:var(--gold-lit); }
#modes button[data-continue]:disabled { opacity:.45; }

/* Something is happening. A generation is 20-40 seconds against a local model, and a composer
   that simply goes quiet reads as a hung page — which is what it was reported as. The bar under
   the document animates for the whole call, and its colour says WHICH action is running, because
   the five do different things and the wait is long enough to forget which you pressed. */
#working { height:2px; width:100%; max-width:var(--col); overflow:hidden; background:transparent; flex:0 0 auto; }
#working[hidden] { display:none; }
#working i { display:block; height:100%; width:38%; border-radius:var(--r-tight);
  background:linear-gradient(90deg, transparent, var(--work, var(--gold)), transparent);
  animation:working 1.15s ease-in-out infinite; }
@keyframes working { 0% { transform:translateX(-100%); } 100% { transform:translateX(320%); } }
#working[data-work="continue"] i { --work:#8FA9C4; }
#working[data-work="speak"]    i { --work:#D9B26A; }
#working[data-work="act"]      i { --work:#C39A76; }
#working[data-work="direct"]   i { --work:#A88FC4; }
#working[data-work="narrate"]  i { --work:#8FBFA5; }
#working[data-work="reroll"]   i { --work:#C8705A; }
@media (prefers-reduced-motion: reduce) {
  #working i { animation:none; width:100%; opacity:.5; }
}
#inputRow { display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--gold); padding:0 0 14px; }
html[data-ui-theme="parchment"] #inputRow { border-bottom-color:rgba(58,52,43,.28); }
/* THE BOX IS THE HEIGHT OF THE BUTTONS BESIDE IT. It was one line tall — 26px against a 34px Send
   on a desk and 24px against 44px on a phone — so the row read as a stripe with two discs on the
   end of it, and the first character typed changed its height. The padding is what makes one line
   fill the button: line-height 1.55 on the font size, plus the padding, equals the button. `fit()`
   measures scrollHeight, which includes the padding, so it agrees without being told. */
#input {
  flex:1; min-width:0; color:var(--body); background:none; border:0;
  resize:none; max-height:140px; padding:9px 0; min-height:44px;
}
/* THE COMPOSER, FULL HEIGHT. A capped box is right for a line and wrong for a paragraph: past the
   cap you are writing into a six-line window and cannot see the top of your own sentence. This is
   the same dock, flexed to the screen — so the mode rail, who you are speaking as, and Anansi all
   come with it rather than being a second composer that drifts from the first.
   The draft is untouched by the toggle because drawDock has always carried it across a repaint;
   that is also why leaving the box, reading the last passage and coming back keeps the text. */
/* THE BACKGROUND LIVES WITH #ghost.veil now, above — see the note there. It was `--dock`, a
   gradient fading to 92% of the paper, and issue #8 killed that: "the background behind the input
   should be completely opaque. It is currently not opaque which makes it hard to read anything."
   The opaque sheet that answered it is gone in turn, replaced by the send blur so the two
   full-screen states feel like one thing. That is a deliberate walk-back of #3's letter, not an
   accident.
   A LITTLE TINT, AND ONLY HERE. Seth, 2026-08-28: "make it a litttttle bit more opaque just when
   its maximized." Send keeps the bare blur; the box you are typing INTO gets something to sit on,
   because #3's complaint was about reading, and here there are words of your own on top. 30% is
   the middle stop of the veil's own history — 62, then 31, then none — so it is the darkness that
   was already looked at and not rejected. Mixed from `--doc-bg`, the theme's own paper, and never
   a literal: 62% of Obsidian and 62% of Parchment are not the same colour and only one of them
   was ever chosen by eye. Declared after the shared rule above, which is what overrides its
   `transparent`; the blur stays shared so the two cannot drift on radius. */
#dock.big { position:fixed; inset:0; z-index:41; padding-top:calc(14px + env(safe-area-inset-top, 0px));
  background:color-mix(in srgb, var(--doc-bg) 30%, transparent); }
#dock.big #dockCol { flex:1; min-height:0; }
#dock.big #inputRow { flex:1; min-height:0; align-items:stretch; }
/* No inline height is set in this mode, so the flex box is the height and the text scrolls in it. */
#dock.big #input { max-height:none; height:auto; }
#input::placeholder { color:var(--label); opacity:.75; }
@media (max-width:719px) { #input { padding:16px 0; min-height:56px; }
  #inputRow { padding-bottom:12px; } }
/* ONE RULE, TWO BUTTONS. Seth: "the maximize button can we style it the same as the send button."
   Shared rather than copied — a second declaration of the same shape is how the two drift, and
   these two flank the box and are read as a pair. #send keeps its own busy state below; nothing
   else here is specific to either.
   VERTICAL RECTANGLES, not discs: 34x44 on a desk and 44x56 on a phone. Taller than wide, so they
   read as the ends of the row the box runs between rather than as two buttons that happen to sit
   near it. The phone width stays at 44 because that is the touch floor; the height grows instead.
   The glyph colour is HERE and not inline on the button — an inline `color:var(--faint)` is what
   kept the arrow grey after this rule was written, which is the second time an inline style on
   that exact button has beaten a stylesheet. */
#send, #inputRow button[data-bigin] {
  width:28px; height:44px; border-radius:var(--r); background:var(--gold); color:var(--on-gold);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto;
}
#send:disabled { opacity:.4; }
/* Writing. The same button, in the same place, saying the one thing it can do now — a disabled
   "…" was a control you could look at and not use, which is what a Stop button is for. Not red:
   stopping your own generation is an ordinary move, not a destructive one, and the passage is
   discarded rather than anything of yours being lost. */
#send.stopping { background:var(--edge-lit); color:var(--ink-bright); font-size:11px;
  animation:breathe 1.6s var(--ease) infinite; }
@keyframes breathe { 0%,100% { opacity:1 } 50% { opacity:.62 } }
/* ISSUE #3 — "the send button and the expand input button are too small". They were: 30px for
   Send on a phone, and the expand button had no box at all — just a 13px glyph with 2px of
   padding, so its tap target was roughly the size of the character. 44px is the floor every
   touch guideline agrees on and F34 is this project's own evidence for why it matters here: a
   press that drifts 24px is a press this surface can already lose, and a target smaller than the
   finger makes the drift the rule rather than the exception.
   Send keeps its 34px on a desktop, where the pointer is exact and a 44px gold disc is a blot. */
/* THINNER ON THEIR SIDES. 38px, not 44 — the touch floor is about the SMALLEST dimension of a
   target and these are 56 tall, so the area is half again what a 44 square gives. The check
   below asserts the short side and the area together for exactly that reason. */
@media (max-width:719px) { #send, #inputRow button[data-bigin] { width:38px; height:56px; font-size:18px; } }
/* The GLYPH, not just the box. The box went to 44px on a phone and the arrow stayed tiny, because
   the button carried `font-size:13px` INLINE and an inline style beats a stylesheet — so the rule
   below was being written and never applied. Seth: "the expand button however is still very very
   small. The icon at least is very very small." The inline sizing is gone; this owns it. */
#inputRow button[data-bigin] { padding:0; }


/* --- side panel -------------------------------------------------------- */
#sideHead { display:flex; align-items:center; gap:12px; padding:20px 22px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; color:var(--ink); }
#sideBody { padding:18px 22px 30px; flex:1; min-height:0; display:flex; flex-direction:column; color:var(--ink); }
@media (max-width:719px) { #sideHead { padding:18px 20px 12px; } #sideBody { padding:10px 20px 26px; } }
.lbl { font-size:12px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--dim); margin:14px 0 5px; }
.lbl:first-child { margin-top:0; }
.field { background:var(--field); border:1px solid var(--chip); border-radius:var(--r); padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); width:100%; font-family:inherit; }
textarea.field { resize:vertical; min-height:70px; }
.hint { font-size:11.5px; color:var(--mute); line-height:1.5; margin:6px 0 0; }
.card { border:1px solid var(--chip); border-radius:var(--r); padding:13px 15px; display:flex; flex-direction:column; gap:5px; }
/* Summaries are supposed to be ~180 words and arrive at four times that, so they are clamped
   for the same reason canon flags are: the panel is an index, not a reading surface. */
.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
[aria-expanded="true"] > .clamp { -webkit-line-clamp:unset; }
.tag { font-size:9.5px; letter-spacing:.1em; font-variant-caps:all-small-caps; padding:2px 8px; border-radius:var(--r-pill); border:1px solid var(--chip); color:var(--dim); white-space:nowrap; }
.kind { font-size:10.5px; letter-spacing:.1em; font-variant-caps:all-small-caps; color:var(--gold-dim); }
.row { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:12.5px; }
.btn { padding:12px; text-align:center; border-radius:var(--r-pill); background:var(--gold); color:var(--on-gold); font-size:11px; font-weight:500; letter-spacing:.1em; font-variant-caps:all-small-caps; display:block; width:100%; }
.btn.ghost { background:none; border:1px solid var(--chip); color:var(--mute); font-weight:400; }
.meter { display:flex; height:6px; border-radius:var(--r-tight); overflow:hidden; background:var(--chip); margin:10px 0 6px; }

/* --- workspace pages --------------------------------------------------- */
#page { position:relative; flex:1; min-height:0; padding:30px 40px; }
@media (max-width:719px) { #page { padding:20px 18px; } }
/* PORTRAIT, at Seth's direction: "like a phone wallpaper". A cover is a book's face and a book is
   taller than it is wide, so the grid holds more of them across and each one is a page rather than
   a banner. Two on a phone, because a portrait card at full width is one book per screen. */
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-content:start; }
@media (max-width:1099px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:719px) { .grid { grid-template-columns:repeat(2,1fr); gap:12px; } }
.split { display:flex; gap:32px; align-items:flex-start; }
@media (max-width:719px) { .split { flex-direction:column; } }
.aside { width:400px; flex:0 0 auto; }
@media (max-width:1099px) { .aside { width:320px; } }
@media (max-width:719px) { .aside { width:100%; } }
.storycard { cursor:pointer; border-radius:var(--r); overflow:hidden; border:1px solid var(--edge); background:var(--rail); text-align:left; display:block; width:100%; }
/* 3:4, the shape of a page. Set as an aspect-ratio rather than a height so the card holds its
   proportions at every column width the grid resolves to. */
.storycard .art { aspect-ratio:3/4; height:auto; position:relative; }
.storycard .art .fade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,10,12,0) 35%,rgba(10,10,12,.92)); }
.dashed { border-radius:var(--r); border:1px dashed var(--chip); min-height:200px; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--faint); }

/* #read and #dock set display:flex, which beats the UA's [hidden]{display:none}. Without this
   the document region stays on screen behind the workspace pages. */
#read[hidden], #dock[hidden], #page[hidden] { display:none !important; }

#toast {
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  /* Nothing in a toast is clickable, and it sits directly over the composer. Without this it
     swallows every click on the input for 4.2 seconds — so the error telling you to type
     something was the thing stopping you from typing it. */
  pointer-events:none;
  background:var(--field); border:1px solid var(--chip); color:var(--ink); padding:11px 18px;
  border-radius:var(--r-pill); font-size:12.5px; box-shadow:0 20px 50px rgba(0,0,0,.6); max-width:90vw;
}
/* The @ menu. Floats ABOVE the ask box rather than sitting in the column, so opening it moves
   nothing — the whole point of a menu that appears while you are mid-sentence. Opaque, because it
   sits over the conversation you are reading. */
#atlist {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:6px; z-index:3;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlist[hidden] { display:none; }

/* The mirror behind the ask box. Every property that affects WRAPPING is set on both at once —
   two declarations for one shape is how they drift apart and the highlight ends up a line above
   what it is highlighting. */
#askWrap { position:relative; display:flex; }
#askWrap > #askMirror, #askWrap > #askBox {
  font:inherit; font-size:13.5px; line-height:1.55; letter-spacing:normal;
  padding:11px 13px; border:1px solid transparent; border-radius:var(--r);
  white-space:pre-wrap; overflow-wrap:break-word; word-break:normal;
}
#askWrap > #askBox { position:relative; z-index:1; background:transparent; flex:1; min-width:0; }
#askMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
}
/* Only what is going to be SENT is marked. Nothing else in this app tints text, so the tint is
   unambiguous: it means she is getting the thing and not only the word. */
/* THE WORD IS THE ACCENT, not a block of colour behind it. Seth: "let's not make it gold, let's
   just make the word the accent color of the theme that is currently selected."
   `--gold` was already the theme's accent — `themeVars` writes it from `S.accent` — so on
   Cyberpunk it was already teal and on Novelist already red. What it was NOT was the word: it was
   a tint behind transparent text, which reads as a highlighter pen rather than as a mark.
   So the mirror stops being invisible: it renders ALL the text, and the textarea's own text goes
   transparent with only its caret left. That is the one way to colour part of a textarea, and it
   is why the two must agree about every property that affects wrapping — the mirror is what you
   are reading now, not a layer behind what you are reading. */
#askBox, #input { color:transparent; caret-color:var(--gold); }
#askMirror, #inputMirror { color:var(--body); }
/* COLOUR ONLY. `font-weight:600` was here and it is what put the caret adrift: the mirror draws
   the text and the TEXTAREA carries the caret, so a mention rendered bolder than the invisible
   text under it is wider than the letters the caret is counting, and every character after it
   sits further from the cursor. Any property that changes a glyph's WIDTH breaks this pair.
   Seth: "the cursor is spaced out far away from the thing being written." */
#askMirror mark, #inputMirror mark {
  background:transparent; color:var(--gold); border-radius:0;
}
/* Selected text has to come back, or dragging over your own sentence selects a row of nothing.
   ::selection can restore a colour for the selected range even when the text under it is
   transparent, which is the one thing that makes the trick above survive being edited. */
#askBox::selection, #input::selection { color:var(--ink-bright); background:var(--edge-lit); }

/* The composer's mirror. Same trick as the ask box's and the same rule: every property that
   affects WRAPPING is set on both at once. #input is the one that already had its sizing, so the
   mirror inherits from it rather than restating it — a second copy of `padding:10px 0` is how the
   highlight ends up a line above the word it is highlighting. */
/* The colour lives HERE now, in the box itself, with the room to carry it. Horizontal padding
   arrives with the background — text against the edge of a filled box reads as a mistake — and
   the mirror takes the same, because the two must agree about every property that moves a glyph. */
#inputWrap { position:relative; flex:1; min-width:0; display:flex; --field-pad:13px;
  background:var(--field); border-radius:var(--r); padding:0 var(--field-pad); }
#dock.big #inputWrap { background:transparent; --field-pad:0px; }
#inputWrap > #input { position:relative; z-index:1; background:transparent; }
/* ONE DECLARATION FOR BOTH BOXES — the shape #askWrap already uses, and the shape the comment
   above claimed for this pair without ever having. They had a rule each and the mirror's lost:
   `#inputMirror { font-size:17px }` was declared HERE and `font:inherit; font-size:inherit` in the
   block below it, which wins on order at equal specificity. So the mirror drew at the inherited
   body size in every mode while the textarea drew at 17px. The caret counts the TEXTAREA's letters
   and you read the MIRROR's, so every character pushed the two further apart — Seth, 2026-08-28:
   "as you type it creates more and more space." One line of prose measured 333.3px in the textarea
   against 274.5px in the mirror before this rule; the same trap as `color:transparent` two blocks
   down, in the same block, found the same way. Every property that changes a glyph's WIDTH goes
   here and nowhere else. */
#inputWrap > #input, #inputWrap > #inputMirror {
  font:inherit; font-size:17px; line-height:1.55; letter-spacing:normal;
}
@media (max-width:719px) { #inputWrap > #input, #inputWrap > #inputMirror { font-size:15.5px; } }
/* The horizontal inset is the one thing they CANNOT share. The mirror is positioned against the
   wrap's PADDING box, so it begins outside the padding the textarea begins inside of and has to
   re-add it by hand. Taken from the wrap's own variable, so the maximized composer — which drops
   that padding to nothing — moves both boxes with one number instead of leaving the mirror inset
   13px from a caret that is not. */
#inputMirror { padding:9px var(--field-pad); }
@media (max-width:719px) { #inputMirror { padding:16px var(--field-pad); } }
#inputMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
  font:inherit; font-size:inherit; line-height:1.55; letter-spacing:normal;
  white-space:pre-wrap; overflow-wrap:break-word;
}

/* The composer's own @ list, above the row rather than below it — the dock is at the bottom of
   the screen and a menu under it would be off the edge. */
#atlistInput {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:8px; z-index:6;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlistInput[hidden] { display:none; }
#inputRow { position:relative; }

#toast[hidden] { display:none; }
</style>
</head>
<body>

<div id="shell">
  <nav id="rail" aria-label="Anansi"></nav>
  <div id="scrim"></div>

  <!-- OUT OF #doc, 2026-08-28, and this is a positioning fix rather than a tidy-up. The panel is
       `position:fixed; inset:0` at phone width and measured full-viewport in headless Chrome at
       every UI scale — and on a real Android it rendered as a band between the header and the
       composer, with both showing above and below it. A `position:fixed` element is only fixed to
       the VIEWPORT while no ancestor makes itself the containing block, and any of transform,
       filter, backdrop-filter, perspective, will-change, contain or `zoom` does. `zoom` is on
       <body> for the UI scale (app.html:72) and the bar carries a backdrop-filter; which one it
       was on that device is not worth chasing, because the fix removes the dependency instead of
       naming the cause. `#shell` is ALREADY `position:fixed; inset:0`, so a child of it with
       `position:absolute; inset:0` fills the window with no fixed positioning involved at all.
       #rail and #scrim have always lived here for the same reason. -->
  <div id="appearance" hidden></div>

  <main id="doc">
    <div id="wash"></div>
    <header id="bar"></header>
    <!-- The context meter, full width and immediately under the header. It was a 74px rule inside
         the running head, which put the one number that says whether the book still fits into the
         one row that is hidden until you scroll. Seth: "it should span the full window". The
         readout under it — which chapter, how many words, how much context — is what a press
         opens; none of it is in the header any more. -->
    <!-- The cover, kept behind the prose while you read. Outside #read on purpose: a sticky
         element cannot leave its own scroller, so a backdrop that must not move cannot live in
         the thing that moves. -->
    <div id="backdrop" hidden aria-hidden="true"></div>
    <button id="ctxbar" hidden></button>
    <div id="ctxread" hidden></div>
    <div id="read" class="scroll"><div id="col"></div></div>
    <div id="page" class="scroll" hidden></div>
    <div id="dock"><div id="working" hidden><i></i></div>
      <!-- Above the mode rail and outside #dockCol, which is capped at the column width. Who you
           are speaking or acting as is not a mode, and sharing the rail with the four that are is
           what made it read as a fifth. -->
      <div id="asRow" hidden></div>
<div id="dockCol"></div></div>
  </main>

  <aside id="side" hidden>
    <div id="sideInner">
      <div id="sideHead"></div>
      <div id="sideBody" class="scroll"></div>
    </div>
  </aside>
</div>

<div id="toast" hidden></div>

<script type="module" src="./web/app.js"></script>
</body>
</html>
