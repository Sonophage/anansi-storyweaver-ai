/* A PANEL FULL SCREEN, and back (data-panelfull, 2026-11-02). The +'s shape under a class of its own,
   because `.headadd` IS the + to test/ui (newthread.js, threadlist.js). Ink, not the +'s gold: it is
   not the panel's one main press (ADR 0004). Not on a phone, where the panel is already a sheet over most of
   the screen and the head had no room for it: the title came down to "Thre…". */
.headfull { color:var(--mute); }
.headfull[aria-pressed="true"] { color:var(--ink-bright); }
@media (max-width:719px) { .headfull { display:none; } }
/* THE HANDOFF'S PICKED STATE IS NOT HERE, and that is deliberate rather than an omission. Nothing
   sets `aria-pressed` on a plate: the only place a thread is picked is the cross-book seed picker,
   and that is `data-seedpick`, a different renderer with its own chosen treatment. A rule written
   for a selector no markup carries is a rule that looks tested and is not.
   Its warning is worth keeping even so, because it is about this file: a bare colour passed as the
   whole `border` shorthand silently drops the declaration, and the card loses its edge and ground
   with it. Every property above is named for that reason. */
/* Summaries are supposed to be ~180 words and arrive at four times that, so they are clamped:
   the panel is an index, not a reading surface. */
.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
[aria-expanded="true"] > .clamp { -webkit-line-clamp:unset; }
.tag { font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:2px 8px; border-radius:var(--r-pill); border:1px solid var(--chip); color:var(--dim); white-space:nowrap; }
.kind { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--label); }
.row { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:12.5px; }
/* A BUTTON IS NOT A LABEL. Seth, 2026-09-03, wanted the label treatment everywhere; a button is
   where that stops. `.lbl`, `.kind`, `.tag` and `.up` name things in two or three words and read
   fine in capitals. A button says what will happen — "Start a new book from these threads", "Read
   the whole book for this thread" — and capitals strip word-shape, which is the main cue for
   reading a sentence at a glance and a known cost for a dyslexic reader.
   The size goes up with the case: 11px was chosen for capitals, which have no descenders. */
.btn { padding:12px; text-align:center; border-radius:var(--r-pill); background:var(--gold); color:var(--on-gold); font-size:12.5px; font-weight:500; letter-spacing:.02em; display:block; width:100%; }
.btn.ghost { background:none; border:1px solid var(--chip); color:var(--mute); font-weight:400; }

/* ISSUE #33 · A PANEL'S OWN SAVE, PINNED WHERE IT CAN BE REACHED. Seth, 2026-08-31: "All save
   buttons must be at the top and should be sticky."

   NOT A NEW PATTERN — the card form's head has done exactly this since it was written
   (`cardHead` in app.js: sticky, top 0, --rail behind it). This is that, named, so the three
   panels with a whole-panel Save stop each writing their own copy of it.

   THE NEGATIVE GUTTER IS LOAD-BEARING. #sideBody carries 22px of side padding, so a bar left at
   its content width covers the middle of the form and lets it slide past in the 22px either side.
   Pulled out to the panel edges and re-padded, the bar is opaque all the way across.

   `top:0` holds against #sideBody because that is the scroll container — it carries `.scroll`, and
   the settle animation on its children ends at `transform:none`, so nothing here inherits a lasting
   transform that would break sticky. (Do not write the at-rule name for that animation in here:
   test/web.ts counts declarations by scanning this file, and a mention in a comment reads as a
   second declaration. It cost a red on 2026-08-31.) */
/* ISSUE #38 · THE RE-ROLL INSTRUCTION, UNDER THE PASSAGE IT PRODUCED. Seth, 2026-09-01: "I should
   be able to edit the regenerate command."

   Inside .block, so it inherits the column width and sits with the paragraph rather than floating
   over it. Its own ground and a gold edge, because it is a control in a column of prose and has to
   read as one — the passage above it is the thing being replaced. */
/* bugs.md #9 · A PASSAGE THAT ARRIVED WITH NOBODY WATCHING. Quiet on purpose: it is provenance, not
   a question. The prose is already in the book and everything you might do to it is on its tray. */
.cameback {
  margin:8px 0 0; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--label);
}

/* CENTRED ON THE SCREEN, NOT UNDER THE PARAGRAPH — Seth, 2026-09-02: "this should be as a toast
   center screen not inline." It was a panel that opened inside the block, so on a long passage the
   instruction you were editing arrived below the fold of the paragraph it belongs to.
   THE SAME ROUTE THE ACTS TRAY TAKES, and for the reasons written at length above that rule: a
   `position:fixed` child of a block carrying a filled transform animation or a mask is positioned
   against the BLOCK rather than the window, and its z-index is capped inside it — so the block gets
   the same two clauses while this is open. Third round of that bug; second feature to need the fix.
   The scrim rises under it on `html[data-rerollsheet]`, so a press outside is Cancel. */
.rerollbox { display:none; }
/* THE FULL-SCREEN BOX, as #dock.big draws it: the same blur and wash, the box flexed to the
   window, Cancel and Reweave flanking it the way Back and Send flank the composer's. */
.block:is(.rerolling, .altering) .rerollbox {
  position:fixed; inset:0 0 auto 0; height:var(--kbh, 100%); z-index:41; margin:0; display:flex; flex-direction:column; gap:14px;
  padding:calc(18px + env(safe-area-inset-top, 0px)) 18px 18px; box-sizing:border-box;
  background:color-mix(in srgb, var(--doc-bg) 66%, transparent);
  backdrop-filter:blur(10px) saturate(.9); -webkit-backdrop-filter:blur(10px) saturate(.9);
}
.rerollbox .rwhead { width:100%; max-width:var(--col); margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.rerollbox .rwquote { font-size:17px; font-style:italic; color:var(--narr); line-height:1.45; }
.rerollbox .rwrow { flex:1; min-height:0; width:100%; max-width:var(--col); margin:0 auto;
  display:flex; align-items:stretch; gap:12px; }
.rerollbox .rwrow textarea { flex:1; min-height:0; height:auto; margin:0; resize:none; }
/* A HOLD ON REWEAVE OPENS ITS BOX, in the tray as on the bar (#nextrow button above), so no text
   selection and no iOS callout on the long press. */
[data-re] { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
/* Reweave's two fields, the instruction over What didn't work. The instruction takes the room; the
   note is three rows, because it is optional and short. */
.rerollbox .rwfields { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:6px; }
.rerollbox .rwrow textarea[data-rerollwhy] { flex:0 0 auto; font-size:17px; line-height:1.45; }
/* NO BOX ROUND THE TEXT. Seth, 2026-10-26: "the text is bounded by a blue box". The field's own
   border and the global focus ring drew a frame inside a screen that is already nothing but the
   field — the full-screen composer dropped both for the same reason (#dock.big #inputWrap). */
.rerollbox .rwrow textarea { border-color:transparent; background:transparent; padding-left:0; padding-right:0; }
.rerollbox .rwrow textarea:focus-visible { outline:none; }
/* Reweave's instruction is an instruction, in the serif. Alter's text is the passage, set exactly
   as the page sets it — narration or speech, in the tale's own reading font and size (Seth,
   2026-10-26: "The font changes ... I think in edit mode"). The family comes from the .narr rules
   for the chosen font; .field would otherwise win the size and colour. */
.rerollbox textarea[data-rerollbox] { font-family:'Instrument Serif', var(--serif, serif); font-size:20px; line-height:1.5; }
.rerollbox textarea:is(.narr, .said) { font-size:var(--prose); line-height:1.7; color:var(--narr); }
.rerollbox .rwside { width:38px; border-radius:var(--r); display:flex; align-items:center;
  justify-content:center; flex:0 0 auto; border:1px solid var(--chip); color:var(--ink); }
/* THE COMPOSER'S SIZE, NOT THE BOX'S. Seth, 2026-10-26: "the buttons are really long". The row
   stretches its children to the box's height, so Cancel and Save ran the full height of the screen.
   A height of their own stops the stretch: 44 on a desk and 56 on a phone, as #send and Full screen. */
.rerollbox .rwside { height:44px; }
@media (max-width:719px) { .rerollbox .rwside { height:56px; } }
.rerollbox .rwgo { background:var(--gold); color:var(--on-gold); border-color:transparent; }
.rerollbox .rwside .btnword { display:none; }
@media (min-width:720px) { .rerollbox .rwside { width:auto; padding:0 14px; gap:7px; }
  .rerollbox .rwside .btnword { display:inline; } }
html[data-rerollsheet="1"] #scrim { opacity:1; pointer-events:auto; z-index:31; }

/* #126 · THE POCKET PANEL, full screen like the Alter and Reweave box: the same blur and wash, the
   fields in the reading column's width, Cancel and Save at the foot. A child of #shell (see the
   element's note), so absolute fills the window. */
#pocketPanel, #mergePanel { position:absolute; inset:0; z-index:41; height:var(--kbh, 100%); display:flex; flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  box-sizing:border-box; background:color-mix(in srgb, var(--doc-bg) 66%, transparent);
  backdrop-filter:blur(10px) saturate(.9); -webkit-backdrop-filter:blur(10px) saturate(.9); }
#pocketPanel[hidden], #mergePanel[hidden] { display:none; }
.pocketbox { flex:1; min-height:0; width:100%; max-width:var(--col); margin:0 auto; display:flex; flex-direction:column; gap:12px; }

/* The header bar at the top of the full-screen pocket box (pocketPanel, 2026-11-02). */
.pocketbox .pkbar { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--line); }
/* READ'S TAB CHIPS (cardTabs in app.js). They were inline. */
.tabrow { display:flex; gap:6px; margin:12px 0 4px; }
.tabchip { flex:1; text-align:center; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  padding:10px 2px; white-space:nowrap; border-radius:var(--r); border:1px solid var(--chip); color:var(--mute); }
.tabchip[aria-pressed="true"] { border-color:var(--ink-bright); background:transparent; color:var(--ink-bright); }
.pocketbox .pkkind { flex:1; text-align:center; font-size:12px; padding:10px 4px;
  border-radius:var(--r); border:1px solid var(--chip); color:var(--mute); }
.pocketbox .pkkind[aria-pressed="true"] {
  border-color:var(--ink-bright); color:var(--ink-bright); }
.pocketbox .pkkinds { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
.pocketbox .pkkind { flex:1 1 30%; font-size:11.5px; padding:8px 4px; }
.pocketbox .pkscroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
.pocketbox .pkbody { min-height:120px; max-height:46vh; }
.pocketbox .pkfoot { display:flex; gap:8px; }
.pocketbox .pkfoot .btn { flex:1; height:44px; }
@media (max-width:719px) { .pocketbox .pkfoot .btn { height:52px; } }
/* A POCKET IN A LIST, on the read face and the Pockets tab (pocketRow, 2026-11-02). No box per pocket:
   rows on a hairline, as the hem lists its rows, the name over its kind and its text. The left side
   is one press into the pocket box; the switch sits on the right. A pocket that is off is dimmer. */
.pocketlist { display:flex; flex-direction:column; margin-top:2px; }
.pocketrow { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
.pocketrow .pocketopen { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; text-align:left;
  cursor:pointer; min-height:44px; justify-content:center; }
.pocketrow .pkname { font-size:15px; color:var(--ink-bright); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pocketrow .pkline { font-size:12.5px; line-height:1.5; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pocketrow .pkline.clamp2 { white-space:normal; }
/* A KIND'S HEADING over its pockets (2026-11-03), with the rule its first row would have had. */
/* In the serif and in sentence case, not the capitals the sections wear, so a kind never reads as a
   third section heading under Pockets and Not turned on. */
.pocketlist .pkgroup { margin:18px 0 0; padding-bottom:6px; border-bottom:1px solid var(--line);
  font-family:'Instrument Serif', var(--serif, serif); font-size:18px; letter-spacing:0; text-transform:none;
  color:var(--ink-bright); }
.pocketlist .pkgroup:first-child, .pocketlist .pkoff + .pkgroup, .pocketlist .pkoff + .tipcard + .pkgroup { margin-top:8px; }
.pocketrow:not(.lit) .pkname { color:var(--ink); }
.pocketrow:not(.lit) .pkline { color:var(--dim); }
.pocketrow .pocketsw { flex:0 0 auto; cursor:pointer; }
.pocketrow .pocketsw[aria-pressed="true"] { border-color:var(--edge-lit); color:var(--ink-bright); }
.pocketlist .pkoff { margin:28px 0 4px; color:var(--faint); }
.pocketlist .pkoff:first-child { margin-top:6px; }
.pocketlist .pkempty { margin:4px 0 6px; }

.savebar {
  position:sticky; top:0; z-index:2; background:var(--rail);
  margin:0 -22px 18px; padding:12px 22px; border-bottom:1px solid var(--line);
}
/* The button carries its own inline margins at every call site; inside the bar the padding is the
   spacing, so they are overridden here rather than removed one by one. */
.savebar > .btn { margin:0 !important; }
@media (max-width:719px) { .savebar { margin:0 -20px 14px; padding:10px 20px; } }
/* FLUSH UNDER THE PANEL HEAD. Seth, 2026-09-01, of the Read / Edit / Back bar on a thread: "theres
   a space above it and the threads and close section can we remove the padding and make the
   background full width of the panel." #sideBody's own top padding sat between the head's border
   and the bar, so the bar read as a floating strip rather than a second row of the header.

   THE PADDING GOES; A NEGATIVE MARGIN DOES NOT WORK HERE. Measured in the driver: -18px on the bar
   moved its static position up to the head, and then sticky clamped it straight back down, because
   a sticky box is held inside its containing block and that is the panel's flex wrapper, whose own
   top the child's margin does not move. The bar sat at exactly the same 18px and the computed style
   said -18px, which is the shape of a fix that reads as applied and is not. Dropping the padding
   moves the wrapper instead, so there is nothing left to clamp against.

   `:has()` and `:first-child` because the padding must only go when a bar is what LEADS the panel:
   one that opens on a label still wants its 18px, and one with its help web open puts that card
   first, which turns this rule off on its own rather than pulling the bar up underneath it. Two
   shapes to match — most panels return a flex-column wrapper with the bar inside it, and a bar
   written as a direct child of #sideBody would miss a rule aimed only at the nested one.

   This is every savebar in the app, not only the thread card's: the gap above them is one bug in
   one component, and fixing it in one place is the point of having the component. Measured rather
   than eyeballed — test/ui/panels.js asserts the gap, the inset and the width in pixels, because
   the first attempt here was invisible to every source-level check in the repo.

   A HIDDEN EXPLANATION DOES NOT COUNT AS LEADING THE PANEL, and that is the two extra selectors.
   The four panels with a web of their own used to render nothing at all while it was shut; since
   2026-09-03 the card is always in the document and merely `hidden`, so it became `:first-child`
   and turned this rule off on every one of them — an 18px gap above the bar, permanently, on
   Threads, Strings, Context and Anansi. `:first-child` is structural and does not care that the
   element draws nothing, so the exception has to be written out.
   `[hidden]` is doing the work: shut, the bar is still what leads the panel and stays flush; OPEN,
   the card really does lead and the padding comes back, which is what the paragraph above wanted. */
#sideBody:has(> .savebar:first-child),
#sideBody:has(> :first-child > .savebar:first-child),
#sideBody:has(> .tipcard[hidden]:first-child + .savebar),
#sideBody:has(> .tipcard[hidden]:first-child + * > .savebar:first-child) { padding-top:0; }
/* THE LONG WAY ROUND, FOLDED. A <details>, because the browser already has this and a state flag
   plus a repaint would throw away whatever is half-typed inside the fold. The default marker goes
   — it is a black triangle no theme here would own — and the chevron is text, so it takes the
   theme's colour like everything else. */
/* A FOLD'S HEADING IS A LABEL — Seth, 2026-09-03: "i have labels that are not." These are
   Over time, Brings in with it and Another book, and they were the one heading shape in the app
   that never wore the treatment, because they are a <summary> rather than a .lbl. */
details.fold > summary { list-style:none; cursor:pointer; padding:10px 0; font-size:11.5px;
  color:var(--mute); letter-spacing:.1em; text-transform:uppercase; }
details.fold > summary::-webkit-details-marker { display:none; }
details.fold > summary::before { content:'\203A\00a0'; color:var(--faint); }
details.fold[open] > summary::before { content:'\2304\00a0'; }
.meter { display:flex; height:6px; border-radius:var(--r-tight); overflow:hidden; background:var(--chip); margin:10px 0 6px; }

/* --- workspace pages --------------------------------------------------- */
#page { position:relative; flex:1; min-height:0; padding:30px 40px; }
@media (max-width:719px) { #page { padding:20px 18px; } }
/* PORTRAIT, at Seth's direction: "like a phone wallpaper". A cover is a book's face and a book is
   taller than it is wide, so the grid holds more of them across and each one is a page rather than
   a banner. Two on a phone, because a portrait card at full width is one book per screen. */
/* #22. Every card the same height in the selectable view. `.card` has no height cap and the body
   printed whole, so one long thread made a tall card and the whole grid row stretched to it — a
   shelf of even cards with one giant among them. Three lines and a fixed height, so the grid is a
   grid; the whole body is one press away on the card itself. */
.clamp3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* Two lines, for the Chapters panel's opening sentence: a first sentence can be a paragraph long
   and a row that grows with it stops being a row. Same idiom as the two above it. */
.clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.grid > .card { min-height:132px; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-content:start; }
@media (max-width:1099px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:719px) { .grid { grid-template-columns:repeat(2,1fr); gap:12px; } }
.split { display:flex; gap:32px; align-items:flex-start; }
@media (max-width:719px) { .split { flex-direction:column; } }
.aside { width:400px; flex:0 0 auto; }
@media (max-width:1099px) { .aside { width:320px; } }
@media (max-width:719px) { .aside { width:100%; } }
/* A COLUMN, NOT A BLOCK, and that is the whole of the fix for Seth's 2026-09-02 report: "some of
   the covers are being pushed down so you cant see the whole thing her as well as the labels."
   MEASURED at 768px: three cards in a row, every one 527px tall because the grid stretches them to
   the tallest, every cover 278px — and the cover's top sat 1px inside the card on the one with the
   longest blurb, 39px on the next and 70px on the third. The slack was split ABOVE and BELOW the
   art, so the cover and the genre tags on it slid down the card by half the difference.
   A BUTTON CENTRES ITS OWN CONTENT. The card is a button element and `display:block` does not stop
   the UA centring its inner box vertically, so any card shorter than its row got the difference
   shared between its two ends. An explicit flex column takes the centring away and puts the slack at the
   bottom, where it is a card that ends early rather than a cover that has moved. */
.storycard { cursor:pointer; border-radius:var(--r); overflow:hidden; border:1px solid var(--edge); background:var(--rail); text-align:left; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; width:100%;
  /* A shelf of objects standing on a surface rather than a grid of tiles. The whole of the
     "more bookshelf" brief is this shadow and the spine below it — no paper texture, no plinth,
     no painted-on lighting. */
  box-shadow:0 20px 44px -18px rgba(0,0,0,.9); }
/* The spine, down the LEFT edge, drawn on .art rather than as another element because the card's
   markup is already six deep and a pseudo-element cannot be forgotten by a caller. */
.storycard .art::after { content:''; position:absolute; top:0; bottom:0; left:0; width:7px;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.05) 60%,rgba(0,0,0,.3)); }

/* FOUR ACROSS, not the three of .grid — and its own class rather than a wider .grid, because
   .grid is the Threads and Waiting card grid too and those hold text cards, not covers. */
.shelfgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; align-content:start; }
@media (max-width:1099px) { .shelfgrid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:719px) { .shelfgrid { grid-template-columns:repeat(2,1fr); gap:12px; } }

/* FIRST RUN. Centred in the page rather than pinned to the top, because there is nothing above it
   to be under and a heading alone at the top of an empty screen reads as a page that failed to
   load. */
.firstrun { display:flex; flex-direction:column; justify-content:center; gap:26px;
  min-height:min(560px, 70vh); max-width:900px; }
/* The one gold line on the screen. A border under the input rather than a box around it: this is
   the thing to type in, and a field among three outlined buttons is not obviously that. */
.sparkline { display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--gold);
  padding-bottom:14px; }
.sparkline > textarea { flex:1; min-width:0; background:none; border:0; padding:0; resize:none;
  font-size:17px; line-height:1.55; color:var(--ink); min-height:27px; field-sizing:content; }
.sparkline > textarea:focus { outline:none; }
.firstways { display:flex; gap:10px; flex-wrap:wrap; }
/* (The case reset that lived here went on 2026-09-03: `.btn` stopped uppercasing, so a rule
   undoing it undoes nothing. The rest is still this row's own sizing.) */
.firstways > .btn { width:auto; padding:9px 14px; height:auto; font-size:12px; letter-spacing:0;
  font-weight:400; border-radius:var(--r); }
@media (max-width:719px) {
  .firstrun { gap:22px; min-height:0; }
  .firstrun .serif { font-size:34px; }
  .firstways { flex-direction:column; }
  .firstways > .btn { width:100%; text-align:center; }
}

/* THE RESUME BAND, AS THE HERO (v3 design, 2026-10-25). Structural only: what depends on which
   tale it draws stays inline in resumeBand().

   THE WHOLE SCREEN BUT THE RACK'S OWN LINE. Seth, 2026-10-25: the hero "a bit bigger up top",
   and the cards lower "so only the rack line is at the bottom as a prompt to scroll down". So it
   starts closer under the header (the negative margin takes back part of the page's top padding)
   and ends where "The rack" still shows at the bottom edge, with the cards under the fold. svh, so
   a phone's own address bar does not push the line off. The two subtractions are the header, the
   page's padding and the line with its gap: measured, iPhone 71+24 above and 43 below, a desk
   77+36 above. -16px and not more: further up, the strip under the header covers its top edge.

   ITS OWN DARK, ON EVERY THEME. The type over it is light, so the ground is always dark: the
   picture under a wash, or the theme's accent mixed into a fixed near-black. On parchment the hero
   is a dark plate on a light page, which is what a cover on a desk is. */
.resumeband { position:relative; display:flex; flex-direction:column; overflow:hidden;
  height:max(260px, calc(100svh - 138px)); margin-top:-16px; padding:22px 18px 18px; box-sizing:border-box;
  border-radius:var(--r); border:1px solid var(--edge); color:#fff;
  background:linear-gradient(180deg, color-mix(in srgb, var(--gold) 62%, #0e0c10) 0%,
    color-mix(in srgb, var(--gold) 48%, #0e0c10) 55%, color-mix(in srgb, var(--gold) 30%, #0e0c10) 100%);
  box-shadow:0 26px 60px -20px rgba(0,0,0,.85); animation:rise var(--t-slow) var(--ease) both; }
@media (min-width:720px) { .resumeband { height:max(380px, calc(100svh - 156px)); padding:28px 32px 24px; } }
/* A SHORT SCREEN (the Titan's 360x360) has no room for "most of the screen": the hero takes the
   height its words need, the threads' bar and the count come off, and the title comes down a size,
   so nothing is cut off its top. */
@media (max-height:520px) { .resumeband { height:auto; margin-top:0; padding:16px 14px 14px; }
  .resumeband > .herobody { gap:8px; } .resumeband .bandtitle { font-size:32px; }
  .resumeband .herosent, .resumeband .herocount { display:none; }
  .resumeband > .glass { margin-top:10px; padding:10px 12px; } .resumeband .quote { -webkit-line-clamp:2; }
}
.resumeband > .art { position:absolute; inset:0; cursor:pointer; width:100%; height:100%; margin:0; padding:0;
  border:0; border-radius:inherit; background:transparent; }
.resumeband > .art:focus-visible { outline:2px solid var(--gold-lit); outline-offset:-4px; }
.resumeband > .wash { position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(4,6,12,.25) 0%, rgba(4,6,12,0) 25%, rgba(4,6,12,.45) 62%,
    rgba(14,12,16,.94) 100%); }
.resumeband.haspic > .wash { background:linear-gradient(180deg, rgba(4,6,12,.45) 0%, rgba(4,6,12,.2) 28%,
    rgba(4,6,12,.6) 60%, rgba(14,12,16,.96) 100%); }
/* The rings: four, a quarter of the cycle apart, breathing out from behind the title. The global
   reduced-motion rule stops them; the resting opacity is what is left on screen then. */
.resumeband > .rings { position:absolute; left:50%; top:38%; pointer-events:none; }
.resumeband > .rings > i { position:absolute; left:0; top:0; width:300px; height:300px; border-radius:50%;
  border:1px solid rgba(255,255,255,.35); opacity:.15; transform:translate(-50%,-50%);
  animation:heroring 9s linear infinite; }
.resumeband > .rings > i:nth-child(2) { animation-delay:-2.25s; }
.resumeband > .rings > i:nth-child(3) { animation-delay:-4.5s; }
.resumeband > .rings > i:nth-child(4) { animation-delay:-6.75s; }
@keyframes heroring { 0% { transform:translate(-50%,-50%) scale(.2); opacity:0; } 30% { opacity:.5; }
  100% { transform:translate(-50%,-50%) scale(1.6); opacity:0; } }
.resumeband > .herobody { position:relative; flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; text-align:center; pointer-events:none; }
.resumeband .herokind { font-size:11px; font-weight:600; letter-spacing:.28em; text-transform:uppercase;
  color:rgba(255,255,255,.78); }
.resumeband .bandtitle { font-size:clamp(34px, 11vw, 58px); line-height:1; font-weight:300;
  color:#fff; text-shadow:0 2px 16px rgba(0,0,0,.35); text-wrap:balance; overflow-wrap:anywhere; }
.resumeband .herowhere { font-size:15px; letter-spacing:.04em; }
.resumeband .herocount { font-size:12px; color:rgba(255,255,255,.75); }
/* The threads sent in the scene last worked on: #ctxbar's segments (sentSegs in app.js), coloured by
   kind, a woken one dimmed. Its height held while they load, so the hero does not jump. */
.herosent { display:flex; gap:3px; width:min(200px, 100%); height:4px; }
.herosent > i { flex:1 1 0; min-width:0; border-radius:2px; }
.herosent > i.word { opacity:.45; }
.herosent > i.none { background:rgba(255,255,255,.22); }
/* Not a control, so a press on it falls through to the picture, which carries on writing: the
   whole hero is one door. */
.resumeband > .glass { pointer-events:none; position:relative; display:flex; flex-direction:column; gap:6px; margin-top:14px;
  padding:14px 16px; border-radius:16px; background:rgba(4,6,12,.4); border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
.resumeband .quote { font-style:italic; font-size:16px; line-height:1.5; color:rgba(255,255,255,.94);
  text-wrap:pretty; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.resumeband .quote.empty { color:rgba(255,255,255,.75); }
.resumeband .herometa { display:flex; justify-content:space-between; gap:12px; font-size:12px;
  color:rgba(255,255,255,.75); }
/* Something is owed in this tale: a gold dot in the hero's corner, the words in its label. */
.resumeband > .owedot { position:absolute; top:14px; right:14px; width:12px; height:12px; border-radius:50%;
  background:var(--gold-lit); border:2px solid #0e0c10; pointer-events:none; }
/* 3:4, the shape of a page. Set as an aspect-ratio rather than a height so the card holds its
   proportions at every column width the grid resolves to. */
.storycard .art { aspect-ratio:3/4; height:auto; position:relative; }
.storycard .art .fade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,10,12,0) 35%,rgba(10,10,12,.92)); }
.dashed { border-radius:var(--r); border:1px dashed var(--chip); min-height:200px; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--faint); }

/* #read and #dock set display:flex, which beats the UA's [hidden]{display:none}. Without this
   the document region stays on screen behind the workspace pages. */
#read[hidden], #dock[hidden], #page[hidden] { display:none !important; }

/* THE TALE PANEL'S FOUR GROUPS. Only one is on screen and the container's attribute says which —
   see the note in `story()` for why this is CSS and not a redraw: every field in there is free text
   that Save commits, and a repaint on a tab press loses whatever was half-typed. */
.sgroup { display:none; flex-direction:column; }
[data-tab="book"]  > .sgroup[data-group="book"],
[data-tab="world"] > .sgroup[data-group="world"],
[data-tab="keep"]  > .sgroup[data-group="keep"],
[data-tab="thread"] > .sgroup[data-group="thread"],
/* AND THE CHAPTER PANEL'S FOUR, on the same mechanism. Seth, 2026-09-03: "everything here should
   also use the tab system to split information." The two panels are never on screen together —
   there is one side panel — so they share `data-tab` and `.sgroup` rather than growing a second
   copy of this idea. Four more names here is the price of that, and it is the right price: a
   generic rule cannot match one attribute against another in CSS. */
[data-tab="this"]      > .sgroup[data-group="this"],
[data-tab="proposed"]  > .sgroup[data-group="proposed"],
[data-tab="summaries"] > .sgroup[data-group="summaries"],
[data-tab="branches"]  > .sgroup[data-group="branches"] { display:flex; }

/* NOT ON THE BOTTOM EDGE — Seth, 2026-09-02. It sat 26px off the bottom, directly over the
   composer, which is both the place a writer's eyes are NOT and the one control it was usually
   telling them to use. It was centred on the screen from then until 2026-10-26 (below).
   THE ACCENT IS THE EDGE, the same gold-dim-to-gold vocabulary the composer's field and the two
   dials use, on the app's own sheet rather than the field grey. Small caps would be wrong: this is
   a sentence to read, not a label. */
/* AT THE TOP, WITH A SHADOW BENEATH IT. Seth, 2026-10-26: "let toasts happen at the top of the
   screen with a shadow beneath not center screen." Centred, it sat over the prose being read. */
#toast {
  position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); z-index:60;
  /* Nothing in a toast is clickable, and it used to sit directly over the composer. Without this it
     swallowed every click on the input for 4.2 seconds — so the error telling you to type
     something was the thing stopping you from typing it. It is over the header now, whose buttons
     it must not block either. */
  pointer-events:none;
  background:var(--sheet); border:1px solid var(--gold-dim); color:var(--ink-bright);
  padding:14px 22px; border-radius:var(--r); font-size:13.5px; line-height:1.45; text-align:center;
  box-shadow:0 14px 28px -6px rgba(0,0,0,.7); max-width:min(86vw, 460px);
}
/* The @ menu. Floats ABOVE the ask box rather than sitting in the column, so opening it moves
   nothing — the whole point of a menu that appears while you are mid-sentence. Opaque, because it
   sits over the conversation you are reading. */
#atlist {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:6px; z-index:3;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlist[hidden] { display:none; }

/* The mirror behind the ask box. Every property that affects WRAPPING is set on both at once —
   two declarations for one shape is how they drift apart and the highlight ends up a line above
   what it is highlighting. */
#askWrap { position:relative; display:flex; }
#askWrap > #askMirror, #askWrap > #askBox {
  font:inherit; font-size:13.5px; line-height:1.55; letter-spacing:normal;
  padding:11px 13px; border:1px solid transparent; border-radius:var(--r);
  white-space:pre-wrap; overflow-wrap:break-word; word-break:normal;
}
#askWrap > #askBox { position:relative; z-index:1; background:transparent; flex:1; min-width:0; }
#askMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
}
/* Only what is going to be SENT is marked. Nothing else in this app tints text, so the tint is
   unambiguous: it means she is getting the thing and not only the word. */
/* THE WORD IS THE ACCENT, not a block of colour behind it. Seth: "let's not make it gold, let's
   just make the word the accent color of the theme that is currently selected."
   `--gold` was already the theme's accent — `themeVars` writes it from `S.accent` — so on
   Cyberpunk it was already teal and on Novelist already red. What it was NOT was the word: it was
   a tint behind transparent text, which reads as a highlighter pen rather than as a mark.
   So the mirror stops being invisible: it renders ALL the text, and the textarea's own text goes
   transparent with only its caret left. That is the one way to colour part of a textarea, and it
   is why the two must agree about every property that affects wrapping — the mirror is what you
   are reading now, not a layer behind what you are reading. */
#askBox, #input { color:transparent; caret-color:var(--gold); }
#askMirror, #inputMirror { color:var(--body); }
/* COLOUR ONLY. `font-weight:600` was here and it is what put the caret adrift: the mirror draws
   the text and the TEXTAREA carries the caret, so a mention rendered bolder than the invisible
   text under it is wider than the letters the caret is counting, and every character after it
   sits further from the cursor. Any property that changes a glyph's WIDTH breaks this pair.
   Seth: "the cursor is spaced out far away from the thing being written." */
#askMirror mark, #inputMirror mark {
  background:transparent; color:var(--gold); border-radius:0;
}
/* Selected text has to come back, or dragging over your own sentence selects a row of nothing.
   ::selection can restore a colour for the selected range even when the text under it is
   transparent, which is the one thing that makes the trick above survive being edited. */
#askBox::selection, #input::selection { color:var(--ink-bright); background:var(--edge-lit); }

/* The composer's mirror. Same trick as the ask box's and the same rule: every property that
   affects WRAPPING is set on both at once. #input is the one that already had its sizing, so the
   mirror inherits from it rather than restating it — a second copy of `padding:10px 0` is how the
   highlight ends up a line above the word it is highlighting. */
/* The colour lives HERE now, in the box itself, with the room to carry it. Horizontal padding
   arrives with the background — text against the edge of a filled box reads as a mistake — and
   the mirror takes the same, because the two must agree about every property that moves a glyph. */
/* THE ACCENT WRAPS THE FIELD. Seth, 2026-09-02: "the accented border here is inside the background
   of the text it should wrap around it so it doesnt look like the background is escaping." It was a
   1px gold line across the whole composer row, under a field whose own background stopped 14px
   short of it — so the line read as something the field's ground had leaked past rather than as its
   edge. On the field it follows the same rounded rectangle the background does.
   `box-sizing:border-box` is global here, so the border costs the field no height: the textarea is
   sized in JS and a box that grew by 2px would move the dock, which this project has three separate
   bug reports about. */
#inputWrap { position:relative; flex:1; min-width:0; display:flex; --field-pad:13px;
  background:var(--field); border:1px solid var(--chip); border-radius:var(--r);
  padding:0 var(--field-pad); transition:border-color var(--t) var(--ease); }
/* DIM UNTIL YOU ARE IN IT, and the full accent when you are — Seth, 2026-09-02: "the original one
   dimmed if not selected". The edge is the focus indicator, so it has to be the thing that changes.
   AND THE INNER RING GOES. The global `:focus-visible` rule puts a 2px outline on whatever has
   focus; on a textarea inside a padded wrapper that drew a second, smaller accent inside the first
   — "theres another accent that is smaller than the box. that needs to go." Dropped only for this
   one field, and only because the box it sits in lights up instead: a control with no focus
   indicator at all is the thing that rule exists to prevent.
   THE DIM EDGE IS INK NOW, not dim gold (usability walkthrough, 2026-10-30): under ADR 0004 a gold
   ring at rest was a second "press here" beside Send. Gold still comes on with focus. */
#inputWrap:focus-within { border-color:var(--gold); }
#inputWrap > #input:focus-visible { outline:none; }
/* The full-screen composer has no field to outline — it IS the screen. */
#dock.big #inputWrap { border-color:transparent; }
#dock.big #inputWrap { background:transparent; --field-pad:0px; }
#inputWrap > #input { position:relative; z-index:1; background:transparent; }
/* ONE DECLARATION FOR BOTH BOXES — the shape #askWrap already uses, and the shape the comment
   above claimed for this pair without ever having. They had a rule each and the mirror's lost:
   `#inputMirror { font-size:17px }` was declared HERE and `font:inherit; font-size:inherit` in the
   block below it, which wins on order at equal specificity. So the mirror drew at the inherited
   body size in every mode while the textarea drew at 17px. The caret counts the TEXTAREA's letters
   and you read the MIRROR's, so every character pushed the two further apart — Seth, 2026-08-28:
   "as you type it creates more and more space." One line of prose measured 333.3px in the textarea
   against 274.5px in the mirror before this rule; the same trap as `color:transparent` two blocks
   down, in the same block, found the same way. Every property that changes a glyph's WIDTH goes
   here and nowhere else. */
#inputWrap > #input, #inputWrap > #inputMirror {
  font:inherit; font-size:17px; line-height:1.55; letter-spacing:normal;
}
@media (max-width:719px) { #inputWrap > #input, #inputWrap > #inputMirror { font-size:15.5px; } }
/* The horizontal inset is the one thing they CANNOT share. The mirror is positioned against the
   wrap's PADDING box, so it begins outside the padding the textarea begins inside of and has to
   re-add it by hand. Taken from the wrap's own variable, so the maximized composer — which drops
   that padding to nothing — moves both boxes with one number instead of leaving the mirror inset
   13px from a caret that is not. */
#inputMirror { padding:9px var(--field-pad); }
@media (max-width:719px) { #inputMirror { padding:16px var(--field-pad); } }
#inputMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
  font:inherit; font-size:inherit; line-height:1.55; letter-spacing:normal;
  white-space:pre-wrap; overflow-wrap:break-word;
}

/* The composer's own @ list, above the row rather than below it — the dock is at the bottom of
   the screen and a menu under it would be off the edge. */
#atlistInput {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:8px; z-index:6;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlistInput[hidden] { display:none; }
#inputRow { position:relative; }

#toast[hidden] { display:none; }
/* #74 · THE WORKBENCH DECK. One card shows; the others are in the page and hidden. The card leans
   the way a swipe will send it, and the bar holds its no on the left and its yes on the right. */
.deck { display:flex; flex-direction:column; gap:8px; }
.deckhead { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mute); }
.deckhead button { min-width:32px; min-height:32px; color:var(--mute); }
.deckhead button:disabled { opacity:.35; }
/* Back and forth beneath the cards (2026-10-27). */
.decknav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px;
  font-size:12px; color:var(--mute); }
.decknav button { min-height:44px; padding:0 14px; border:1px solid var(--chip); border-radius:var(--r-pill);
  color:var(--ink); }
.decknav button:disabled { opacity:.35; }
.deckcard, .deckcard summary, .deckcard button { touch-action:pan-y; }
.deckcard { gap:9px; transition:transform .18s var(--ease); user-select:none; position:relative; }
/* What the swipe will do, said on the card as it leans that way. */
.deckcard[data-lean]::after { position:absolute; top:12px; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; padding:4px 9px; border-radius:var(--r-pill); pointer-events:none; }
.deckcard[data-lean="right"]::after { content:'Yes'; right:12px; color:var(--on-gold); background:var(--gold); }
.deckcard[data-lean="left"]::after { content:'No'; left:12px; color:var(--warn); border:1px solid var(--warn); }
.deckcard[hidden] { display:none; }
.deckcard[data-lean="right"] { border-color:var(--gold); }
.deckcard[data-lean="left"] { border-color:var(--warn); }
.decksub { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--label, var(--faint)); }
.decktitle { font-size:20px; color:var(--ink-bright); }
.deckline { margin:0; padding:6px 0 6px 12px; border-left:2px solid var(--chip); font-style:italic;
  font-size:13px; line-height:1.5; color:var(--narr); }
.decksec { border-top:1px solid var(--line); padding-top:8px; }
.decksec > summary { display:flex; flex-direction:column; justify-content:center; gap:3px; cursor:pointer;
  list-style:none; min-height:44px; }
.decksec > summary::-webkit-details-marker { display:none; }
.deckpeek { font-size:12px; color:var(--faint); }
.decksec[open] .deckpeek { display:none; }
.decksec .card { margin-top:8px; }
/* WHO IS IN IT, ONE LINE A THREAD (2026-10-29): the name and kind, the eye (the Threads list's
   mark, 2026-11-01), ✕. The eye is a state, so it wears ink, not gold (ADR 0004). */
.wholist { padding:0; gap:0; }
.whorow { display:flex; align-items:center; gap:10px; min-height:60px; padding:8px 6px 8px 14px; }
.whorow + .whorow { border-top:1px solid var(--line); }
.whoname { flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  text-align:left; min-height:44px; justify-content:center; background:transparent; border:0; padding:0; color:inherit; }
.whokind { font-size:11.5px; color:var(--faint); }
.whoeye { flex:0 0 auto; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-pill); color:var(--faint); }
.whoeye[data-lit="1"] { color:var(--ink-bright); }
/* .whoeye off: with .theye above. */
/* #134 · A POCKET'S EYE, the thread's marks on a pocket row: the same 44px target as Anyone new's,
   holding its own tip. Off steps back as a thread's does. */
.pkeye { flex:0 0 auto; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  position:relative; border-radius:var(--r-pill); color:var(--faint); cursor:pointer; }
.pkeye[data-reach="on"], .pkeye[data-reach="woken"] { color:var(--ink-bright); }
.pkeye[data-reach="off"] > svg { opacity:.5; }
/* #122 · THE ONE DIFF (diffHTML in web/model.js), a Was / Now switch since 2026-10-29: the text as
   it reads now or as it read, one at a time. The switch wears the
   chips' pressed look (ink, not gold: gold means press here, ADR 0004). The changed words are not
   marked (Seth, 2026-11-01): the switch is how the change is seen, and each view reads as plain text.
   pre-wrap keeps the writer's line breaks; anywhere lets a long word wrap on a 390px phone. */
.diff { position:relative; font-size:13px; line-height:1.6; color:var(--narr); white-space:pre-wrap; overflow-wrap:anywhere; }
.diff p { margin:0; }
.diff[data-view="now"] .dwas, .diff[data-view="was"] .dnow { display:none; }
.diff .dwas { color:var(--mute); }
.diffswitch { float:right; display:flex; gap:2px; margin:0 0 6px 10px; padding:2px; white-space:normal;
  border:1px solid var(--chip); border-radius:999px; }
.diffswitch button { min-width:44px; min-height:30px; padding:0 10px; border:1px solid transparent; border-radius:999px;
  font-size:11.5px; color:var(--mute); background:transparent; }
.diffswitch button[aria-pressed="true"] { border-color:var(--ink-bright); color:var(--ink-bright); }
.diff ins, .diff del { color:inherit; text-decoration:none; }
/* THE HEM'S SUMMARY TO READ (2026-11-01): the whole text at reading size, and a big box to edit it. */
.hemsumread { font-size:15px; line-height:1.65; color:var(--narr); white-space:pre-wrap; overflow-wrap:anywhere; margin:6px 0 10px; }
.hemsumbox { min-height:40vh; font-size:15px; line-height:1.6; }
.diff .dnone { color:var(--faint); font-style:italic; }
.deckredo { display:flex; gap:7px; align-items:center; margin-top:8px; }
/* THE HEM AS ITS STEPS, COLOUR CODED (Seth, 2026-10-30): grey waiting, the accent pulsing while
   Anansi works on it, green done, red when it did not run, gold for the step waiting on the writer
   ("gold for next": the one press the screen is asking for). The mark carries the colour and the
   name follows it, so the state reads without the colour too (○ ● ✓ ✕ →). */
.hemsteps { list-style:none; margin:14px 0 18px; padding:0; display:flex; flex-direction:column; gap:10px; }
.hemsteps li { display:flex; gap:10px; align-items:flex-start; }
.hemmark { flex:0 0 18px; height:18px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--chip); border-radius:50%; font-size:11px; line-height:1; color:var(--ink); }
.hembody { display:flex; flex-direction:column; gap:2px; min-width:0; }
.hemname { font-size:13.5px; color:var(--ink-bright); }
.hemsteps li[data-state="wait"] .hemmark { color:var(--faint); border-color:var(--chip); }
.hemsteps li[data-state="wait"] .hemname { color:var(--mute); }
.hemsteps li[data-state="run"] .hemmark { color:var(--accent-soft); border-color:var(--accent-soft); animation:hempulse 1.6s var(--ease) infinite; }
.hemsteps li[data-state="run"] .hemline { color:var(--accent-soft); }
.hemsteps li[data-state="done"] .hemmark { color:var(--good); border-color:var(--good); }
.hemsteps li[data-state="fail"] .hemmark { color:var(--bad); border-color:var(--bad); }
.hemsteps li[data-state="fail"] .hemline { color:var(--bad); }
.hemsteps li[data-state="you"] .hemmark { color:var(--gold); border-color:var(--gold); }
.hemsteps li[data-state="you"] .hemname { color:var(--gold); }
@keyframes hempulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion:reduce) { .hemsteps li[data-state="run"] .hemmark { animation:none; } }
/* Below the steps, only what needs the writer (ritualPanel); the rarer presses folded under More. */
.hemact { display:flex; flex-direction:column; gap:12px; }
/* A CHALKED CHANGE ON A THREAD'S CARD IS EDITED WHERE IT IS (2026-10-30): its text is the press. */
.hemedit { cursor:text; border-radius:var(--r); margin:0 -6px; padding:2px 6px; }
/* One row or pocket out of a hem's thread card (2026-10-30): a quiet ✕, 44px to hit. */
.hemdrop { flex:0 0 auto; width:44px; height:44px; margin:-12px -10px -12px 0; color:var(--mute);
  font-size:13px; display:flex; align-items:center; justify-content:center; }

/* Anansi edits, 44px to the finger: it was 18px tall (UX review, 2026-10-29). */

/* ONE HEIGHT AT PHONE SIZE (usability walkthrough, 2026-10-30): the sheet grew and shrank with each
   card, so Back and Next jumped under the thumb. A floor rather than a fixed height, so a long card
   still shows all of itself; the yes and no sit at the foot of a short one.
   ponytail: a floor sized for the cards seen so far. A card taller than it still moves the sheet;
   give the card its own scroll if writers meet that often. */
@media (max-width:719px) { .deckcard { min-height:min(60svh, 520px); } .deckbar { margin-top:auto; } }
