<!DOCTYPE html>
<!-- The look lives in data-ui-* so it cannot collide with the data-* names the click
     delegation treats as actions. data-theme on <html> plus [data-theme] in the
     delegation meant every click in the app matched <html> and toggled the rail. -->
<html lang="en" data-ui-theme="obsidian" data-ui-font="serif" data-ui-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>Anansi</title>
<link rel="icon" href="./web/icon.svg">
<link rel="manifest" href="./web/app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Tokens. The three themes come from the design's own theme() function; the
   only change is that they live in custom properties instead of style strings,
   so a repaint does not rewrite every element's inline style.
   --------------------------------------------------------------------------- */
/* Every colour the app uses lives here. A THEME is one block below overriding any of these — that
   is the whole contract, and it only holds if nothing hardcodes a hex. web/app.js used to carry
   162 of them in inline styles, so the panel and the rail could not be themed at all while the
   document could. */
:root {
  /* ink, on the panel and the rail — brightest to faintest */
  --ink-bright:#F3ECE0; --ink:#EAE3D6; --mute:#8A8478; --faint:#78726A; --dim:#6E6961;
  --ink-ghost:#635E56;
  --gold:#D9B26A; --gold-lit:#E0C48C; --gold-dim:#BCA97F; --on-gold:#100D08;
  --rail:#0C0C0E; --sheet:#0E0D10; --line:#1A1917; --edge:#23211D; --chip:#2A2721;
  --edge-lit:#3A372F; --field:#141317;
  --good:#7FB083; --warn:#C99356; --bad:#C8705A;

  /* motion. One scale, so nothing in the app invents its own timing. */
  --ease:cubic-bezier(.4,0,.2,1);          /* the house curve: settle, do not bounce */
  --ease-out:cubic-bezier(.16,1,.3,1);     /* arrivals — fast in, long tail */
  --ease-in:cubic-bezier(.7,0,.84,0);      /* departures */
  --t-fast:.12s;                            /* a state you should not notice changing */
  --t:.2s;                                  /* the default: hovers, chips, toggles */
  --t-slow:.32s;                            /* something moving across the screen */
  --t-page:.42s;                            /* a whole surface arriving */

  --prose:20px; --bubble:17px; --gap:30px; --col:720px;
}
html[data-ui-theme="obsidian"] {
  --doc-bg:#0A0A0C;
  --doc-wash:radial-gradient(50% 40% at 25% 0%, rgba(150,105,195,.22), transparent 70%), linear-gradient(180deg,#131019,#09090B 45%);
  --narr:#C9C1B2; --body:#EAE3D6; --label:#8E846F; --rule:rgba(255,255,255,.07); --you-rule:rgba(217,178,106,.45); --speak-rule:rgba(180,150,220,.5);
  --dock:linear-gradient(180deg,rgba(9,9,11,0),rgba(9,9,11,.9) 40%);
  --chrome:rgba(10,9,12,.5); --chrome-ink:#F3ECE0; --chrome-dim:#8A8478; --chrome-line:rgba(255,255,255,.05);
}
html[data-ui-theme="ink"] {
  --doc-bg:#0B0B0C;
  --doc-wash:linear-gradient(180deg,#0E0E10,#08080A 60%);
  --narr:#C6C2BA; --body:#E4E0D8; --label:#7E7A72; --rule:rgba(255,255,255,.07); --you-rule:rgba(217,178,106,.4); --speak-rule:rgba(190,185,175,.34);
  --dock:linear-gradient(180deg,rgba(11,11,12,0),rgba(11,11,12,.92) 40%);
  --chrome:rgba(10,10,12,.5); --chrome-ink:#F3ECE0; --chrome-dim:#8A8478; --chrome-line:rgba(255,255,255,.05);
}
/* Parchment is the one light theme, so it restates the chrome and the greys too —
   a token defined only in the dark blocks would render dark text on light ground. */
html[data-ui-theme="parchment"] {
  --doc-bg:#EFE7D8;
  --doc-wash:radial-gradient(60% 40% at 25% 0%, rgba(150,105,195,.07), transparent 70%), linear-gradient(180deg,#F3EDE1,#EAE1D0 60%);
  --narr:#3A342B; --body:#2E2A24; --label:#5F5340; --rule:rgba(58,52,43,.14); --you-rule:rgba(120,90,40,.45); --speak-rule:rgba(110,80,140,.5);
  --dock:linear-gradient(180deg,rgba(239,231,216,0),rgba(239,231,216,.94) 40%);
  --chrome:rgba(239,231,216,.72); --chrome-ink:#3A342B; --chrome-dim:#7A6E5C; --chrome-line:rgba(58,52,43,.12);
  /* Gold has to darken on paper or it is cream on cream. Overriding the tokens fixes every place
     that uses them; the single-rule override this replaced fixed one button. */
  --gold:#7D5F1E; --gold-lit:#5E4819; --gold-dim:#6F5C30; --on-gold:#FBF6EA;
}
html[data-ui-size="s"] { --prose:18px; --bubble:16px; --gap:26px; --col:660px; }
html[data-ui-size="m"] { --prose:20px; --bubble:17px; --gap:30px; --col:720px; }
html[data-ui-size="l"] { --prose:23px; --bubble:19px; --gap:34px; --col:780px; }
@media (max-width:719px) {
  html[data-ui-size="s"] { --prose:16px; --bubble:14.5px; --gap:18px; }
  html[data-ui-size="m"] { --prose:17.5px; --bubble:15.5px; --gap:22px; }
  html[data-ui-size="l"] { --prose:19.5px; --bubble:17px; --gap:26px; }
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; background:var(--doc-bg); color:var(--body);
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
input, textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
/* ── motion ──────────────────────────────────────────────────────────────────────────────────
   One system, four durations, three curves, all declared in :root. The rule the app follows:
   motion explains where something came from. A panel slides from the edge it lives on; a passage
   rises because it was written below; a chip does not move at all because it did not go anywhere.
   Nothing here loops except the working bar, which is reporting that a call is still running.

   Everything is opacity and transform only — both composited, so a 358-passage document does not
   drop frames when the side panel opens. No animating height, width, top or left. */

/* The whole app respects the system setting. This is the ONLY blanket reset; individual rules
   below add static fallbacks where removing the animation would remove the information too. */
@media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; }
  html { scroll-behavior:auto !important; } }

@keyframes rise   { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
@keyframes settle { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
@keyframes fade   { from { opacity:0; } to { opacity:1; } }
@keyframes lift   { from { opacity:0; transform:translateY(10px) scale(.985); } to { opacity:1; transform:none; } }

/* A new passage RISES: it was written at the bottom and it arrives from there. Only the newest
   one animates — replaying the whole document on every repaint would be a slot machine, and at
   358 passages it would be a slow one. The renderer marks it; `:last-of-type` cannot, because it
   means "last <div>" and the chapter pager is a div that comes after every block. */
#col .block.newest { animation:rise var(--t-slow) var(--ease-out) both; }
/* The passage as it arrives. Dimmed and carried by a caret, because it is not in the book yet:
   nothing is saved until the stream ends and accept returns. It replaces a p50 of 5.7 seconds
   of blank page, which read as a hung app (COUNCIL-04 #3). */
#col .block.ghost .narr { opacity:.74; }
#col .block.ghost .narr::after { content:'▍'; color:var(--gold); margin-left:1px;
  animation:caret 1.1s steps(2, jump-none) infinite; }
@keyframes caret { 50% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { #col .block.ghost .narr::after { animation:none; } }

/* A panel's contents SETTLE in after the panel itself has arrived, so the two reads as one move
   rather than a race. The delay is the panel's own transition, near enough. */
#sideBody > * { animation:settle var(--t) var(--ease-out) both; }
#page > * { animation:lift var(--t-page) var(--ease-out) both; }

/* Rows and cards stagger, barely. Six steps is enough to read as a sequence; past that it is a
   wait. Anything below the sixth arrives with the sixth. */
#sideBody .card, #sideBody .row, #page .storycard {
  animation:rise var(--t-slow) var(--ease-out) both; }
#sideBody .card:nth-child(1),  #page .storycard:nth-child(1)  { animation-delay:0ms; }
#sideBody .card:nth-child(2),  #page .storycard:nth-child(2)  { animation-delay:22ms; }
#sideBody .card:nth-child(3),  #page .storycard:nth-child(3)  { animation-delay:44ms; }
#sideBody .card:nth-child(4),  #page .storycard:nth-child(4)  { animation-delay:66ms; }
#sideBody .card:nth-child(5),  #page .storycard:nth-child(5)  { animation-delay:88ms; }
#sideBody .card:nth-child(n+6),#page .storycard:nth-child(n+6){ animation-delay:110ms; }

/* Things you press answer immediately. --t-fast is the point where a change stops feeling like a
   change and starts feeling like the button was already that way. */
button, .tag, .chip, .card, .row, select, input, textarea, a.btn {
  transition:background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease); }
button:not(:disabled):active { transform:translateY(.5px); }
.storycard { transition:transform var(--t) var(--ease-out), border-color var(--t) var(--ease); }
.storycard:hover { transform:translateY(-2px); }
.card:hover { border-color:var(--edge-lit); }

/* Focus is not decoration: it is the only thing telling a keyboard where it is. It never fades in,
   because a ring that arrives late is a ring you have already moved past. */
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; transition:none; }

/* The toast comes up from the composer it is talking about, and leaves the way it came. */
#toast { animation:rise var(--t) var(--ease-out) both; }

/* Chips that toggle — modes, outfits, kinds — do NOT move. They did not go anywhere; only their
   state changed, and moving them would say otherwise. */
#modes button, [data-wear], [data-lorekind], [data-kind] { transition:color var(--t-fast) var(--ease),
  border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }

/* Surfaces that replace their whole contents. Each one is a different KIND of change, so each
   one says something different about what happened:

     #bar        the title of what you are looking at — it cross-fades, because you did not move,
                 the thing you are looking at changed
     #sideHead   the same, for the panel
     #hits       results arriving, so they rise like anything else in a list
     #books      the same on the Worlds page

   `#page > *` and `#sideBody > *` above already cover page and panel contents. None of these has
   an EXIT: an exit needs the old DOM held while the new one is built, and every version of that
   either double-renders or drops frames on a long document. An entrance that says where the
   content came from does the work without the cost. */
#bar > div, #sideHead > * { animation:fade var(--t) var(--ease-out) both; }
#hits > *, #books > * { animation:rise var(--t) var(--ease-out) both; }
#hits > *:nth-child(1) { animation-delay:0ms; }
#hits > *:nth-child(2) { animation-delay:20ms; }
#hits > *:nth-child(3) { animation-delay:40ms; }
#hits > *:nth-child(n+4) { animation-delay:60ms; }

/* The composer bar rebuilds whenever you change mode, and the textarea under it must not move
   while you are typing into it. Only the row of modes reacts. */
#modes { animation:fade var(--t-fast) var(--ease-out) both; }

/* The document scrolls to a search hit rather than jumping, so you can see where it took you. */
@media (prefers-reduced-motion:no-preference) { #read { scroll-behavior:smooth; } }
.tnum { font-variant-numeric:tabular-nums; }
.serif { font-family:'Instrument Serif',Georgia,serif; }
.up { letter-spacing:.2em; text-transform:uppercase; }
.scroll { overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--chip) transparent; }
.scroll::-webkit-scrollbar { width:8px; height:8px; }
.scroll::-webkit-scrollbar-thumb { background:var(--chip); border-radius:4px; }

/* --- shell ------------------------------------------------------------- */
#shell { position:fixed; inset:0; display:flex; overflow:hidden; }

#rail {
  background:var(--rail); display:flex; flex-direction:column; overflow:hidden;
  flex:0 0 auto; width:248px; border-right:1px solid var(--line);
  transition:width var(--t-slow) var(--ease); position:relative; z-index:30;
}
html[data-ui-rail="closed"] #rail { width:76px; }
#rail .txt { opacity:1; transition:opacity var(--t-fast) var(--ease); white-space:nowrap; overflow:hidden; }
html[data-ui-rail="closed"] #rail .txt { opacity:0; }

#scrim {
  position:absolute; inset:0; z-index:20; background:rgba(5,5,7,.6); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity var(--t-slow) var(--ease);
}

#doc { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--doc-bg); }
#wash { position:absolute; inset:0; pointer-events:none; background:var(--doc-wash); }

#side {
  flex:0 0 auto; width:400px; background:var(--rail); overflow:hidden;
  border-left:1px solid var(--line); transition:width var(--t-slow) var(--ease); z-index:30;
}
#side[hidden] { display:block; width:0; border-left-color:transparent; }
#sideInner { width:400px; height:100%; display:flex; flex-direction:column; overflow:hidden; }

/* Tablet: rail and panel both float over the document. */
@media (max-width:1099px) {
  #rail {
    position:absolute; top:0; bottom:0; left:0; width:264px;
    transform:translateX(0); transition:transform var(--t-slow) var(--ease);
    box-shadow:40px 0 90px rgba(0,0,0,.6);
  }
  html[data-ui-rail="closed"] #rail { width:264px; transform:translateX(-100%); box-shadow:none; }
  html[data-ui-rail="closed"] #rail .txt { opacity:1; }
  html[data-ui-rail="open"] #scrim { opacity:1; pointer-events:auto; }
  #side {
    position:absolute; top:0; bottom:0; right:0; width:400px;
    transform:translateX(0); transition:transform var(--t-slow) var(--ease);
    box-shadow:-40px 0 90px rgba(0,0,0,.6);
  }
  #side[hidden] { width:400px; transform:translateX(100%); box-shadow:none; border-left-color:var(--line); }
}
/* Phone: the panel becomes a bottom sheet. */
@media (max-width:719px) {
  #side {
    position:absolute; inset:0; width:auto; border-left:0; box-shadow:none;
    display:flex; flex-direction:column; justify-content:flex-end;
    background:rgba(6,6,8,.72); backdrop-filter:blur(8px);
    transform:none; transition:background var(--t) var(--ease);
  }
  #side[hidden] { display:flex; width:auto; transform:none; background:rgba(6,6,8,0);
    backdrop-filter:none; pointer-events:none; }
  #sideInner {
    width:auto; height:auto; max-height:88%; background:var(--sheet); border:1px solid var(--chip);
    border-bottom:0; border-radius:26px 26px 0 0;
    transform:translateY(0); opacity:1; transition:transform var(--t) var(--ease), opacity var(--t) var(--ease);
  }
  #side[hidden] #sideInner { transform:translateY(30px); opacity:0; }
}

/* --- header ------------------------------------------------------------ */
#bar {
  position:relative; display:flex; align-items:center; gap:18px; padding:18px 40px; flex:0 0 auto;
  border-bottom:1px solid var(--chrome-line); background:var(--chrome); backdrop-filter:blur(18px);
}
#burger { display:none; font-size:19px; color:var(--chrome-dim); flex:0 0 auto; }
@media (max-width:1099px) { #burger { display:block; } }
@media (max-width:719px) { #bar { padding:16px 20px 14px; gap:14px; } }

.pill { border:1px solid var(--chrome-line); padding:8px 14px; border-radius:10px; font-size:12px; color:var(--chrome-dim); white-space:nowrap; }
.pill[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
.deskonly { display:block; }
@media (max-width:719px) { .deskonly { display:none; } }
.phoneonly { display:none; }
@media (max-width:719px) { .phoneonly { display:block; } }

/* --- appearance popover ------------------------------------------------ */
#appearance {
  position:absolute; top:70px; right:32px; z-index:25; width:274px; border-radius:16px;
  border:1px solid var(--chip); background:rgba(16,15,18,.97); backdrop-filter:blur(20px);
  box-shadow:0 30px 70px rgba(0,0,0,.65); padding:16px 18px;
  display:flex; flex-direction:column; gap:14px; color:var(--ink);
}
#appearance[hidden] { display:none; }
@media (max-width:719px) { #appearance { top:62px; right:14px; } }
.chip { padding:9px 12px; border-radius:11px; border:1px solid var(--chip); color:var(--mute); font-size:13px; }
.chip[aria-pressed="true"] { border-color:rgba(217,178,106,.5); background:rgba(217,178,106,.08); color:var(--ink); }

/* --- reading column ---------------------------------------------------- */
#read { position:relative; flex:1; min-height:0; display:flex; justify-content:center; padding:40px 0 0; }
@media (max-width:719px) { #read { padding:22px 22px 0; } }
#col { width:100%; max-width:var(--col); height:max-content; display:flex; flex-direction:column; gap:var(--gap); padding-bottom:20px; }

.narr { font-size:var(--prose); line-height:1.7; color:var(--narr); text-wrap:pretty; white-space:pre-wrap; }
html[data-ui-font="serif"] .narr { font-family:'Instrument Serif',Georgia,serif; font-style:italic; }
html[data-ui-font="sans"] .narr { font-family:'IBM Plex Sans',system-ui,sans-serif; font-style:normal; }
.said { max-width:600px; font-size:var(--bubble); line-height:1.65; color:var(--body); text-wrap:pretty; white-space:pre-wrap; }
.who { font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--label); }
.block { position:relative; display:flex; flex-direction:column; gap:10px; }
.block.speak { padding-left:16px; border-left:1px solid var(--speak-rule); }
.block.you { padding-right:16px; border-right:1px solid var(--you-rule); align-items:flex-end; text-align:right; }
/* Where a search result put you. Fades on its own after a few seconds — a permanent mark on
   whatever you last looked for turns into furniture you stop seeing. */
.block.found { animation: found 6s ease-out forwards; border-radius:10px; }
@keyframes found {
  0%, 60% { background:rgba(217,178,106,.14); box-shadow:0 0 0 8px rgba(217,178,106,.14); }
  100%    { background:transparent; box-shadow:0 0 0 8px transparent; }
}
@media (prefers-reduced-motion: reduce) { .block.found { animation:none; background:rgba(217,178,106,.12); } }
/* The actions used to appear on :hover only, which put Edit, Regenerate and History out of
   reach of every touch device — and made them untestable. Each block now carries a handle that
   is always present, and hover stays as a shortcut on a pointer. */
.more {
  position:absolute; right:0; top:-20px; z-index:6; padding:2px 8px; border-radius:8px;
  font-size:14px; line-height:1.2; color:var(--label); opacity:.4; transition:opacity var(--t-fast) var(--ease);
}
.block:hover .more, .block:focus-within .more, .block[aria-expanded="true"] .more { opacity:1; }
.acts {
  position:absolute; right:0; top:-22px; gap:6px; padding:6px; border-radius:13px;
  border:1px solid var(--chip); background:rgba(19,18,21,.96); box-shadow:0 20px 50px rgba(0,0,0,.6);
  display:none; z-index:7;
}
@media (hover:hover) { .block:hover .acts { display:flex; } }
.block[aria-expanded="true"] .acts { display:flex; }
/* On a phone the tray sits in the flow underneath, as icons, rather than floating off the edge. */
@media (max-width:719px) {
  .more { top:-6px; opacity:.75; font-size:17px; padding:4px 10px; }
  .block[aria-expanded="true"] .acts {
    position:static; top:auto; right:auto; margin-top:8px; flex-wrap:wrap; box-shadow:none;
  }
  .acts button { padding:10px 12px; }
  .acts button span { font-size:15px; }
  .acts .lbl-txt { display:none; }
}
.acts button { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9px; font-size:12.5px; color:var(--narr); white-space:nowrap; }
.acts button:hover { background:rgba(255,255,255,.05); }
.flag { display:flex; align-items:flex-start; gap:9px; font-size:11.5px; color:var(--bad);
  text-align:left; width:100%; max-width:100%; }
.flag > span:last-child {
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  line-height:1.5; min-width:0;
}
.flag[aria-expanded="true"] > span:last-child { -webkit-line-clamp:unset; }
.scenebreak { display:flex; align-items:center; gap:14px; }
.scenebreak i { flex:1; height:1px; background:var(--rule); }

/* --- composer ---------------------------------------------------------- */
/* Column, not row. #working cannot live inside #dockCol — drawDock() sets its innerHTML and would
   wipe the bar mid-generation — so it is a sibling, and as a row sibling with width:100% it pushed
   the whole composer off the right edge for the length of every call. */
#dock { position:relative; flex:0 0 auto; display:flex; flex-direction:column; align-items:center;
  padding:0 0 28px; background:var(--dock); }
@media (max-width:719px) { #dock { padding:0 18px 24px; } }
#dockCol { width:100%; max-width:var(--col); display:flex; flex-direction:column; gap:14px; }
#modes { display:flex; align-items:center; gap:22px; overflow-x:auto; scrollbar-width:none; }
#modes::-webkit-scrollbar { display:none; }
#modes button { flex:0 0 auto; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--label); padding-bottom:5px; border-bottom:1px solid transparent; white-space:nowrap; }
#modes button[aria-pressed="true"] { color:var(--gold-lit); border-bottom-color:var(--gold); }
/* Continue is an action, not a mode — it sends on the press. Given the same underline as the four
   selectable modes it read as a fifth thing you pick, which is the one thing it is not. */
#modes button[data-continue] { border:1px solid var(--chip); border-radius:999px; padding:5px 13px;
  color:var(--gold-dim); letter-spacing:.2em; }
#modes button[data-continue]:hover:not(:disabled) { border-color:rgba(217,178,106,.42); color:var(--gold-lit); }
#modes button[data-continue]:disabled { opacity:.45; }

/* Something is happening. A generation is 20-40 seconds against a local model, and a composer
   that simply goes quiet reads as a hung page — which is what it was reported as. The bar under
   the document animates for the whole call, and its colour says WHICH action is running, because
   the five do different things and the wait is long enough to forget which you pressed. */
#working { height:2px; width:100%; max-width:var(--col); overflow:hidden; background:transparent; flex:0 0 auto; }
#working[hidden] { display:none; }
#working i { display:block; height:100%; width:38%; border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--work, var(--gold)), transparent);
  animation:working 1.15s ease-in-out infinite; }
@keyframes working { 0% { transform:translateX(-100%); } 100% { transform:translateX(320%); } }
#working[data-work="continue"] i { --work:#8FA9C4; }
#working[data-work="speak"]    i { --work:#D9B26A; }
#working[data-work="act"]      i { --work:#C39A76; }
#working[data-work="direct"]   i { --work:#A88FC4; }
#working[data-work="narrate"]  i { --work:#8FBFA5; }
#working[data-work="reroll"]   i { --work:#C8705A; }
@media (prefers-reduced-motion: reduce) {
  #working i { animation:none; width:100%; opacity:.5; }
}
#inputRow { display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--gold); padding:0 0 14px; }
html[data-ui-theme="parchment"] #inputRow { border-bottom-color:rgba(58,52,43,.28); }
#input {
  flex:1; min-width:0; font-size:17px; line-height:1.55; color:var(--body); background:none; border:0;
  resize:none; max-height:140px; padding:0; font-family:inherit;
}
#input::placeholder { color:var(--label); opacity:.75; }
@media (max-width:719px) { #input { font-size:15.5px; } #inputRow { padding-bottom:12px; } }
#send { width:34px; height:34px; border-radius:50%; background:var(--gold); color:var(--on-gold); display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto; }
#send:disabled { opacity:.4; }
@media (max-width:719px) { #send { width:30px; height:30px; } }

/* --- side panel -------------------------------------------------------- */
#sideHead { display:flex; align-items:center; gap:12px; padding:20px 22px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; color:var(--ink); }
#sideBody { padding:18px 22px 30px; flex:1; min-height:0; display:flex; flex-direction:column; color:var(--ink); }
@media (max-width:719px) { #sideHead { padding:18px 20px 12px; } #sideBody { padding:10px 20px 26px; } }
.lbl { font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); margin:14px 0 5px; }
.lbl:first-child { margin-top:0; }
.field { background:var(--field); border:1px solid var(--chip); border-radius:11px; padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); width:100%; font-family:inherit; }
textarea.field { resize:vertical; min-height:70px; }
.hint { font-size:11.5px; color:var(--mute); line-height:1.5; margin:6px 0 0; }
.card { border:1px solid var(--chip); border-radius:14px; padding:13px 15px; display:flex; flex-direction:column; gap:5px; }
/* Summaries are supposed to be ~180 words and arrive at four times that, so they are clamped
   for the same reason canon flags are: the panel is an index, not a reading surface. */
.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
[aria-expanded="true"] > .clamp { -webkit-line-clamp:unset; }
.tag { font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:1px solid var(--chip); color:var(--dim); white-space:nowrap; }
.kind { font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-dim); }
.row { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:12.5px; }
.btn { padding:12px; text-align:center; border-radius:999px; background:var(--gold); color:var(--on-gold); font-size:11px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; display:block; width:100%; }
.btn.ghost { background:none; border:1px solid var(--chip); color:var(--mute); font-weight:400; }
.meter { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--chip); margin:10px 0 6px; }

/* --- workspace pages --------------------------------------------------- */
#page { position:relative; flex:1; min-height:0; padding:30px 40px; }
@media (max-width:719px) { #page { padding:20px 18px; } }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-content:start; }
@media (max-width:1099px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:719px) { .grid { grid-template-columns:1fr; } }
.split { display:flex; gap:32px; align-items:flex-start; }
@media (max-width:719px) { .split { flex-direction:column; } }
.aside { width:400px; flex:0 0 auto; }
@media (max-width:1099px) { .aside { width:320px; } }
@media (max-width:719px) { .aside { width:100%; } }
.storycard { cursor:pointer; border-radius:18px; overflow:hidden; border:1px solid var(--edge); background:var(--rail); text-align:left; display:block; width:100%; }
.storycard .art { height:130px; position:relative; }
.storycard .art .fade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,10,12,0) 35%,rgba(10,10,12,.92)); }
.dashed { border-radius:18px; border:1px dashed var(--chip); min-height:200px; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--faint); }

/* #read and #dock set display:flex, which beats the UA's [hidden]{display:none}. Without this
   the document region stays on screen behind the workspace pages. */
#read[hidden], #dock[hidden], #page[hidden] { display:none !important; }

#toast {
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  /* Nothing in a toast is clickable, and it sits directly over the composer. Without this it
     swallows every click on the input for 4.2 seconds — so the error telling you to type
     something was the thing stopping you from typing it. */
  pointer-events:none;
  background:var(--field); border:1px solid var(--chip); color:var(--ink); padding:11px 18px;
  border-radius:999px; font-size:12.5px; box-shadow:0 20px 50px rgba(0,0,0,.6); max-width:90vw;
}
#toast[hidden] { display:none; }
</style>
</head>
<body>

<div id="shell">
  <nav id="rail" aria-label="Anansi"></nav>
  <div id="scrim"></div>

  <main id="doc">
    <div id="wash"></div>
    <header id="bar"></header>
    <div id="appearance" hidden></div>
    <div id="read" class="scroll"><div id="col"></div></div>
    <div id="page" class="scroll" hidden></div>
    <div id="dock"><div id="working" hidden><i></i></div>
<div id="dockCol"></div></div>
  </main>

  <aside id="side" hidden>
    <div id="sideInner">
      <div id="sideHead"></div>
      <div id="sideBody" class="scroll"></div>
    </div>
  </aside>
</div>

<div id="toast" hidden></div>

<script type="module" src="./web/app.js"></script>
</body>
</html>
