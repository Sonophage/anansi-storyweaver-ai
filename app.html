    font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  /* The row under the pointer and the row you are on, in the accent — the same tint the mode
     buttons used to carry when one of four was selected. */
  #modes select.dial option:hover, #asWhom option:hover,
  #modes select.dial option:focus, #asWhom option:focus {
    background:rgba(217,178,106,.12); color:var(--gold-lit); }
  #modes select.dial option:checked, #asWhom option:checked { color:var(--gold-lit); }
  #modes select.dial option::checkmark, #asWhom option::checkmark { color:var(--gold); }
}
/* The four modes were `#modes button[aria-pressed]` — an underline under the one you were in. One
   control cannot underline itself to say which of its own options is chosen, so the pill is the
   selected state and the label inside it is what it says. */
#asWhom { color:var(--gold); font-size:11.5px; letter-spacing:.06em; text-transform:none;
  background:none; border:0; max-width:min(46vw, 260px); text-overflow:ellipsis; }
/* IT WRAPS RATHER THAN SCROLLING SIDEWAYS. It was overflow-x:auto with scrollbar-width:none — so
   when the row did not fit it scrolled with nothing on screen saying so, and a control past the
   edge was a control you had no reason to believe existed. It fits at 360px in the shipped sizes,
   but the UI scale goes to 125% and that is enough to push it over.
   Wrapping puts every control on screen at once, which is what a row of six modes needs. */
#modes { display:flex; align-items:center; flex-wrap:wrap; column-gap:22px; row-gap:6px;
  overflow-x:auto; scrollbar-width:none; }
/* SEVEN THINGS ON ONE LINE AT 390px. Four modes and three doors — Threads, + Threads, Anansi —
   and at 22px the last of them wrapped onto a second row. A taller composer row MOVES THE DOCK,
   which this project has three separate bug reports about, so the gap closes rather than the row
   growing. 22px was chosen when the row held six things; six gaps at 12px buys back 60px, which is
   the whole overflow. test/ui/composer.js measures the row height against a button, so shipping a
   seventh control without finding it room goes red there rather than on Seth's phone. */
@media (max-width:719px) { #modes { column-gap:12px; } }
#modes::-webkit-scrollbar { display:none; }
/* `margin-left:auto` on + Thread pushes it right on ONE line; on a wrapped second line it would
   shove it alone to the far edge with a hole beside it. Below the wrap point they simply follow. */
@media (max-width:560px) { #modes button[data-newlore] { margin-left:0 !important; } }
#modes button { flex:0 0 auto; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--label); padding-bottom:5px; border-bottom:1px solid transparent; white-space:nowrap; }
#modes button[aria-pressed="true"] { color:var(--gold-lit); border-bottom-color:var(--gold); }
/* Continue is an action, not a mode — it sends on the press. Given the same underline as the four
   selectable modes it read as a fifth thing you pick, which is the one thing it is not. */
#modes button[data-continue] { border:1px solid var(--chip); border-radius:var(--r-pill); padding:5px 13px;
  color:var(--gold-dim); letter-spacing:.2em; }
#modes button[data-continue]:hover:not(:disabled) { border-color:rgba(217,178,106,.42); color:var(--gold-lit); }
#modes button[data-continue]:disabled { opacity:.45; }

/* Something is happening. A generation is 20-40 seconds against a local model, and a composer
   that simply goes quiet reads as a hung page — which is what it was reported as. The bar under
   the document animates for the whole call, and its colour says WHICH action is running, because
   the five do different things and the wait is long enough to forget which you pressed. */
/* THE FRAME, which replaced the 2px line above the composer — Seth, 2026-09-02: "remove the line
   above the input box when waiting for aa stream and put a gradient box around the screen that
   shifts in the ghost transition."
   A RING, NOT A PANEL: two masks composited so only the padding box paints, which is the one way to
   put a gradient on a border with no second element and no border-image. `pointer-events:none` and
   nothing focusable, so it cannot take a press meant for the page under it.
   IT SAYS WHICH PRESS IS RUNNING, in that press's own colour, and those colours are the `--m-*-ink`
   tokens the margin rules and the mode dial use. The strip it replaces had SIX HARD-CODED HEXES for
   the same job — a second definition of every mode's colour, which is the drift this file keeps
   recording. Continue takes the ink's own accent and a re-roll takes the gold, because neither is
   one of the four presses.
   IT OUTLIVES THE VEIL. The veil can be dismissed mid-write and the generation carries on, and
   until now the only thing that said so was the composer's Stop. `working()` is called at both ends
   of every call, so the frame is up for exactly as long as the model is writing. */
#frame { position:fixed; inset:0; z-index:60; pointer-events:none; padding:2px; opacity:0;
  transition:opacity var(--t-slow) var(--ease-out);
  background:linear-gradient(115deg, transparent 26%, var(--work, var(--gold)) 44%,
    var(--work, var(--gold)) 56%, transparent 74%) 0 0 / 320% 100% no-repeat;
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude; }
/* UP FOR THE WAIT AND NOT FOR THE WRITING. `data-streaming` lands on the first word, so the ring
   covers the one stretch with nothing to look at — the cold prefill, which F24 measured at 7.3s —
   and gets out of the way the moment the prose starts arriving. */
html[data-work]:not([data-streaming]) #frame { opacity:1; animation:framedrift 3.6s linear infinite; }
@keyframes framedrift { from { background-position:0 0; } to { background-position:320% 0; } }
html[data-work="speak"]    #frame { --work:var(--m-speak-ink); }
html[data-work="act"]      #frame { --work:var(--m-act-ink); }
html[data-work="direct"]   #frame { --work:var(--m-direct-ink); }
html[data-work="narrate"]  #frame { --work:var(--m-narrate-ink); }
html[data-work="continue"] #frame { --work:var(--m-continue); }
html[data-work="reroll"]   #frame { --work:var(--gold); }
/* Reduced motion keeps the statement and drops the travel: the ring is simply there, evenly. */
@media (prefers-reduced-motion: reduce) {
  html[data-work]:not([data-streaming]) #frame { animation:none;
    background:linear-gradient(115deg, var(--work, var(--gold)), var(--work, var(--gold))); }
}
/* NO RULE UNDER THE COMPOSER — Seth, 2026-09-02: "remove the bottom accented line". It was a gold
   1px underline the full width of the row, with a parchment override beside it for the one theme
   the gold was wrong on. The padding stays: it is the gap between the field and the edge of the
   dock, and it was never the line's. */
#inputRow { display:flex; align-items:flex-end; gap:16px; padding:0 0 14px; }
/* THE BOX IS THE HEIGHT OF THE BUTTONS BESIDE IT. It was one line tall — 26px against a 34px Send
   on a desk and 24px against 44px on a phone — so the row read as a stripe with two discs on the
   end of it, and the first character typed changed its height. The padding is what makes one line
   fill the button: line-height 1.55 on the font size, plus the padding, equals the button. `fit()`
   measures scrollHeight, which includes the padding, so it agrees without being told. */
#input {
  flex:1; min-width:0; color:var(--body); background:none; border:0;
  resize:none; max-height:140px; padding:9px 0; min-height:44px;
}
/* THE COMPOSER, FULL HEIGHT. A capped box is right for a line and wrong for a paragraph: past the
   cap you are writing into a six-line window and cannot see the top of your own sentence. This is
   the same dock, flexed to the screen — so the mode rail, who you are speaking as, and Anansi all
   come with it rather than being a second composer that drifts from the first.
   The draft is untouched by the toggle because drawDock has always carried it across a repaint;
   that is also why leaving the box, reading the last passage and coming back keeps the text. */
/* THE BACKGROUND LIVES WITH #ghost.veil now, above — see the note there. It was `--dock`, a
   gradient fading to 92% of the paper, and issue #8 killed that: "the background behind the input
   should be completely opaque. It is currently not opaque which makes it hard to read anything."
   The opaque sheet that answered it is gone in turn, replaced by the send blur so the two
   full-screen states feel like one thing. That is a deliberate walk-back of #3's letter, not an
   accident.
   A LITTLE TINT, AND ONLY HERE. Seth, 2026-08-28: "make it a litttttle bit more opaque just when
   its maximized." Send keeps the bare blur; the box you are typing INTO gets something to sit on,
   because #3's complaint was about reading, and here there are words of your own on top. 30% is
   the middle stop of the veil's own history — 62, then 31, then none — so it is the darkness that
   was already looked at and not rejected. Mixed from `--doc-bg`, the theme's own paper, and never
   a literal: 62% of Obsidian and 62% of Parchment are not the same colour and only one of them
   was ever chosen by eye. Declared after the shared rule above, which is what overrides its
   `transparent`; the blur stays shared so the two cannot drift on radius. */
#dock.big { position:fixed; inset:0; z-index:41; padding-top:calc(14px + env(safe-area-inset-top, 0px));
  background:color-mix(in srgb, var(--doc-bg) 30%, transparent); }
#dock.big #dockCol { flex:1; min-height:0; }
#dock.big #inputRow { flex:1; min-height:0; align-items:stretch; }
/* No inline height is set in this mode, so the flex box is the height and the text scrolls in it. */
#dock.big #input { max-height:none; height:auto; }
#input::placeholder { color:var(--label); opacity:.75; }
@media (max-width:719px) { #input { padding:16px 0; min-height:56px; }
  #inputRow { padding-bottom:12px; } }
/* ONE RULE, TWO BUTTONS. Seth: "the maximize button can we style it the same as the send button."
   Shared rather than copied — a second declaration of the same shape is how the two drift, and
   these two flank the box and are read as a pair. #send keeps its own busy state below; nothing
   else here is specific to either.
   VERTICAL RECTANGLES, not discs: 34x44 on a desk and 44x56 on a phone. Taller than wide, so they
   read as the ends of the row the box runs between rather than as two buttons that happen to sit
   near it. The phone width stays at 44 because that is the touch floor; the height grows instead.
   The glyph colour is HERE and not inline on the button — an inline `color:var(--faint)` is what
   kept the arrow grey after this rule was written, which is the second time an inline style on
   that exact button has beaten a stylesheet. */
#send, #inputRow button[data-bigin] {
  width:28px; height:44px; border-radius:var(--r); background:var(--gold); color:var(--on-gold);
  display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto;
}
#send:disabled { opacity:.4; }
/* Writing. The same button, in the same place, saying the one thing it can do now — a disabled
   "…" was a control you could look at and not use, which is what a Stop button is for. Not red:
   stopping your own generation is an ordinary move, not a destructive one, and the passage is
   discarded rather than anything of yours being lost. */
#send.stopping { background:var(--edge-lit); color:var(--ink-bright); font-size:11px;
  animation:breathe 1.6s var(--ease) infinite; }
@keyframes breathe { 0%,100% { opacity:1 } 50% { opacity:.62 } }
/* ISSUE #3 — "the send button and the expand input button are too small". They were: 30px for
   Send on a phone, and the expand button had no box at all — just a 13px glyph with 2px of
   padding, so its tap target was roughly the size of the character. 44px is the floor every
   touch guideline agrees on and F34 is this project's own evidence for why it matters here: a
   press that drifts 24px is a press this surface can already lose, and a target smaller than the
   finger makes the drift the rule rather than the exception.
   Send keeps its 34px on a desktop, where the pointer is exact and a 44px gold disc is a blot. */
/* THINNER ON THEIR SIDES. 38px, not 44 — the touch floor is about the SMALLEST dimension of a
   target and these are 56 tall, so the area is half again what a 44 square gives. The check
   below asserts the short side and the area together for exactly that reason. */
@media (max-width:719px) { #send, #inputRow button[data-bigin] { width:38px; height:56px; font-size:18px; } }
/* The GLYPH, not just the box. The box went to 44px on a phone and the arrow stayed tiny, because
   the button carried `font-size:13px` INLINE and an inline style beats a stylesheet — so the rule
   below was being written and never applied. Seth: "the expand button however is still very very
   small. The icon at least is very very small." The inline sizing is gone; this owns it. */
#inputRow button[data-bigin] { padding:0; }


/* --- side panel -------------------------------------------------------- */
#sideHead { display:flex; align-items:center; gap:12px; padding:20px 22px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; color:var(--ink); }
#sideBody { padding:18px 22px 30px; flex:1; min-height:0; display:flex; flex-direction:column; color:var(--ink); }
@media (max-width:719px) { #sideHead { padding:18px 20px 12px; } #sideBody { padding:10px 20px 26px; } }
/* REAL CAPITALS — Seth, 2026-09-03: "the labels are all weird lets make it all caps locked
   instead."
   The app wore the font-variant route for years: every letter the same short height at first, then
   one round with a tall capital and a short rest. He read the second as wrong,
   which it was — small caps mixes two heights inside a word, and at 11px with tracking that reads
   as a mistake rather than as a style. `text-transform:uppercase` is the third answer and the plain
   one: every letter a full capital, one height, at the size the rule already sets.
   IT IS A DIFFERENT PROPERTY, and that is the part that bites. Two rules in this file exist to take
   the label treatment OFF something — the open list of names under the composer, and the first-run
   buttons that read as sentences — and both named the old property. A reset naming a property
   nothing sets any more undoes nothing, so both moved with it.
   Forty rules across this file and web/app.js, changed together, because two spellings of one label
   style is the drift that made this a sweep rather than a fix. test/web.ts holds that line. */
.lbl { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:14px 0 5px; }
.lbl:first-child { margin-top:0; }
.field { background:var(--field); border:1px solid var(--chip); border-radius:var(--r); padding:10px 13px; font-size:13.5px; line-height:1.5; color:var(--ink); width:100%; font-family:inherit; }
textarea.field { resize:vertical; min-height:70px; }
.hint { font-size:11.5px; color:var(--mute); line-height:1.5; margin:6px 0 0; }
/* A TAB'S CONTENTS. `hidden` is the attribute the markup already sets, and this is what makes it
   mean something on a flex child — the UA sheet's `[hidden]{display:none}` loses to `display:flex`
   from a more specific rule, which is a way to ship four tabs that are all always open. */
.pane[hidden] { display:none !important; }
.card { border:1px solid var(--chip); border-radius:var(--r); padding:13px 15px; display:flex; flex-direction:column; gap:5px; }
/* A FOLDED EXPLANATION IS NOT A CARD. It was `.card` for a day and that was wrong twice over.
   A card in this app is CONTENT — a thread, a proposal, a summary — and `#sideBody .card` is how
   several places reach for one; an explanation wearing the same class put a dozen hidden decoys in
   that list, and test/ui/panels.js started clicking one instead of a thread. It also has to FOLD:
   `display:flex` is more specific than the UA sheet's `[hidden]{display:none}`, so without the rule
   below every one of them ships open and every mark does nothing.
   Same look, its own name, so neither problem can come back. */
.tipcard { border:1px solid rgba(217,178,106,.28); border-radius:var(--r); padding:13px 15px;
  display:flex; flex-direction:column; gap:7px; margin:2px 0 12px;
  font-size:12.5px; line-height:1.6; color:var(--mute); }
.tipcard[hidden] { display:none !important; }
/* THE PLATE — a thread, at both ends. The 2026-09-02 handoff: the story panel's list and the
   cross-book Threads page used the same renderer and still read as two kinds of thing, because the
   card was a generic card. A raised sheet with a serif name and a gold spine says "this is a thread"
   wherever it is.
   The spine is a BORDER-LEFT rather than a pseudo-element, so the picked state can recolour it
   without a second rule reaching inside the card. */
/* HEIGHT:AUTO, AND IT IS NOT DECORATION — Seth, 2026-09-02: "if a card has an image it cuts off the
   information." TWO THINGS ARE CALLED `plate` in this stylesheet: the chapter hero above a
   chapter's title, which is `position:relative; height:210px; overflow:hidden` by design, and this,
   the treatment a thread card wears. A card matching both took the hero's fixed height and its
   overflow — so a card with a picture in it was 210px of card holding 104px of picture, and the
   body under it was clipped rather than shown. `min-height` here was written as the floor of a box
   that had no ceiling; the ceiling came from the other rule and nobody had put it there.
   The name collision is the real fault and it is worth renaming one of the two; this is the fix
   that does not touch the chapter hero on the way past. */
.card.plate { background:var(--sheet); border:1px solid var(--edge); border-left:3px solid var(--gold-dim);
  border-radius:var(--r); padding:16px 18px; gap:7px; min-height:150px;
  height:auto; overflow:visible; }
.card.plate .platename { font-family:'Instrument Serif', var(--serif, serif); font-size:22px;
  line-height:1.15; color:var(--ink-bright); }
.card.plate .tag.alwayson { border:1px solid rgba(217,178,106,.4); color:var(--gold);
  white-space:nowrap; }
/* THE HANDOFF'S PICKED STATE IS NOT HERE, and that is deliberate rather than an omission. Nothing
   sets `aria-pressed` on a plate: the only place a thread is picked is the cross-book seed picker,
   and that is `data-seedpick`, a different renderer with its own chosen treatment. A rule written
   for a selector no markup carries is a rule that looks tested and is not.
   Its warning is worth keeping even so, because it is about this file: a bare colour passed as the
   whole `border` shorthand silently drops the declaration, and the card loses its edge and ground
   with it. Every property above is named for that reason. */
/* Summaries are supposed to be ~180 words and arrive at four times that, so they are clamped
   for the same reason canon flags are: the panel is an index, not a reading surface. */
.clamp { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
[aria-expanded="true"] > .clamp { -webkit-line-clamp:unset; }
.tag { font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:2px 8px; border-radius:var(--r-pill); border:1px solid var(--chip); color:var(--dim); white-space:nowrap; }
.kind { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-dim); }
.row { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); font-size:12.5px; }
.btn { padding:12px; text-align:center; border-radius:var(--r-pill); background:var(--gold); color:var(--on-gold); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; display:block; width:100%; }
.btn.ghost { background:none; border:1px solid var(--chip); color:var(--mute); font-weight:400; }

/* ISSUE #33 · A PANEL'S OWN SAVE, PINNED WHERE IT CAN BE REACHED. Seth, 2026-08-31: "All save
   buttons must be at the top and should be sticky."

   NOT A NEW PATTERN — the card form's head has done exactly this since it was written
   (`cardHead` in app.js: sticky, top 0, --rail behind it). This is that, named, so the three
   panels with a whole-panel Save stop each writing their own copy of it.

   THE NEGATIVE GUTTER IS LOAD-BEARING. #sideBody carries 22px of side padding, so a bar left at
   its content width covers the middle of the form and lets it slide past in the 22px either side.
   Pulled out to the panel edges and re-padded, the bar is opaque all the way across.

   `top:0` holds against #sideBody because that is the scroll container — it carries `.scroll`, and
   the settle animation on its children ends at `transform:none`, so nothing here inherits a lasting
   transform that would break sticky. (Do not write the at-rule name for that animation in here:
   test/web.ts counts declarations by scanning this file, and a mention in a comment reads as a
   second declaration. It cost a red on 2026-08-31.) */
/* ISSUE #38 · THE RE-ROLL INSTRUCTION, UNDER THE PASSAGE IT PRODUCED. Seth, 2026-09-01: "I should
   be able to edit the regenerate command."

   Inside .block, so it inherits the column width and sits with the paragraph rather than floating
   over it. Its own ground and a gold edge, because it is a control in a column of prose and has to
   read as one — the passage above it is the thing being replaced. */
/* bugs.md #9 · A PASSAGE THAT ARRIVED WITH NOBODY WATCHING. Quiet on purpose: it is provenance, not
   a question. The prose is already in the book and everything you might do to it is on its tray. */
.cameback {
  margin:8px 0 0; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--gold-dim);
}

/* CENTRED ON THE SCREEN, NOT UNDER THE PARAGRAPH — Seth, 2026-09-02: "this should be as a toast
   center screen not inline." It was a panel that opened inside the block, so on a long passage the
   instruction you were editing arrived below the fold of the paragraph it belongs to.
   THE SAME ROUTE THE ACTS TRAY TAKES, and for the reasons written at length above that rule: a
   `position:fixed` child of a block carrying a filled transform animation or a mask is positioned
   against the BLOCK rather than the window, and its z-index is capped inside it — so the block gets
   the same two clauses while this is open. Third round of that bug; second feature to need the fix.
   The scrim rises under it on `html[data-rerollsheet]`, so a press outside is Cancel. */
.rerollbox {
  margin:14px 0 4px; padding:12px 14px; border-radius:var(--r);
  border:1px solid rgba(217,178,106,.32); background:var(--sheet);
}
.rerollbox textarea { min-height:52px; }
.block.rerolling .rerollbox {
  position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); z-index:32; margin:0;
  width:min(460px, calc(100vw - 44px)); max-height:80vh; overflow-y:auto;
  padding:18px 20px; box-shadow:0 40px 90px rgba(0,0,0,.7);
}
html[data-rerollsheet="1"] #scrim { opacity:1; pointer-events:auto; z-index:31; }

.savebar {
  position:sticky; top:0; z-index:2; background:var(--rail);
  margin:0 -22px 18px; padding:12px 22px; border-bottom:1px solid var(--line);
}
/* The button carries its own inline margins at every call site; inside the bar the padding is the
   spacing, so they are overridden here rather than removed one by one. */
.savebar > .btn { margin:0 !important; }
@media (max-width:719px) { .savebar { margin:0 -20px 14px; padding:10px 20px; } }
/* FLUSH UNDER THE PANEL HEAD. Seth, 2026-09-01, of the Read / Edit / Back bar on a thread: "theres
   a space above it and the threads and close section can we remove the padding and make the
   background full width of the panel." #sideBody's own top padding sat between the head's border
   and the bar, so the bar read as a floating strip rather than a second row of the header.

   THE PADDING GOES; A NEGATIVE MARGIN DOES NOT WORK HERE. Measured in the driver: -18px on the bar
   moved its static position up to the head, and then sticky clamped it straight back down, because
   a sticky box is held inside its containing block and that is the panel's flex wrapper, whose own
   top the child's margin does not move. The bar sat at exactly the same 18px and the computed style
   said -18px, which is the shape of a fix that reads as applied and is not. Dropping the padding
   moves the wrapper instead, so there is nothing left to clamp against.

   `:has()` and `:first-child` because the padding must only go when a bar is what LEADS the panel:
   one that opens on a label still wants its 18px, and one with its help web open puts that card
   first, which turns this rule off on its own rather than pulling the bar up underneath it. Two
   shapes to match — most panels return a flex-column wrapper with the bar inside it, and a bar
   written as a direct child of #sideBody would miss a rule aimed only at the nested one.

   This is every savebar in the app, not only the thread card's: the gap above them is one bug in
   one component, and fixing it in one place is the point of having the component. Measured rather
   than eyeballed — test/ui/panels.js asserts the gap, the inset and the width in pixels, because
   the first attempt here was invisible to every source-level check in the repo.

   A HIDDEN EXPLANATION DOES NOT COUNT AS LEADING THE PANEL, and that is the two extra selectors.
   The four panels with a web of their own used to render nothing at all while it was shut; since
   2026-09-03 the card is always in the document and merely `hidden`, so it became `:first-child`
   and turned this rule off on every one of them — an 18px gap above the bar, permanently, on
   Threads, Strings, Context and Anansi. `:first-child` is structural and does not care that the
   element draws nothing, so the exception has to be written out.
   `[hidden]` is doing the work: shut, the bar is still what leads the panel and stays flush; OPEN,
   the card really does lead and the padding comes back, which is what the paragraph above wanted. */
#sideBody:has(> .savebar:first-child),
#sideBody:has(> :first-child > .savebar:first-child),
#sideBody:has(> .tipcard[hidden]:first-child + .savebar),
#sideBody:has(> .tipcard[hidden]:first-child + * > .savebar:first-child) { padding-top:0; }
/* THE LONG WAY ROUND, FOLDED. A <details>, because the browser already has this and a state flag
   plus a repaint would throw away whatever is half-typed inside the fold. The default marker goes
   — it is a black triangle no theme here would own — and the chevron is text, so it takes the
   theme's colour like everything else. */
/* A FOLD'S HEADING IS A LABEL — Seth, 2026-09-03: "i have labels that are not." These are
   Over time, Brings in with it and Another book, and they were the one heading shape in the app
   that never wore the treatment, because they are a <summary> rather than a .lbl. */
details.fold > summary { list-style:none; cursor:pointer; padding:10px 0; font-size:11.5px;
  color:var(--mute); letter-spacing:.1em; text-transform:uppercase; }
details.fold > summary::-webkit-details-marker { display:none; }
details.fold > summary::before { content:'\203A\00a0'; color:var(--faint); }
details.fold[open] > summary::before { content:'\2304\00a0'; }
.meter { display:flex; height:6px; border-radius:var(--r-tight); overflow:hidden; background:var(--chip); margin:10px 0 6px; }

/* --- workspace pages --------------------------------------------------- */
#page { position:relative; flex:1; min-height:0; padding:30px 40px; }
@media (max-width:719px) { #page { padding:20px 18px; } }
/* PORTRAIT, at Seth's direction: "like a phone wallpaper". A cover is a book's face and a book is
   taller than it is wide, so the grid holds more of them across and each one is a page rather than
   a banner. Two on a phone, because a portrait card at full width is one book per screen. */
/* #22. Every card the same height in the selectable view. `.card` has no height cap and the body
   printed whole, so one long thread made a tall card and the whole grid row stretched to it — a
   shelf of even cards with one giant among them. Three lines and a fixed height, so the grid is a
   grid; the whole body is one press away on the card itself. */
.clamp3 { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* Two lines, for the Chapters panel's opening sentence: a first sentence can be a paragraph long
   and a row that grows with it stops being a row. Same idiom as the two above it. */
.clamp2 { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.grid > .card { min-height:132px; }

.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-content:start; }
@media (max-width:1099px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:719px) { .grid { grid-template-columns:repeat(2,1fr); gap:12px; } }
.split { display:flex; gap:32px; align-items:flex-start; }
@media (max-width:719px) { .split { flex-direction:column; } }
.aside { width:400px; flex:0 0 auto; }
@media (max-width:1099px) { .aside { width:320px; } }
@media (max-width:719px) { .aside { width:100%; } }
/* A COLUMN, NOT A BLOCK, and that is the whole of the fix for Seth's 2026-09-02 report: "some of
   the covers are being pushed down so you cant see the whole thing her as well as the labels."
   MEASURED at 768px: three cards in a row, every one 527px tall because the grid stretches them to
   the tallest, every cover 278px — and the cover's top sat 1px inside the card on the one with the
   longest blurb, 39px on the next and 70px on the third. The slack was split ABOVE and BELOW the
   art, so the cover and the genre tags on it slid down the card by half the difference.
   A BUTTON CENTRES ITS OWN CONTENT. The card is a button element and `display:block` does not stop
   the UA centring its inner box vertically, so any card shorter than its row got the difference
   shared between its two ends. An explicit flex column takes the centring away and puts the slack at the
   bottom, where it is a card that ends early rather than a cover that has moved. */
.storycard { cursor:pointer; border-radius:var(--r); overflow:hidden; border:1px solid var(--edge); background:var(--rail); text-align:left; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; width:100%;
  /* A shelf of objects standing on a surface rather than a grid of tiles. The whole of the
     "more bookshelf" brief is this shadow and the spine below it — no paper texture, no plinth,
     no painted-on lighting. */
  box-shadow:0 20px 44px -18px rgba(0,0,0,.9); }
/* The spine, down the LEFT edge, drawn on .art rather than as another element because the card's
   markup is already six deep and a pseudo-element cannot be forgotten by a caller. */
.storycard .art::after { content:''; position:absolute; top:0; bottom:0; left:0; width:7px;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.05) 60%,rgba(0,0,0,.3)); }

/* FOUR ACROSS, not the three of .grid — and its own class rather than a wider .grid, because
   .grid is the Threads and Waiting card grid too and those hold text cards, not covers. */
.shelfgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:22px; align-content:start; }
@media (max-width:1099px) { .shelfgrid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:719px) { .shelfgrid { grid-template-columns:repeat(2,1fr); gap:12px; } }

/* FIRST RUN. Centred in the page rather than pinned to the top, because there is nothing above it
   to be under and a heading alone at the top of an empty screen reads as a page that failed to
   load. */
.firstrun { display:flex; flex-direction:column; justify-content:center; gap:26px;
  min-height:min(560px, 70vh); max-width:900px; }
/* The one gold line on the screen. A border under the input rather than a box around it: this is
   the thing to type in, and a field among three outlined buttons is not obviously that. */
.sparkline { display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--gold);
  padding-bottom:14px; }
.sparkline > textarea { flex:1; min-width:0; background:none; border:0; padding:0; resize:none;
  font-size:17px; line-height:1.55; color:var(--ink); min-height:27px; field-sizing:content; }
.sparkline > textarea:focus { outline:none; }
.firstways { display:flex; gap:10px; flex-wrap:wrap; }
.firstways > .btn { width:auto; padding:9px 14px; height:auto; font-size:12px; letter-spacing:0;
  /* Same move: this deliberately takes the label treatment OFF the first-run buttons, which read as
     sentences rather than as labels, so the property it names has to be the one now doing it. */
  text-transform:none; font-weight:400; border-radius:var(--r); }
@media (max-width:719px) {
  .firstrun { gap:22px; min-height:0; }
  .firstrun .serif { font-size:34px; }
  .firstways { flex-direction:column; }
  .firstways > .btn { width:100%; text-align:center; }
}

/* THE RESUME BAND. Structural only: everything that depends on which book it is drawing stays
   inline in resumeBand().

   The height is the constraint. Covers are portrait, so a card at four across is about 420px and
   the first shelf row only clears a 900px window if this stays under ~310. max-height rather than
   height, because a book with two chapters has less to say than one with nine and should not be
   padded out to the same size. */
/* NO max-height, and it is not an oversight. This band is a flex item in the page's column, so
   its automatic minimum size is its own content — `min-height:auto` floors a flex item and beats
   `max-height` outright. A cap here measured 262 and laid out at 283, which is a number that lies.
   `min-height:0` would let it clamp, and then `overflow:hidden` would cut the actions off the
   bottom, which is worse than a tall band. So the height is bought from the content instead: the
   type sizes and the gaps below are what keep it near 255, and that is what the assertion watches
   through the first shelf card's bottom edge. */
.resumeband { display:flex; align-items:stretch; border:1px solid var(--edge);
  border-radius:var(--r); overflow:hidden; background:var(--rail);
  box-shadow:0 26px 60px -20px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.02) inset;
  animation:rise var(--t-slow) var(--ease) both; }
.resumeband > .art { flex:0 0 268px; position:relative; display:block; cursor:pointer; }
/* Left to right, not top to bottom: the text sits to the right of this, so the cover has to fall
   away towards the words rather than towards its own bottom edge. */
.resumeband > .art .wash { position:absolute; inset:0;
  background:linear-gradient(90deg,rgba(10,10,12,0) 50%,rgba(12,12,14,.7)); }
.resumeband > .art .spine { position:absolute; top:0; bottom:0; right:0; width:9px;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.045) 55%,rgba(0,0,0,.35)); }
.resumeband > .said { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px;
  padding:18px 30px 16px; }
/* The band's own type. In CSS rather than inline on the spans because a phone has to make all
   three of these smaller at once, and a media query cannot reach an inline style. */
.resumeband .bandhead { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.resumeband .bandtitle { font-size:36px; line-height:1.02; color:var(--ink-bright); }
.resumeband .bandchapter { font-size:19px; font-style:italic; color:var(--label); }
.resumeband .bandprose { font-style:italic; font-size:17px; line-height:1.6; color:var(--narr);
  text-wrap:pretty; }
.resumeband .bandgo { width:auto; padding:0 24px; height:38px; }
.resumeband .bandacts { display:flex; align-items:center; gap:10px; margin-top:auto; flex-wrap:wrap; }
.resumeband .bandgap { flex:1; }
.resumeband .bandchips { display:flex; gap:8px; }
.resumeband .quote { display:flex; align-items:flex-start; gap:16px; max-width:680px; min-width:0; }
.resumeband .quote > .rule { width:1px; align-self:stretch; background:var(--gold-dim); opacity:.5;
  flex:0 0 auto; }
/* One segment per chapter. Written behind you, the one you are in wider and lit, the rest still
   to come — the same three states the chapter list uses, at 5px. */
.bandmeter { display:flex; gap:3px; height:5px; }
.bandmeter > i { flex:1; border-radius:var(--r-tight); background:var(--chip); }
.bandmeter > i.done { background:var(--gold-dim); }
.bandmeter > i.now { flex:1.4; background:var(--gold); }

/* A 268px cover beside text does not fit a phone, so the band stacks and the cover becomes a
   letterbox above the words. It keeps its shadow; the spine goes, because a spine down the right
   edge of something with nothing to its right is a line for its own sake. */
@media (max-width:719px) {
  .resumeband { flex-direction:column; max-height:none; }
  .resumeband > .art { flex:0 0 132px; }
  .resumeband > .art .wash { background:linear-gradient(180deg,rgba(10,10,12,0) 30%,rgba(12,12,14,.92)); }
  .resumeband > .art .spine { display:none; }
  .resumeband > .said { padding:14px 16px 16px; gap:11px; }
  /* Everything comes down a size, or the band alone is most of a phone screen: the title wraps to
     two lines at 36px in 353px of width, and each wrap is a row of the shelf pushed off the
     bottom. */
  .resumeband .bandtitle { font-size:27px; }
  .resumeband .bandchapter { font-size:15px; }
  .resumeband .bandprose { font-size:14.5px; line-height:1.55; }
  /* The gold action takes the width, because that is where a thumb is. The second button keeps its
     own row rather than being dropped — reading from the top is not a desk-only intention. */
  .resumeband .bandgo { width:100%; padding:0 16px; }
  /* The title over the cover. `bottom` measured from the band's own box puts the head's baseline
     block on the art's bottom edge — the art is the first 132px of a stacked band, so
     `calc(100% - 132px)` is that edge and nothing has to know the title's own height. */
  .resumeband { position:relative; }
  .resumeband .bandhead { position:absolute; left:16px; right:16px; bottom:calc(100% - 132px);
    padding-bottom:9px; }
  /* The two chips take a row of their own and split it, because at 353px they do not sit beside
     two buttons and wrapping them one per line is three rows of chrome under the prose. */
  .resumeband .bandgap { display:none; }
  .resumeband .bandchips { width:100%; gap:7px; }
  .resumeband .bandchips > .chip { flex:1; text-align:center; }
}
/* 3:4, the shape of a page. Set as an aspect-ratio rather than a height so the card holds its
   proportions at every column width the grid resolves to. */
.storycard .art { aspect-ratio:3/4; height:auto; position:relative; }
.storycard .art .fade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,10,12,0) 35%,rgba(10,10,12,.92)); }
.dashed { border-radius:var(--r); border:1px dashed var(--chip); min-height:200px; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--faint); }

/* #read and #dock set display:flex, which beats the UA's [hidden]{display:none}. Without this
   the document region stays on screen behind the workspace pages. */
#read[hidden], #dock[hidden], #page[hidden] { display:none !important; }

/* THE STORY PANEL'S FOUR GROUPS. Only one is on screen and the container's attribute says which —
   see the note in `story()` for why this is CSS and not a redraw: every field in there is free text
   that Save commits, and a repaint on a tab press loses whatever was half-typed. */
.sgroup { display:none; flex-direction:column; }
[data-tab="voice"] > .sgroup[data-group="voice"],
[data-tab="book"]  > .sgroup[data-group="book"],
[data-tab="world"] > .sgroup[data-group="world"],
[data-tab="keep"]  > .sgroup[data-group="keep"],
/* AND THE CHAPTER PANEL'S FOUR, on the same mechanism. Seth, 2026-09-03: "everything here should
   also use the tab system to split information." The two panels are never on screen together —
   there is one side panel — so they share `data-tab` and `.sgroup` rather than growing a second
   copy of this idea. Four more names here is the price of that, and it is the right price: a
   generic rule cannot match one attribute against another in CSS. */
[data-tab="this"]      > .sgroup[data-group="this"],
[data-tab="proposed"]  > .sgroup[data-group="proposed"],
[data-tab="summaries"] > .sgroup[data-group="summaries"],
[data-tab="branches"]  > .sgroup[data-group="branches"] { display:flex; }

/* IN THE MIDDLE OF THE SCREEN, not on the bottom edge — Seth, 2026-09-02: "all the site toast
   notifications should be centered to the screen and styled." It sat 26px off the bottom, directly
   over the composer, which is both the place a writer's eyes are NOT and the one control it was
   usually telling them to use. Centred, it is read before it goes.
   THE ACCENT IS THE EDGE, the same gold-dim-to-gold vocabulary the composer's field and the two
   dials use, on the app's own sheet rather than the field grey. Small caps would be wrong: this is
   a sentence to read, not a label. */
#toast {
  position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); z-index:60;
  /* Nothing in a toast is clickable, and it used to sit directly over the composer. Without this it
     swallowed every click on the input for 4.2 seconds — so the error telling you to type
     something was the thing stopping you from typing it. It is over the prose now, which is worse
     to block, not better. */
  pointer-events:none;
  background:var(--sheet); border:1px solid var(--gold-dim); color:var(--ink-bright);
  padding:14px 22px; border-radius:var(--r); font-size:13.5px; line-height:1.45; text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.72); max-width:min(74vw, 460px);
}
/* The @ menu. Floats ABOVE the ask box rather than sitting in the column, so opening it moves
   nothing — the whole point of a menu that appears while you are mid-sentence. Opaque, because it
   sits over the conversation you are reading. */
#atlist {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:6px; z-index:3;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlist[hidden] { display:none; }

/* The mirror behind the ask box. Every property that affects WRAPPING is set on both at once —
   two declarations for one shape is how they drift apart and the highlight ends up a line above
   what it is highlighting. */
#askWrap { position:relative; display:flex; }
#askWrap > #askMirror, #askWrap > #askBox {
  font:inherit; font-size:13.5px; line-height:1.55; letter-spacing:normal;
  padding:11px 13px; border:1px solid transparent; border-radius:var(--r);
  white-space:pre-wrap; overflow-wrap:break-word; word-break:normal;
}
#askWrap > #askBox { position:relative; z-index:1; background:transparent; flex:1; min-width:0; }
#askMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
}
/* Only what is going to be SENT is marked. Nothing else in this app tints text, so the tint is
   unambiguous: it means she is getting the thing and not only the word. */
/* THE WORD IS THE ACCENT, not a block of colour behind it. Seth: "let's not make it gold, let's
   just make the word the accent color of the theme that is currently selected."
   `--gold` was already the theme's accent — `themeVars` writes it from `S.accent` — so on
   Cyberpunk it was already teal and on Novelist already red. What it was NOT was the word: it was
   a tint behind transparent text, which reads as a highlighter pen rather than as a mark.
   So the mirror stops being invisible: it renders ALL the text, and the textarea's own text goes
   transparent with only its caret left. That is the one way to colour part of a textarea, and it
   is why the two must agree about every property that affects wrapping — the mirror is what you
   are reading now, not a layer behind what you are reading. */
#askBox, #input { color:transparent; caret-color:var(--gold); }
#askMirror, #inputMirror { color:var(--body); }
/* COLOUR ONLY. `font-weight:600` was here and it is what put the caret adrift: the mirror draws
   the text and the TEXTAREA carries the caret, so a mention rendered bolder than the invisible
   text under it is wider than the letters the caret is counting, and every character after it
   sits further from the cursor. Any property that changes a glyph's WIDTH breaks this pair.
   Seth: "the cursor is spaced out far away from the thing being written." */
#askMirror mark, #inputMirror mark {
  background:transparent; color:var(--gold); border-radius:0;
}
/* Selected text has to come back, or dragging over your own sentence selects a row of nothing.
   ::selection can restore a colour for the selected range even when the text under it is
   transparent, which is the one thing that makes the trick above survive being edited. */
#askBox::selection, #input::selection { color:var(--ink-bright); background:var(--edge-lit); }

/* The composer's mirror. Same trick as the ask box's and the same rule: every property that
   affects WRAPPING is set on both at once. #input is the one that already had its sizing, so the
   mirror inherits from it rather than restating it — a second copy of `padding:10px 0` is how the
   highlight ends up a line above the word it is highlighting. */
/* The colour lives HERE now, in the box itself, with the room to carry it. Horizontal padding
   arrives with the background — text against the edge of a filled box reads as a mistake — and
   the mirror takes the same, because the two must agree about every property that moves a glyph. */
/* THE ACCENT WRAPS THE FIELD. Seth, 2026-09-02: "the accented border here is inside the background
   of the text it should wrap around it so it doesnt look like the background is escaping." It was a
   1px gold line across the whole composer row, under a field whose own background stopped 14px
   short of it — so the line read as something the field's ground had leaked past rather than as its
   edge. On the field it follows the same rounded rectangle the background does.
   `box-sizing:border-box` is global here, so the border costs the field no height: the textarea is
   sized in JS and a box that grew by 2px would move the dock, which this project has three separate
   bug reports about. */
#inputWrap { position:relative; flex:1; min-width:0; display:flex; --field-pad:13px;
  background:var(--field); border:1px solid var(--gold-dim); border-radius:var(--r);
  padding:0 var(--field-pad); transition:border-color var(--t) var(--ease); }
html[data-ui-theme="parchment"] #inputWrap { border-color:rgba(58,52,43,.28); }
/* DIM UNTIL YOU ARE IN IT, and the full accent when you are — Seth, 2026-09-02: "the original one
   dimmed if not selected". The edge is the focus indicator, so it has to be the thing that changes.
   AND THE INNER RING GOES. The global `:focus-visible` rule puts a 2px outline on whatever has
   focus; on a textarea inside a padded wrapper that drew a second, smaller accent inside the first
   — "theres another accent that is smaller than the box. that needs to go." Dropped only for this
   one field, and only because the box it sits in lights up instead: a control with no focus
   indicator at all is the thing that rule exists to prevent. */
#inputWrap:focus-within { border-color:var(--gold); }
#inputWrap > #input:focus-visible { outline:none; }
/* The full-screen composer has no field to outline — it IS the screen. */
#dock.big #inputWrap { border-color:transparent; }
#dock.big #inputWrap { background:transparent; --field-pad:0px; }
#inputWrap > #input { position:relative; z-index:1; background:transparent; }
/* ONE DECLARATION FOR BOTH BOXES — the shape #askWrap already uses, and the shape the comment
   above claimed for this pair without ever having. They had a rule each and the mirror's lost:
   `#inputMirror { font-size:17px }` was declared HERE and `font:inherit; font-size:inherit` in the
   block below it, which wins on order at equal specificity. So the mirror drew at the inherited
   body size in every mode while the textarea drew at 17px. The caret counts the TEXTAREA's letters
   and you read the MIRROR's, so every character pushed the two further apart — Seth, 2026-08-28:
   "as you type it creates more and more space." One line of prose measured 333.3px in the textarea
   against 274.5px in the mirror before this rule; the same trap as `color:transparent` two blocks
   down, in the same block, found the same way. Every property that changes a glyph's WIDTH goes
   here and nowhere else. */
#inputWrap > #input, #inputWrap > #inputMirror {
  font:inherit; font-size:17px; line-height:1.55; letter-spacing:normal;
}
@media (max-width:719px) { #inputWrap > #input, #inputWrap > #inputMirror { font-size:15.5px; } }
/* The horizontal inset is the one thing they CANNOT share. The mirror is positioned against the
   wrap's PADDING box, so it begins outside the padding the textarea begins inside of and has to
   re-add it by hand. Taken from the wrap's own variable, so the maximized composer — which drops
   that padding to nothing — moves both boxes with one number instead of leaving the mirror inset
   13px from a caret that is not. */
#inputMirror { padding:9px var(--field-pad); }
@media (max-width:719px) { #inputMirror { padding:16px var(--field-pad); } }
#inputMirror {
  /* NOT transparent any more. The mirror was a layer behind visible text and is now the layer you
     READ — the textarea's own text is what went transparent. This line said `color:transparent`
     until 2026-08-28 and, being declared after the rule that sets the readable colour, it won:
     the mirror was invisible, the textarea was invisible, and typing produced nothing at all. */
  position:absolute; inset:0; z-index:0; color:var(--body); pointer-events:none;
  overflow:hidden; user-select:none;
  font:inherit; font-size:inherit; line-height:1.55; letter-spacing:normal;
  white-space:pre-wrap; overflow-wrap:break-word;
}

/* The composer's own @ list, above the row rather than below it — the dock is at the bottom of
   the screen and a menu under it would be off the edge. */
#atlistInput {
  position:absolute; bottom:100%; left:0; right:0; margin-bottom:8px; z-index:6;
  display:flex; flex-direction:column; gap:2px; padding:6px;
  border:1px solid var(--chip); border-radius:var(--r); background:var(--sheet);
  box-shadow:0 24px 60px rgba(0,0,0,.55); max-height:46vh; overflow-y:auto;
}
#atlistInput[hidden] { display:none; }
#inputRow { position:relative; }

#toast[hidden] { display:none; }

/* The dev-server banner. In flow above the header rather than floating over it: a strip that
   pushes the app down is one you cannot mistake for part of the app, and nothing here overlaps
   the bar, the rail or the composer. Hidden unless serve.ts stamped <body data-dev>, so the
   live server on 5174 serves this same file with no banner in it. */
#devbar { display:none; }
body[data-dev] #devbar {
  display:block; flex:0 0 auto; text-align:center; padding:4px 12px;
  background:var(--chip); color:var(--warn); border-bottom:1px solid var(--edge);
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
}
</style>
</head>
<body>

<div id="shell">
  <nav id="rail" aria-label="Anansi"></nav>
  <div id="scrim"></div>

  <!-- OUT OF #doc, 2026-08-28, and this is a positioning fix rather than a tidy-up. The panel is
       `position:fixed; inset:0` at phone width and measured full-viewport in headless Chrome at
       every UI scale — and on a real Android it rendered as a band between the header and the
       composer, with both showing above and below it. A `position:fixed` element is only fixed to
       the VIEWPORT while no ancestor makes itself the containing block, and any of transform,
       filter, backdrop-filter, perspective, will-change, contain or `zoom` does. `zoom` is on
       <body> for the UI scale (app.html:72) and the bar carries a backdrop-filter; which one it
       was on that device is not worth chasing, because the fix removes the dependency instead of
       naming the cause. `#shell` is ALREADY `position:fixed; inset:0`, so a child of it with
       `position:absolute; inset:0` fills the window with no fixed positioning involved at all.
       #rail and #scrim have always lived here for the same reason. -->
  <div id="appearance" hidden></div>

  <main id="doc">
    <div id="wash"></div>
    <div id="devbar">development server</div>
    <header id="bar"></header>
    <!-- The chapter meter, full width and immediately under the header. It was a 74px rule inside
         the running head, which put it into the one row that is hidden until you scroll. Seth: "it
         should span the full window".
         A DIV, NOT A BUTTON, since 2026-09-02: it counted context and its press opened the readout
         below. It counts chapters now and that readout is always open, so the press had nothing
         left to do — and a focusable button that does nothing is a promise the surface breaks. -->
    <!-- The cover, kept behind the prose while you read. Outside #read on purpose: a sticky
         element cannot leave its own scroller, so a backdrop that must not move cannot live in
         the thing that moves. -->
    <div id="backdrop" hidden aria-hidden="true"></div>
    <div id="ctxbar" hidden></div>
    <div id="ctxread" hidden></div>
    <div id="read" class="scroll"><div id="col"></div></div>
    <div id="page" class="scroll" hidden></div>
    <div id="dock">
      <!-- Above the mode rail and outside #dockCol, which is capped at the column width. Who you
           are speaking or acting as is not a mode, and sharing the rail with the four that are is
           what made it read as a fifth. -->
  <div id="dockCol"></div></div>
  </main>

  <aside id="side" hidden>
    <div id="sideInner">
      <div id="sideHead"></div>
      <div id="sideBody" class="scroll"></div>
    </div>
  </aside>
</div>

<!-- The generating ring. Fixed to the window and outside every panel, because it frames the
     SCREEN rather than any surface on it — see #frame in the stylesheet. -->
<div id="frame" aria-hidden="true"></div>
<div id="toast" hidden></div>

<script type="module" src="./web/app.js"></script>
</body>
</html>
